<script data-bundled-source="js/creator-store.js">
/* =====================================================================
 * 灵境 · 双生 — V23 创作功能区共享数据层 (creator-store.js)
 * 键：lingjing_v523_creator_v1（自有数据）+ lingjing_v520_wallet（灵晶，只读写余额字段）
 * 职责：
 *   1. 免费额度系统（V3.0 §2.2：智能体周10/图片日3/视频月1/声音日5/音色首次/灵念日1/Agent月3）
 *   2. 超额灵晶扣费（联动 lingjing_v520_wallet.crystal）
 *   3. 作品库（小说/角色/道具/场景）+ 互动管理四模块 + 动态/灵念/Agent行为
 *   4. 创作者等级（V3.0 §4.2 L1-L5）
 * 铁律：不接真支付；Toast 替代 alert；第三方名 0 出现
 * ===================================================================== */
window.CreatorStore = (function () {
  var KEY = 'lingjing_v523_creator_v1';
  var COIN_KEY = 'lingjing_v520_wallet';

  /* ---------- 额度配置（V3.0 §2.2）---------- */
  var QUOTAS = {
    agent:         { label: '创建智能体', limit: 10,  window: 'week',  cost: 0   },
    image:         { label: '创建图片',   limit: 3,   window: 'day',   cost: 20  },
    video:         { label: '创建视频',   limit: 1,   window: 'month', cost: 200 },
    sound:         { label: '创建声音',   limit: 5,   window: 'day',   cost: 10  },
    voiceClone:    { label: '复刻音色',   limit: 1,   window: 'ever',  cost: 50  },
    post:          { label: '创建动态',   limit: 999, window: 'day',   cost: 0   },
    card:          { label: '创建灵念',   limit: 1,   window: 'day',   cost: 30  },
    agentBehavior: { label: 'Agent 创建', limit: 3,   window: 'month', cost: 100 }
  };

  /* ---------- 基础存储 ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return seed();
  }
  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  }
  function seed() {
    var d = {
      quotaUse: {},           // {kind: {windowKey: count}}
      voiceCloneDone: false,  // 音色复刻首次免费标记
      works: [                // 预置演示作品（V3.0 §4.1 示例 · 仅公版名著）
        { id: 'w_novel', type: 'novel', title: '《西游记》', status: '已发布',
          words: '86.2万字', readers: '1.2万阅读', score: '4.8', income: 8400 },
        { id: 'w_char', type: 'character', title: '角色：孙悟空', status: '已发布',
          desc: '3,200次使用', income: 1800 },
        { id: 'w_prop', type: 'prop', title: '道具：如意金箍棒', status: '已发布',
          desc: '580次购买', income: 2600 }
      ],
      interactions: {         // 互动管理四模块（V3.0 §4.3）{charId: {kind: [items]}} · 示例仅公版角色
        char_wukong: {
          scenes: [
            { id: 's1', name: '和TA一起回水帘洞', open: '花果山飞瀑前，TA招手邀你进洞天',
              choices: 3, ending: '游览后各自归去，关系+2', rel: '+2' }
          ],
          events: [
            { id: 'e1', name: 'TA今天打了一件不平事', trigger: '亲密度≥30 · 上次互动>1天',
              content: 'TA主动发来消息，语气比平日更爽利', options: 3, result: '倾听后关系+3' }
          ],
          fragments: [
            { id: 'f1', name: 'TA的学艺记忆', unlock: '亲密度≥60', content: '一段可互动的回忆',
              options: 2, impact: '解锁隐藏对话' }
          ],
          missions: [
            { id: 'm1', name: '帮TA找回落海的兵器', goal: '找回沉入东海的趁手兵刃', nodes: 3,
              reward: '关系值+5 · 解锁新互动' }
          ]
        }
      },
      posts: [],              // 动态
      cards: [],              // 灵念卡牌
      behaviors: [],          // Agent 行为
      media: [],              // 生成记录（图/视频/声音）
      income: 12800,          // 总收益（灵晶）
      pending: 3200           // 待结算
    };
    save(d);
    return d;
  }

  /* ---------- 时间窗口键 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function windowKey(w) {
    var t = new Date();
    if (w === 'day') return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
    if (w === 'month') return t.getFullYear() + '-' + pad(t.getMonth() + 1);
    if (w === 'ever') return 'ever';
    if (w === 'week') { // ISO 周（周四定界）
      var d = new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()));
      var day = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - day);
      var y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      var wk = Math.ceil((((d - y0) / 86400000) + 1) / 7);
      return d.getUTCFullYear() + '-W' + pad(wk);
    }
    return 'na';
  }

  /* ---------- 灵晶（只读写 lingjing_v520_wallet 的 crystal 字段）---------- */
  function getCoins() {
    try {
      var c = JSON.parse(localStorage.getItem(COIN_KEY) || '{}');
      if (typeof c.crystal !== 'number') { c.crystal = 8888; c.jade = c.jade || 60; }
      return c;
    } catch (e) { return { crystal: 8888, jade: 60 }; }
  }
  function setCoins(c) {
    try { localStorage.setItem(COIN_KEY, JSON.stringify(c)); } catch (e) {}
  }

  /* ---------- Toast（铁律 #10：替代 alert/confirm）---------- */
  function toast(kind, title, msg) {
    var t = document.getElementById('lj-creator-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'lj-creator-toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);' +
        'z-index:9999;max-width:86%;padding:12px 18px;border-radius:14px;font-size:13px;' +
        'line-height:1.5;color:#fff;background:rgba(26,26,46,.94);border:1px solid rgba(233,69,96,.4);' +
        'box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center';
      (document.body || document.documentElement).appendChild(t);
    }
    var icon = kind === 'ok' ? '✅ ' : kind === 'warn' ? '⚠️ ' : 'ℹ️ ';
    t.innerHTML = icon + '<b>' + title + '</b>' + (msg ? '<br><span style="opacity:.8;font-size:12px">' + msg + '</span>' : '');
    t.style.opacity = '1';
    clearTimeout(toast._tm);
    toast._tm = setTimeout(function () { t.style.opacity = '0'; }, 2600);
  }

  /* ---------- 额度查询 ---------- */
  function quotaInfo(kind) {
    var q = QUOTAS[kind];
    if (!q) return null;
    var d = load();
    var wk = windowKey(q.window);
    var used = (d.quotaUse[kind] && d.quotaUse[kind][wk]) || 0;
    var unlimited = kind === 'post';
    return {
      kind: kind, label: q.label, used: used,
      limit: unlimited ? '∞' : q.limit,
      remaining: unlimited ? '∞' : Math.max(0, q.limit - used),
      freeLeft: Math.max(0, q.limit - used),
      cost: q.cost, window: q.window, unlimited: unlimited
    };
  }

  /* ---------- 消耗一次（额度内免费，超额扣灵晶）---------- */
  function consume(kind) {
    var q = QUOTAS[kind];
    var info = quotaInfo(kind);
    if (!q || !info) return { ok: false, reason: 'unknown-kind' };
    var d = load();
    var wk = windowKey(q.window);
    if (!d.quotaUse[kind]) d.quotaUse[kind] = {};
    var coins = getCoins();
    if (info.freeLeft > 0) {
      d.quotaUse[kind][wk] = info.used + 1;
      save(d);
      return { ok: true, free: true, charged: 0, balance: coins.crystal, left: q.limit - info.used - 1 };
    }
    if (q.cost <= 0) { // 无额度上限类（动态）
      d.quotaUse[kind][wk] = info.used + 1;
      save(d);
      return { ok: true, free: true, charged: 0, balance: coins.crystal, left: '∞' };
    }
    if (coins.crystal < q.cost) {
      return { ok: false, reason: 'insufficient', need: q.cost, balance: coins.crystal };
    }
    coins.crystal -= q.cost;
    setCoins(coins);
    d.quotaUse[kind][wk] = info.used + 1;
    save(d);
    return { ok: true, free: false, charged: q.cost, balance: coins.crystal, left: 0 };
  }

  /* ---------- 作品库 ---------- */
  function works(type) {
    var d = load();
    return type ? d.works.filter(function (w) { return w.type === type; }) : d.works;
  }
  function addWork(w) {
    var d = load();
    w.id = 'w_' + Date.now();
    w.status = w.status || '草稿';
    d.works.push(w);
    save(d);
    return w;
  }
  function removeWork(id) {
    var d = load();
    d.works = d.works.filter(function (w) { return w.id !== id; });
    save(d);
  }

  /* ---------- 互动管理四模块（V3.0 §4.3：scenes/events/fragments/missions）---------- */
  var IKIND = { scenes: '互动场景', events: '日常事件', fragments: '剧情碎片', missions: '共同任务' };
  function interactions(charId, kind) {
    var d = load();
    var c = d.interactions[charId] || {};
    return kind ? (c[kind] || []) : c;
  }
  function interactionCounts(charId) {
    var d = load();
    var c = d.interactions[charId] || {};
    var out = {};
    Object.keys(IKIND).forEach(function (k) { out[k] = (c[k] || []).length; });
    return out;
  }
  function addInteraction(charId, kind, item) {
    var d = load();
    if (!d.interactions[charId]) d.interactions[charId] = {};
    if (!d.interactions[charId][kind]) d.interactions[charId][kind] = [];
    item.id = kind.charAt(0) + Date.now();
    d.interactions[charId][kind].push(item);
    save(d);
    return item;
  }
  function removeInteraction(charId, kind, id) {
    var d = load();
    var c = d.interactions[charId];
    if (c && c[kind]) c[kind] = c[kind].filter(function (x) { return x.id !== id; });
    save(d);
  }

  /* ---------- 动态 / 灵念 / Agent 行为 / 媒体记录 ---------- */
  function addPost(p) { var d = load(); p.id = 'p_' + Date.now(); p.at = new Date().toISOString(); d.posts.push(p); save(d); return p; }
  function posts() { return load().posts; }
  function addCard(c) { var d = load(); c.id = 'c_' + Date.now(); c.at = new Date().toISOString(); d.cards.push(c); save(d); return c; }
  function cards() { return load().cards; }
  function addBehavior(b) { var d = load(); b.id = 'b_' + Date.now(); d.behaviors.push(b); save(d); return b; }
  function behaviors() { return load().behaviors; }
  function addMedia(m) { var d = load(); m.id = 'md_' + Date.now(); m.at = new Date().toISOString(); d.media.push(m); if (d.media.length > 50) d.media.shift(); save(d); return m; }
  function media() { return load().media; }
  function markVoiceCloneDone() { var d = load(); d.voiceCloneDone = true; save(d); }
  function voiceCloneDone() { return load().voiceCloneDone; }

  /* ---------- 创作者等级（V3.0 §4.2）---------- */
  var LEVELS = [
    { lv: 'L5', name: '传奇', share: '80%' },
    { lv: 'L4', name: '钻石', share: '75%' },
    { lv: 'L3', name: '黄金', share: '70%' },
    { lv: 'L2', name: '白银', share: '60%' },
    { lv: 'L1', name: '青铜', share: '50%' }
  ];
  function level() {
    var d = load();
    var inc = d.income;
    for (var i = 0; i < LEVELS.length; i++) {
      var th = { L5: 1000000, L4: 200000, L3: 10000, L2: 5000, L1: 0 }[LEVELS[i].lv];
      if (inc >= th) return LEVELS[i];
    }
    return LEVELS[4];
  }
  function incomeSummary() {
    var d = load();
    return { total: d.income, pending: d.pending, level: level() };
  }
  function addIncome(n) { var d = load(); d.income += n; save(d); }

  return {
    QUOTAS: QUOTAS, IKIND: IKIND,
    quotaInfo: quotaInfo, consume: consume,
    getCoins: getCoins, toast: toast,
    works: works, addWork: addWork, removeWork: removeWork,
    interactions: interactions, interactionCounts: interactionCounts,
    addInteraction: addInteraction, removeInteraction: removeInteraction,
    addPost: addPost, posts: posts,
    addCard: addCard, cards: cards,
    addBehavior: addBehavior, behaviors: behaviors,
    addMedia: addMedia, media: media,
    markVoiceCloneDone: markVoiceCloneDone, voiceCloneDone: voiceCloneDone,
    level: level, incomeSummary: incomeSummary, addIncome: addIncome
  };
})();

</script>
<script>
function showToast(kind, title, msg){
  var c = document.getElementById('toast');
  var t = document.createElement('div');
  t.className = 'toast-item ' + (kind || 'ok');
  t.innerHTML = '<span class="ti"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}

  { wid:'taohua',  title:'《桃花源记·同人》',  emoji:'📜', cov:'linear-gradient(160deg,#6B2737,#B8863B)', st:'draft',   kind:'novel', src:'上传',        words:'0.8 万字',  chap:'第 2 章',        info:'未完工 · 等待续写',   score:'—',    income:'',           cont:true },
  { wid:'hlmrev',  title:'《红楼梦 · 改版》',  emoji:'🏮', cov:'linear-gradient(160deg,#1F5C4D,#2E8B6E)', st:'review',  kind:'novel', src:'上传',        words:'31.0 万字', chap:'—',              info:'提交于 09-11 · 48 小时内出结果', score:'—', income:'', cont:false },
  { wid:'jiuri',   title:'《旧日灯火》',      emoji:'🕯️', cov:'linear-gradient(160deg,#5A2E3A,#7A3A4A)', st:'offline', kind:'novel', src:'上传',        words:'8.9 万字',  chap:'—',              info:'含未授权素材 08-30 下架 · 可申诉', score:'—', income:'412 灵晶', cont:false }
];

var ST_LABEL = { pub:'已发布', draft:'草稿 · 待续写', review:'审核中', offline:'已下架' };
var MW_TABS = [
  { id:'all',    label:'全部' },
  { id:'pub',    label:'已发布' },
  { id:'draft',  label:'草稿 · 待续写' },
  { id:'review', label:'审核中' },
  { id:'offline',label:'已下架' },
  { id:'asset',  label:'角色 · 道具' }
];
var curTab = 'all';

/* 合并 CreatorStore 真实作品（同名小说并入历史记录） */
function mwMerge(){
  var out = [];
  var idx = {};
  MW_HISTORY.forEach(function (h) {
    var r = {}; for (var k in h) r[k] = h[k];
    out.push(r); idx[h.title] = r;
  });
  var store = (window.CreatorStore ? CreatorStore.works() : []);
  store.forEach(function (w) {
    var title = w.title || '未命名作品';
    if (w.type === 'novel' && idx[title]) {
      var hit = idx[title];
      if (w.income) hit.income = w.income.toLocaleString() + ' 灵晶';
      if (w.words) hit.words = w.words;
      if (w.score) hit.score = w.score;
      return;
    }
    var isChar = w.type === 'character';
    var isProp = w.type === 'prop';
    var fresh = w.id && w.id.indexOf('w_') === 0 && w.id.length > 8;
    out.push({
      wid: w.id, title: title, st: (w.status === '已发布' ? 'pub' : 'draft'),
      kind: w.type || 'novel',
      emoji: isChar ? '🧑' : (isProp ? '⚔️' : '📖'),
      cov: isChar ? 'linear-gradient(160deg,#3A2E1A,#FFB347)'
         : (isProp ? 'linear-gradient(160deg,#1A2E3A,#6C5CE7)' : 'linear-gradient(160deg,#2E3A6E,#4A3A8C)'),
      src: fresh ? '创建' : '生成',
      words: w.words || '', chap: '', info: w.desc || '',
      score: w.score || '—', income: w.income ? w.income.toLocaleString() + ' 灵晶' : '',
      cont: false, asset: isChar || isProp
    });
  });
  try { localStorage.setItem(MW_KEY, JSON.stringify({ syncedAt: new Date().toISOString(), total: out.length })); } catch (e) {}
  return out;
}

function mwMatch(w){
  if (curTab === 'all') return true;
  if (curTab === 'asset') return !!w.asset;
  return w.st === curTab;
}

function renderTabs(){
  var host = document.getElementById('mw-tabs');
  var html = '';
  MW_TABS.forEach(function (t) {
    html += '<div class="mw-tab' + (curTab === t.id ? ' on' : '') + '" data-tab="' + t.id + '">' + t.label + '</div>';
  });
  host.innerHTML = html;
}

function renderList(){
  var all = mwMerge();
  var list = all.filter(mwMatch);
  var pub = all.filter(function (w) { return w.st === 'pub'; }).length;
  var draft = all.filter(function (w) { return w.st === 'draft'; }).length;
  document.getElementById('mw-sum').innerHTML =
    '共 <b>' + all.length + '</b> 部<span class="sep">·</span>已发布 <b>' + pub + '</b><span class="sep">·</span>' +
    '草稿/待续写 <b>' + draft + '</b><br/>点「继续续写 / 编辑」进入编辑器：改正文、换图、调收费点';
  var box = document.getElementById('mw-list');
  document.getElementById('mw-empty').style.display = list.length ? 'none' : '';
  var html = '';
  list.forEach(function (w) {
    var meta = [];
    if (w.words) meta.push(w.words);
    if (w.info) meta.push(w.info);
    if (w.score && w.score !== '—') meta.push('★ ' + w.score);
    var acts = '';
    if (w.asset) {
      acts += '<span class="a primary" onclick="showToast(\'info\',\'编辑' + (w.kind === 'character' ? '角色' : '道具') + '\',\'在灵境工坊素材库中修改\')">✏️ 编辑</span>';
      acts += '<a class="a" href="workshop.html">🛠 工坊</a>';
    } else if (w.st === 'offline') {
      acts += '<a class="a primary" href="creator-legal.html">⚖️ 申诉</a>';
      acts += '<a class="a" href="work-editor.html?w=' + w.wid + '&tab=edit">✏️ 修改后重新提交</a>';
    } else if (w.st === 'review') {
      acts += '<a class="a" href="work-editor.html?w=' + w.wid + '&tab=quality">🔍 查看质检</a>';
      acts += '<a class="a ghost" href="dashboard.html">📊 数据</a>';
    } else {
      acts += '<a class="a primary" href="work-editor.html?w=' + w.wid + '&tab=edit">' + (w.cont ? '✍️ 继续续写' : '✏️ 编辑') + '</a>';
      acts += '<a class="a" href="work-editor.html?w=' + w.wid + '&tab=pricing">💰 收费</a>';
      acts += '<a class="a" href="dashboard.html">📊 数据</a>';
      acts += '<a class="a" href="novel-upload.html?w=' + w.wid + '">👁 预览</a>';
    }
    html += '<div class="mw-item">' +
      '<div class="cov" style="background:' + w.cov + '">' + w.emoji + '</div>' +
      '<div class="body">' +
        '<div class="t">' + w.title + '</div>' +
        '<div class="tags">' +
          '<span class="tag ' + w.st + '">' + (ST_LABEL[w.st] || w.st) + '</span>' +
          '<span class="tag src">' + w.src + '</span>' +
          (w.chap && w.chap !== '—' ? '<span class="tag">' + w.chap + '</span>' : '') +
        '</div>' +
        (meta.length ? '<div class="s">' + meta.join(' · ') + '</div>' : '') +
        '<div class="acts">' + acts + '</div>' +
      '</div>' +
      (w.income ? '<span class="earn">' + w.income + '</span>' : '') +
    '</div>';
  });
  box.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', function () {
  renderTabs();
  renderList();
  document.getElementById('mw-tabs').addEventListener('click', function (ev) {
    var t = ev.target.closest('.mw-tab');
    if (!t) return;
    curTab = t.getAttribute('data-tab');
    renderTabs();
    renderList();
  });
});
</script>
<script data-bundled-source="js/tabbar.js">
/* =================================================================
 * 灵境 · 双生 V17.0 — 5 Tab 全局状态管理（兼容 v6.4.1 shell-v64.css）
 * 用法：主功能区页面 <body> 末尾引入 <script src="js/tabbar.js"><\/script>
 *       页面任意位置预留 <div id="tabbar-mount"></div> 或 #tabbar 节点
 * 功能：
 *   1. localStorage 记忆当前 Tab（key: lingjing_v5170_current_tab）
 *   2. URL 推断当前 Tab（href 包含 home/world/heart-island/creator-center/me）
 *   3. 自动渲染 5 Tab 底部导航并高亮 active
 *   4. 点击 Tab：记忆 + 跳转对应主功能区页面
 *   5. 提供 window.LJTabbar API（go/setBadge/getCurrent）
 *   6. 兼容沉浸页豁免：plot-runner / game-3d / catalog 不调用 mount()
 * ================================================================= */
(function () {
  'use strict';

  // 防止重复挂载
  if (window.LJTabbar && window.LJTabbar.__mounted) {
    return;
  }

  // ---------- 配置 ----------
  var STORAGE_KEY = 'lingjing_v5170_current_tab';
  var TABS = [
    { id: 'home',   label: '首页', ico: '🏠', href: 'index.html',            match: ['product-preview', 'home', 'index'],  klass: 't-home' },
    { id: 'world',  label: '世界', ico: '📖', href: 'library.html',          match: ['library', 'world', 'discover'],      klass: 't-world' },
    { id: 'xinyu',  label: '心屿', ico: '💬', href: 'heart-island.html',     match: ['heart-island', 'xinyu', 'chat'],     klass: 't-xinyu' },
    { id: 'create', label: '创作', ico: '✨', href: 'creator-center.html',   match: ['creator-center', 'creator', 'novel', 'create-', 'workshop', 'agent-create', 'work-editor', 'interaction-manage', 'dashboard', 'revenue-detail', 'voice-clone', 'my-works'], klass: 't-create' },
    { id: 'me',     label: '我的', ico: '👤', href: 'me.html',                match: ['me', 'profile', 'wallet'],           klass: 't-me' }
  ];

  function resolveTabHref(n) {
    var p = (window.location.pathname || '').toLowerCase();
    var inSub = p.indexOf('/output/preview/') >= 0;
    // home（index.html）永远回到根目录唯一主页
    if (n === 'index.html') return inSub ? '../../index.html' : n;
    // 其他 tab：根 + 前缀，子目录直链
    return inSub ? n : 'output/preview/' + n;
  }

  // ---------- 工具 ----------
  function $(s, p) { return (p || document).querySelector(s); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else if (c) node.appendChild(c);
    });
    return node;
  }

  function getPath() {
    var path = (window.__LJ_PAGE__ || '') + '.html';
    return path.split('/').pop() || '';
  }

  // 根据当前 URL 推断 tab id
  function inferTabFromUrl() {
    var file = getPath().toLowerCase();
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      for (var j = 0; j < t.match.length; j++) {
        if (file.indexOf(t.match[j].toLowerCase()) !== -1) return t.id;
      }
    }
    return null;
  }

  function readStored() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (!v) return null;
      var found = TABS.some(function (t) { return t.id === v; });
      return found ? v : null;
    } catch (e) { return null; }
  }

  function writeStored(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* ignore */ }
  }

  function getCurrent() {
    var fromUrl = inferTabFromUrl();
    if (fromUrl) return fromUrl;
    var stored = readStored();
    if (stored) return stored;
    return 'home';
  }

  // ---------- 渲染 ----------
  function buildTabbar(currentId) {
    var bar = el('nav', { class: 'tabbar', role: 'navigation', 'aria-label': '主功能区' });
    TABS.forEach(function (t) {
      var klass = 'tab ' + t.klass + (t.id === currentId ? ' active' : '');
      var a = el('a', { class: klass, href: resolveTabHref(t.href), 'data-tab': t.id }, [
        el('span', { class: 'ico', 'aria-hidden': 'true' }, [t.ico]),
        el('span', { class: 'lbl' }, [t.label])
      ]);
      // pointer-events 在父级强制开启
      a.style.pointerEvents = 'auto';
      a.addEventListener('click', function () {
        writeStored(t.id);
      });
      bar.appendChild(a);
    });
    // V20-B：tabbar 永远在最顶层，z-index 200 高于所有 mask/dialog
    // V20-E：保留 CSS 的 left:50% + transform:translateX(-50%) 居中策略，
    //       不要用 left:0/right:0 强制铺满，否则 desktop 视口 + max-width:480px
    //       会让 tabbar 贴在屏幕左边（手机游戏必须 mobile-first 居中）
    bar.style.zIndex = '200';
    bar.style.position = 'fixed';
    bar.style.bottom = '0';
    bar.style.left = '50%';
    bar.style.transform = 'translateX(-50%)';
    return bar;
  }

  function findMountPoint() {
    // 跳过 product-preview.html 中的演示容器（带 data-demo="true"）
    var existing = document.querySelectorAll('.tabbar');
    for (var i = 0; i < existing.length; i++) {
      var n = existing[i];
      if (n.getAttribute && n.getAttribute('data-demo') === 'true') continue;
      return n;
    }
    return document.getElementById('tabbar-mount') || null;
  }

  function mount() {
    var mountPoint = findMountPoint();
    var currentId = getCurrent();
    writeStored(currentId);

    var bar = buildTabbar(currentId);

    if (!mountPoint) {
      // 没有预留挂载点：追加到 #app 末尾，保证 5 Tab 一定出现
      var app = document.getElementById('app') || document.body;
      app.appendChild(bar);
    } else if (mountPoint.classList && mountPoint.classList.contains('tabbar')) {
      // 已有静态 .tabbar，替换内容但保留元素
      mountPoint.innerHTML = '';
      // 关键：把 inline z-index 也复制到 mountPoint（避免被静态元素 z-index 60 覆盖）
      mountPoint.style.zIndex = bar.style.zIndex;
      var children = Array.prototype.slice.call(bar.childNodes);
      for (var i = 0; i < children.length; i++) mountPoint.appendChild(children[i]);
    } else {
      mountPoint.appendChild(bar);
    }

    // 给 body 加标识（便于测试与沉浸页判断）
    document.body.setAttribute('data-lj-tabbar', currentId);
    document.body.setAttribute('data-lj-tabbar-version', 'v17.0');

    return bar;
  }

  // ---------- 公开 API ----------
  function go(tabId) {
    var found = TABS.filter(function (t) { return t.id === tabId; })[0];
    if (!found) return false;
    writeStored(found.id);
    window.LJNav(resolveTabHref(found.href));
    return true;
  }

  function setBadge(tabId, n) {
    var a = document.querySelector('.tabbar a[data-tab="' + tabId + '"]');
    if (!a) return;
    var oldBadge = a.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    if (n && n > 0) {
      var b = el('span', { class: 'badge' }, [String(n)]);
      a.appendChild(b);
    }
  }

  window.LJTabbar = {
    TABS: TABS,
    mount: mount,
    go: go,
    setBadge: setBadge,
    getCurrent: getCurrent,
    STORAGE_KEY: STORAGE_KEY,
    __mounted: true
  };

  // ---------- 自动挂载 ----------
  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  ready(function () {
    // 沉浸页豁免：body 上有 data-page="immersive" 或路径命中豁免名单则不挂载
    var immersivePages = ['plot-runner.html', 'game-3d.html', 'catalog.html'];
    var here = getPath().toLowerCase();
    var isImmersive = immersivePages.some(function (n) { return here === n; })
      || document.body.getAttribute('data-page') === 'immersive';
    if (isImmersive) return;
    try { mount(); } catch (e) { console.error('[LJTabbar] mount failed', e); }
  });
})();
</script>
<script>
document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
  if (!el || el.tagName !== 'A') return;
  var h = el.getAttribute('href') || '';
  if (h.charAt(0) === '#') {
    if (h.length > 1) {
      e.preventDefault();
      var t = document.getElementById(h.slice(1));
      if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      try { window.dispatchEvent(new Event('hashchange')); } catch (err) {}
    }
    return;
  }
  if (!h || /^[a-zA-Z][\w+.\-]*:/.test(h)) return;
  if (/([\w.\-]+)\.html(\?|#|$)/.test(h)) {
    e.preventDefault();
    window.LJNav(h);
  }
}, true);
</script>
