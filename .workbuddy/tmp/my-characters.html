<div id="toast"></div>
<script>
function showToast(kind, title, msg){
  var c = document.getElementById('toast');
  var t = document.createElement('div');
  t.className = 'toast-item ' + (kind || 'ok');
  t.innerHTML = '<span class="ti"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
var curSrc = 'all';

function getList() {
  // 复用心屿数据（heart-data.js CHARACTERS），缺失时回退内置
  var src = (window.HEART_DATA && window.HEART_DATA.CHARACTERS) || [];
  if (src.length) return src;
  return FALLBACK;
}
var FALLBACK = [
  { id:'c04', source_type:'user_created', name:'阿岁', avatar:'🏮', occupation:'心理咨询师', intimacy:92, stage:'知己' },
  { id:'c06', source_type:'novel_brought_out', name:'孙悟空', avatar:'🌸', occupation:'记者', intimacy:78, novel_name:'红楼梦' }
];

function render() {
  var list = getList().filter(function (c) { return curSrc === 'all' || c.source_type === curSrc; });
  var box = document.getElementById('mc-list');
  box.innerHTML = '';
  document.getElementById('mc-empty').style.display = list.length ? 'none' : '';
  list.forEach(function (c) {
    var isTwin = c.source_type === 'novel_brought_out';
    var a = document.createElement('a');
    a.className = 'mc-item';
    a.href = 'character-detail.html?cid=' + (c.id || '');
    a.innerHTML =
      '<div class="ava" style="background:linear-gradient(135deg,rgba(108,92,231,.25),rgba(0,184,148,.18))">' + (c.avatar || '🌟') + '</div>' +
      '<div class="body">' +
        '<div class="t">' + c.name +
          (isTwin ? '<span class="badge-twin">双</span>' : '<span class="badge-create">创</span>') +
        '</div>' +
        '<div class="s">' + (c.occupation || '—') + (isTwin && c.novel_name ? ' · 来自《' + c.novel_name + '》' : '') + '</div>' +
      '</div>' +
      '<div class="int"><div class="v">' + (c.intimacy != null ? c.intimacy : '—') + '</div><div class="l">亲密度</div></div>' +
      '<span class="arr">›</span>';
    if (c.source_type === 'user_created' && c.api_id) {
      var pub = document.createElement('button');
      pub.type = 'button'; pub.className = 'mc-publish';
      pub.textContent = c.public_status === 'published' ? '已公开' : '公开到广场';
      pub.style.cssText = 'margin-left:8px;padding:5px 8px;border-radius:8px;border:1px solid rgba(108,92,231,.5);background:rgba(108,92,231,.15);color:#d9d2ff;font-size:10px;cursor:pointer';
      pub.onclick = function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var method = c.public_status === 'published' ? 'DELETE' : 'POST';
        var base = (localStorage.getItem('lingjing_api_base') || '').replace(/\/$/, '');
        if (!base) { showToast('warn', '接口未连接', '未修改公开状态'); return; }
        fetch(base + '/api/characters/' + encodeURIComponent(c.api_id) + '/publish', { method: method, headers: method === 'POST' ? {'Content-Type':'application/json'} : {}, body: method === 'POST' ? JSON.stringify({summary: c.persona || c.name}) : undefined })
          .then(function (r) { if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); })
          .then(function () { c.public_status = method === 'POST' ? 'published' : 'unpublished'; pub.textContent = method === 'POST' ? '已公开' : '公开到广场'; showToast('ok', '角色广场', method === 'POST' ? '已公开' : '已下架'); })
          .catch(function () { showToast('warn', '接口不可用', '未修改公开状态'); });
      };
      a.querySelector('.body').appendChild(pub);
    }
    box.appendChild(a);
  });
}
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('mc-sub').addEventListener('click', function (ev) {
    var t = ev.target.closest('.mc-chip');
    if (!t) return;
    curSrc = t.dataset.src;
    this.querySelectorAll('.mc-chip').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    render();
  });
  var base = (localStorage.getItem('lingjing_api_base') || '').replace(/\/$/, '');
  if (base) fetch(base + '/api/characters').then(function (r) { if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); }).then(function (items) {
    var remote = items.filter(function (x) { return !x.is_preset; }).map(function (x) { return {api_id:x.id, id:x.id, source_type:'user_created', name:x.name, avatar:x.avatar, occupation:x.relationship_type, intimacy:'—', persona:x.persona}; });
    if (remote.length) {
      var current = (window.HEART_DATA && window.HEART_DATA.CHARACTERS) || [];
      if (!window.HEART_DATA) window.HEART_DATA = {};
      window.HEART_DATA.CHARACTERS = remote.concat(current.filter(function (x) { return x.source_type !== 'user_created'; }));
    }
    render();
  }).catch(function () { render(); }); else render();
});
</script>

<script data-bundled-source="js/tabbar.js">
/* =================================================================
 * 灵境 · 双生 V17.0 — 5 Tab 全局状态管理（兼容 v6.4.1 shell-v64.css）
 * 用法：主功能区页面 <body> 末尾引入 <script src="js/tabbar.js"><\/script>
 *       页面任意位置预留 <div id="tabbar-mount"></div> 或 #tabbar 节点
 * 功能：
 *   1. localStorage 记忆当前 Tab（key: lingjing_v5170_current_tab）
 *   2. URL 推断当前 Tab（href 包含 home/world/heart-island/creator-center/me）
 *   3. 自动渲染 5 Tab 底部导航并高亮 active
 *   4. 点击 Tab：记忆 + 跳转对应主功能区页面
 *   5. 提供 window.LJTabbar API（go/setBadge/getCurrent）
 *   6. 兼容沉浸页豁免：plot-runner / game-3d / catalog 不调用 mount()
 * ================================================================= */
(function () {
  'use strict';

  // 防止重复挂载
  if (window.LJTabbar && window.LJTabbar.__mounted) {
    return;
  }

  // ---------- 配置 ----------
  var STORAGE_KEY = 'lingjing_v5170_current_tab';
  var TABS = [
    { id: 'home',   label: '首页', ico: '🏠', href: 'index.html',            match: ['product-preview', 'home', 'index'],  klass: 't-home' },
    { id: 'world',  label: '世界', ico: '📖', href: 'library.html',          match: ['library', 'world', 'discover'],      klass: 't-world' },
    { id: 'xinyu',  label: '心屿', ico: '💬', href: 'heart-island.html',     match: ['heart-island', 'xinyu', 'chat'],     klass: 't-xinyu' },
    { id: 'create', label: '创作', ico: '✨', href: 'creator-center.html',   match: ['creator-center', 'creator', 'novel', 'create-', 'workshop', 'agent-create', 'work-editor', 'interaction-manage', 'dashboard', 'revenue-detail', 'voice-clone', 'my-works'], klass: 't-create' },
    { id: 'me',     label: '我的', ico: '👤', href: 'me.html',                match: ['me', 'profile', 'wallet'],           klass: 't-me' }
  ];

  function resolveTabHref(n) {
    var p = (window.location.pathname || '').toLowerCase();
    var inSub = p.indexOf('/output/preview/') >= 0;
    // home（index.html）永远回到根目录唯一主页
    if (n === 'index.html') return inSub ? '../../index.html' : n;
    // 其他 tab：根 + 前缀，子目录直链
    return inSub ? n : 'output/preview/' + n;
  }

  // ---------- 工具 ----------
  function $(s, p) { return (p || document).querySelector(s); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else if (c) node.appendChild(c);
    });
    return node;
  }

  function getPath() {
    var path = (window.__LJ_PAGE__ || '') + '.html';
    return path.split('/').pop() || '';
  }

  // 根据当前 URL 推断 tab id
  function inferTabFromUrl() {
    var file = getPath().toLowerCase();
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      for (var j = 0; j < t.match.length; j++) {
        if (file.indexOf(t.match[j].toLowerCase()) !== -1) return t.id;
      }
    }
    return null;
  }

  function readStored() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (!v) return null;
      var found = TABS.some(function (t) { return t.id === v; });
      return found ? v : null;
    } catch (e) { return null; }
  }

  function writeStored(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* ignore */ }
  }

  function getCurrent() {
    var fromUrl = inferTabFromUrl();
    if (fromUrl) return fromUrl;
    var stored = readStored();
    if (stored) return stored;
    return 'home';
  }

  // ---------- 渲染 ----------
  function buildTabbar(currentId) {
    var bar = el('nav', { class: 'tabbar', role: 'navigation', 'aria-label': '主功能区' });
    TABS.forEach(function (t) {
      var klass = 'tab ' + t.klass + (t.id === currentId ? ' active' : '');
      var a = el('a', { class: klass, href: resolveTabHref(t.href), 'data-tab': t.id }, [
        el('span', { class: 'ico', 'aria-hidden': 'true' }, [t.ico]),
        el('span', { class: 'lbl' }, [t.label])
      ]);
      // pointer-events 在父级强制开启
      a.style.pointerEvents = 'auto';
      a.addEventListener('click', function () {
        writeStored(t.id);
      });
      bar.appendChild(a);
    });
    // V20-B：tabbar 永远在最顶层，z-index 200 高于所有 mask/dialog
    // V20-E：保留 CSS 的 left:50% + transform:translateX(-50%) 居中策略，
    //       不要用 left:0/right:0 强制铺满，否则 desktop 视口 + max-width:480px
    //       会让 tabbar 贴在屏幕左边（手机游戏必须 mobile-first 居中）
    bar.style.zIndex = '200';
    bar.style.position = 'fixed';
    bar.style.bottom = '0';
    bar.style.left = '50%';
    bar.style.transform = 'translateX(-50%)';
    return bar;
  }

  function findMountPoint() {
    // 跳过 product-preview.html 中的演示容器（带 data-demo="true"）
    var existing = document.querySelectorAll('.tabbar');
    for (var i = 0; i < existing.length; i++) {
      var n = existing[i];
      if (n.getAttribute && n.getAttribute('data-demo') === 'true') continue;
      return n;
    }
    return document.getElementById('tabbar-mount') || null;
  }

  function mount() {
    var mountPoint = findMountPoint();
    var currentId = getCurrent();
    writeStored(currentId);

    var bar = buildTabbar(currentId);

    if (!mountPoint) {
      // 没有预留挂载点：追加到 #app 末尾，保证 5 Tab 一定出现
      var app = document.getElementById('app') || document.body;
      app.appendChild(bar);
    } else if (mountPoint.classList && mountPoint.classList.contains('tabbar')) {
      // 已有静态 .tabbar，替换内容但保留元素
      mountPoint.innerHTML = '';
      // 关键：把 inline z-index 也复制到 mountPoint（避免被静态元素 z-index 60 覆盖）
      mountPoint.style.zIndex = bar.style.zIndex;
      var children = Array.prototype.slice.call(bar.childNodes);
      for (var i = 0; i < children.length; i++) mountPoint.appendChild(children[i]);
    } else {
      mountPoint.appendChild(bar);
    }

    // 给 body 加标识（便于测试与沉浸页判断）
    document.body.setAttribute('data-lj-tabbar', currentId);
    document.body.setAttribute('data-lj-tabbar-version', 'v17.0');

    return bar;
  }

  // ---------- 公开 API ----------
  function go(tabId) {
    var found = TABS.filter(function (t) { return t.id === tabId; })[0];
    if (!found) return false;
    writeStored(found.id);
    window.LJNav(resolveTabHref(found.href));
    return true;
  }

  function setBadge(tabId, n) {
    var a = document.querySelector('.tabbar a[data-tab="' + tabId + '"]');
    if (!a) return;
    var oldBadge = a.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    if (n && n > 0) {
      var b = el('span', { class: 'badge' }, [String(n)]);
      a.appendChild(b);
    }
  }

  window.LJTabbar = {
    TABS: TABS,
    mount: mount,
    go: go,
    setBadge: setBadge,
    getCurrent: getCurrent,
    STORAGE_KEY: STORAGE_KEY,
    __mounted: true
  };

  // ---------- 自动挂载 ----------
  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  ready(function () {
    // 沉浸页豁免：body 上有 data-page="immersive" 或路径命中豁免名单则不挂载
    var immersivePages = ['plot-runner.html', 'game-3d.html', 'catalog.html'];
    var here = getPath().toLowerCase();
    var isImmersive = immersivePages.some(function (n) { return here === n; })
      || document.body.getAttribute('data-page') === 'immersive';
    if (isImmersive) return;
    try { mount(); } catch (e) { console.error('[LJTabbar] mount failed', e); }
  });
})();
</script>
<script>
document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
  if (!el || el.tagName !== 'A') return;
  var h = el.getAttribute('href') || '';
  if (h.charAt(0) === '#') {
    if (h.length > 1) {
      e.preventDefault();
      var t = document.getElementById(h.slice(1));
      if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      try { window.dispatchEvent(new Event('hashchange')); } catch (err) {}
    }
    return;
  }
  if (!h || /^[a-zA-Z][\w+.\-]*:/.test(h)) return;
  if (/([\w.\-]+)\.html(\?|#|$)/.test(h)) {
    e.preventDefault();
    window.LJNav(h);
  }
}, true);
</script>
</body>
