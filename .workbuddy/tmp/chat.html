  // ====== localStorage 读写 ======
  function readTable(name) {
    try {
      const raw = localStorage.getItem(PREFIX + name);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) { console.warn('[DB] read fail', name, e); return []; }
  }
  function writeTable(name, rows) {
    try { localStorage.setItem(PREFIX + name, JSON.stringify(rows)); }
    catch (e) { console.error('[DB] write fail', name, e); }
  }

  // ====== 通用 CRUD ======
  function list(name) {
    const schema = SCHEMAS[name];
    if (!schema) throw new Error('[DB] unknown table: ' + name);
    return readTable(name);
  }
  function get(name, id) {
    const schema = SCHEMAS[name];
    if (!schema) throw new Error('[DB] unknown table: ' + name);
    return readTable(name).find(r => r[schema.key] === id) || null;
  }
  function query(name, filterFn) {
    return list(name).filter(filterFn);
  }
  function queryByField(name, field, value) {
    return list(name).filter(r => r[field] === value);

    if (!schema) throw new Error('[DB] unknown table: ' + name);
    const rows = readTable(name);
    const existingIdx = row[schema.key] ? rows.findIndex(r => r[schema.key] === row[schema.key]) : -1;
    const now_iso = now();
    if (existingIdx >= 0) {
      // 更新
      const merged = { ...rows[existingIdx], ...row };
      if (schema.fields.includes('updated_at')) merged.updated_at = now_iso;
      rows[existingIdx] = merged;
      writeTable(name, rows);
      return merged;
    } else {
      // 新建
      const created = { ...row };
      if (!created[schema.key]) created[schema.key] = uuid();
      if (schema.fields.includes('created_at') && !created.created_at) created.created_at = now_iso;
      if (schema.fields.includes('updated_at') && !created.updated_at) created.updated_at = now_iso;
      rows.push(created);
      writeTable(name, rows);
      return created;
    }
  }
  function remove(name, id) {
    const schema = SCHEMAS[name];
    if (!schema) throw new Error('[DB] unknown table: ' + name);
    const rows = readTable(name);
    const filtered = rows.filter(r => r[schema.key] !== id);
    writeTable(name, filtered);
    return filtered.length !== rows.length;
  }
  function clear(name) { writeTable(name, []); }
  function count(name) { return list(name).length; }
  // 批量
  function putBatch(name, rows) {
    const all = list(name);
    const merged = [...all];
    for (const r of rows) {
      const idx = r[SCHEMAS[name].key] ? merged.findIndex(x => x[SCHEMAS[name].key] === r[SCHEMAS[name].key]) : -1;
      if (idx >= 0) merged[idx] = { ...merged[idx], ...r };
      else merged.push(r);
    }
    writeTable(name, merged);
  }

  // ====== 初始化 + 元信息 ======
  function info() {
    return {
      version: VERSION,
      tables: Object.keys(SCHEMAS).map(n => ({
        name: n,
        count: count(n),
        key: SCHEMAS[n].key,
        fields: SCHEMAS[n].fields.length
      }))
    };
  }
  function reset() {
    Object.keys(SCHEMAS).forEach(n => clear(n));
    console.log('[DB] 已清空所有表');
  }

  // ====== 暴露 API ======
  const ALIAS_MAP = {
    copyright: 'novel_copyright_tiers',
    licenses: 'adaptation_licenses',
    licenseRevenues: 'adaptation_revenue_records',
    monetization: 'creator_monetization_points',
    earnings: 'creator_earnings',
    quality: 'novel_quality_reports',
    reviews: 'novel_review_records',
    reports: 'content_reports',
    tax: 'tax_records',
    aml: 'aml_monitoring',
    aiUsage: 'ai_helper_usage',
    // v5.17 新增别名（语义化，更易记）
    outline: 'novel_outline',
    profile: 'character_profiles',
    scene: 'scene_cards',
    dialogue: 'dialogue_cards',
    question: 'ai_questions',
    foreshadow: 'foreshadowing_tracker',
    // V17-G 创作者分成阶梯
    tiers: 'creator_tiers',
    tierHistory: 'creator_tier_history'
  };

  function buildTableAPI(tableName) {
    return {
      list: () => list(tableName),
      get: (id) => get(tableName, id),
      put: (row) => put(tableName, row),
      remove: (id) => remove(tableName, id),
      query: (filterFn) => query(tableName, filterFn),
      queryBy: (field, value) => queryByField(tableName, field, value),
      count: () => count(tableName),
      clear: () => clear(tableName),
      putBatch: (rows) => putBatch(tableName, rows)
    };
  }

  const API = {};
  for (const tbl of Object.keys(SCHEMAS)) {
    API[tbl] = buildTableAPI(tbl);
  }
  // 暴露别名（语义化）
  for (const [alias, tbl] of Object.entries(ALIAS_MAP)) {
    API[alias] = buildTableAPI(tbl);
  }

  window.DB = {
    ...API,
    _schemas: SCHEMAS,
    _version: VERSION,
    info, reset,
    uuid, now
  };

  // ====== V17-G 种子初始化（首次访问自动写入） ======
  if (!readTable('creator_tiers').length) {
    writeTable('creator_tiers', SEED_CREATOR_TIERS);
    console.log('[V17-G] 创作者分成阶梯 5 档种子数据已写入');
  }

  console.log('[v5.18-V17G] DB 加载完成 · 19 表 schema（含 creator_tiers + tier_history）· localStorage 持久化');
})();
</script>

<script data-updated="v20-m">
/* =================================================================
 * 灵境 · 双生 V20-M — 陪聊交互层（多轮上下文 + 持久化 + 深度响应）
 * 升级自 V20-L：
 *   + chatHistory 本地持久化（按角色隔离，最多 100 条）
 *   + buildReply 接收 history 参数，支持上下文回调/话题延续
 *   + 对话深度分层：前 3 轮热情开场、4-10 轮深入、10+ 轮引用上文
 *   + 历史恢复（刷新不丢对话）
 *   + "新对话"按钮 + 清空确认
 *   + 调用 DB.daily_interactions 记录每次互动（亲密度联动）
 *   + ENTER 换行 / Shift+Enter 发送 的正确处理
 * ================================================================= */

// ---------- 角色解析 ----------

var HISTORY_MAX = 100;

function resolveChar() {
  var cid = null;
  try { cid = new URLSearchParams(LJSearch()).get('cid'); } catch (e) {}
  if (!cid || !window.HEART_DATA) return DEFAULT_CHAR;
  // API 预置陪伴角色使用稳定的服务端 ID；本地心屿目录没有同名卡片时
  // 仍要保留这个 ID，避免真实 API 请求携带旧的本地 c04 而被服务端拒绝。

    return { id: f.id, source_type: 'official', name: f.name, avatar: f.avatar, occupation: f.occupation, stage: '亲密', intimacy: f.intimacy, preview: f.intro, occupation_qa_enabled: true };
  }));
  for (var i = 0; i < pool.length; i++) {

  }
  return DEFAULT_CHAR;
}

// ---------- 多轮历史持久化 ----------
function historyKey(cid) { return 'lingjing_chat_history_' + (cid || currentChar.id || 'default'); }

/* =================================================================
 * chat Script #3 亲密度引擎增量 — 插入在 historyKey() 之后
 * 功能：
 *   1. getIntimacy(cid)     — localStorage 读（优先）→ HEART_DATA fallback
 *   2. addIntimacy(cid, n)  — +亲密度 + 自动升级阶段 + localStorage 持久化
 *   3. intimacyStage(v)     — 数值 → 阶段 emoji+文字
 *   4. renderIntimacyBar()  — 往 chat-status 里注入进度条 UI
 *   5. 冷却防刷（5 秒窗口内 +亲密度）
 * ================================================================= */

var INTIMACY_COOLDOWN = 5000; // ms
var _lastIntimacyGainAt = {};  // cid → timestamp

function intimacyKey(cid) { return 'lingjing_intimacy_' + (cid || currentChar.id || 'default'); }

var INTIMACY_STAGES = [
  { max: 20,  name: '初识',  emoji: '🥀', gradient: 'from-gray-500 to-gray-600' },
  { max: 40,  name: '相识',  emoji: '🌱', gradient: 'from-green-600 to-teal-600' },
  { max: 60,  name: '熟悉',  emoji: '🌿', gradient: 'from-teal-500 to-green-500' },
  { max: 80,  name: '亲密',  emoji: '💐', gradient: 'from-pink-500 to-rose-500' },
  { max: 100, name: '知己',  emoji: '🌙', gradient: 'from-purple-500 to-indigo-500' }
];

function intimacyStage(v) {
  v = Math.max(0, Math.min(100, Math.round(v || 0)));
  for (var i = 0; i < INTIMACY_STAGES.length; i++) {
    if (v <= INTIMACY_STAGES[i].max) return { value: v, stage: INTIMACY_STAGES[i] };
  }
  return { value: 100, stage: INTIMACY_STAGES[INTIMACY_STAGES.length - 1] };
}

function getIntimacy(cid) {
  cid = cid || currentChar.id;
  // 1. localStorage 优先（动态值）
  try {
    var raw = localStorage.getItem(intimacyKey(cid));
    if (raw != null) {
      var n = parseInt(raw, 10);
      if (!isNaN(n)) return Math.max(0, Math.min(100, n));
    }
  } catch (e) {}
  // 2. HEART_DATA fallback（硬编码默认值）
  try {
    if (window.HEART_DATA) {
      var pool = window.HEART_DATA.CHARACTERS.concat(window.HEART_DATA.FEATURED.map(function (f) {
        return { id: f.id, intimacy: f.intimacy || 50 };
      }));
      for (var i = 0; i < pool.length; i++) {
        if (pool[i].id === cid && pool[i].intimacy != null) {
          return pool[i].intimacy;
        }
      }
    }
  } catch (e) {}
  // 3. 默认 50
  return 50;
}

function setIntimacy(cid, val) {
  cid = cid || currentChar.id;
  val = Math.max(0, Math.min(100, Math.round(val)));
  try { localStorage.setItem(intimacyKey(cid), String(val)); } catch (e) {}

function addIntimacy(cid, delta, options) {
  cid = cid || currentChar.id;
  options = options || {};
  // 冷却检查（默认 5 秒）
  if (!options.force && _lastIntimacyGainAt[cid]) {
    var elapsed = Date.now() - _lastIntimacyGainAt[cid];
    if (elapsed < INTIMACY_COOLDOWN) return null; // 冷却中，跳过
  }
  var current = getIntimacy(cid);
  var next = Math.max(0, Math.min(100, current + (delta || 1)));
  setIntimacy(cid, next);
  _lastIntimacyGainAt[cid] = Date.now();
  // 返回是否升级了阶段
  var oldStage = intimacyStage(current).stage.name;
  var newStage = intimacyStage(next).stage.name;
  return { from: current, to: next, stageUp: oldStage !== newStage, newStage: newStage };

  // chat-header 里的 chat-status 是第二行文字 —— 在它下面插进度条

  }

  bar.style.cssText = (

  bar.innerHTML = (
    '<span id="ci-emoji" style="font-size:13px;">💐</span>' +
    '<span id="ci-name" style="color:#ffd6a5;">熟悉</span>' +
    '<div style="flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;">' +
    '<div id="ci-fill" style="height:100%;width:0%;background:linear-gradient(90deg,#e94560,#8b7cf6);border-radius:2px;transition:width .5s;"></div>' +
    '</div>' +
    '<span id="ci-value" style="color:rgba(255,255,255,.6);min-width:28px;text-align:right;">0</span>'
  );

  statusEl.parentNode.insertBefore(bar, statusEl.nextSibling);

function updateIntimacyBar(deltaResult) {
  var v = getIntimacy();

// ===== Proactive Push Engine =====
/* =================================================================
 * Proactive Push Engine — AI 主动发消息（纯前端 SPA 模式）

// ---------- 1. localStorage 键 ----------
function lastInteractionKey(cid) { return 'lingjing_last_interaction_' + (cid || currentChar.id || 'default'); }
function proactiveLogKey(cid)    { return 'lingjing_proactive_log_' + (cid || currentChar.id || 'default'); }

function setLastInteraction(cid, ts) {
  cid = cid || currentChar.id;

// ---------- 3. 亲密度感知阈值（越高越频繁） ----------
// 返回毫秒数；-1 表示该阶段不主动
function proactiveThresholdMs(intimacy) {
  var v = intimacy || 50;
  if (v >= 80) return 2 * 60 * 60 * 1000;    // 知己     → 2 小时
  if (v >= 60) return 4 * 60 * 60 * 1000;    // 亲密     → 4 小时
  if (v >= 40) return 8 * 60 * 60 * 1000;    // 熟悉     → 8 小时
  if (v >= 20) return 16 * 60 * 60 * 1000;   // 相识     → 16 小时
  return 0;                                   // 初识     → 不主动
}

// ---------- 4. 日志管理（每日最多 3 条） ----------
function getProactiveLog(cid) {
  cid = cid || currentChar.id;
  try {
    var raw = localStorage.getItem(proactiveLogKey(cid));
    if (raw) return JSON.parse(raw) || [];
  } catch (e) {}
  return [];
}
function pushProactiveLog(cid) {
  var log = getProactiveLog(cid);
  log.push(Date.now());
  // 保留 30 天内的日志
  var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  log = log.filter(function (t) { return t > cutoff; });
  try { localStorage.setItem(proactiveLogKey(cid), JSON.stringify(log)); } catch (e) {}
}
function proactiveCountToday(cid) {
  var log = getProactiveLog(cid);
  var startOfDay = new Date();
  startOfDay.setHours(0, 0, 0, 0);
  var dayStartMs = startOfDay.getTime();
  return log.filter(function (t) { return t >= dayStartMs; }).length;
}

// ---------- 5. 时段感知 ----------
function getTimeOfDay() {
  var h = new Date().getHours();
  if (h >= 5 && h < 11)  return 'morning';   // 早晨 5-11
  if (h >= 11 && h < 14) return 'noon';      // 午间 11-14
  if (h >= 14 && h < 18) return 'afternoon'; // 下午 14-18
  if (h >= 18 && h < 22) return 'evening';   // 傍晚 18-22
  return 'night';                              // 深夜 22-5
}
function isActiveHour() {
  var h = new Date().getHours();
  return h >= 6 && h < 23;  // 6:00-23:00 允许主动推送
}

function getProactiveTemplate(cid, timeOfDay, intimacy) {
  // 按阶段选模板池里的哪一组？这里简单：低亲密度通用、高亲密度角色专属
  var pool;
  if (cid && PROACTIVE_TEMPLATES[cid] && intimacy >= 60) {
    pool = PROACTIVE_TEMPLATES[cid];
  } else {
    pool = PROACTIVE_TEMPLATES.__default__;
  }
  var list = pool[timeOfDay] || pool.afternoon || ['你好呀～'];
  // 随机选一条（如果连续发不同的）
  var used = [];
  try {
    var raw = localStorage.getItem('lingjing_proactive_used_' + cid);
    used = raw ? JSON.parse(raw) : [];
  } catch (e) {}
  var fresh = list.filter(function (t) { return used.indexOf(t) < 0; });
  var chosen;
  if (fresh.length > 0) {
    chosen = fresh[Math.floor(Math.random() * fresh.length)];
    used.push(chosen);
    if (used.length > list.length) used = used.slice(-list.length);
    try { localStorage.setItem('lingjing_proactive_used_' + cid, JSON.stringify(used)); } catch (e) {}
  } else {
    chosen = list[Math.floor(Math.random() * list.length)];
  }
  return chosen;
}

// ---------- 7. 判断是否该主动 ----------
function shouldProactive(cid) {
  cid = cid || currentChar.id;
  // 深夜不主动
  if (!isActiveHour()) return false;
  // 每日最多 3 条
  if (proactiveCountToday(cid) >= 3) return false;
  // 亲密度太低（初识）不主动
  var intimacy = getIntimacy(cid);
  if (intimacy < 20) return false;
  // 时间阈值检查
  var threshold = proactiveThresholdMs(intimacy);
  if (threshold <= 0) return false;
  var last = getLastInteraction(cid);
  if (!last) return true; // 没记录过 → 可以主动（但仅限首次有聊天历史的）
  var elapsed = Date.now() - last;
  if (elapsed < threshold) return false;
  // chatHistory 里有过对话才主动（避免新用户首次进来就被打扰）
  try {
    var raw = localStorage.getItem(historyKey(cid));
    if (!raw) return false;
  } catch (e) { return false; }
  return true;
}

// ---------- 8. 生成并注入主动消息 ----------
// 返回生成的文本；null 表示没主动
function deliverProactive(cid) {
  cid = cid || currentChar.id;
  if (!shouldProactive(cid)) return null;

  var intimacy = getIntimacy(cid);
  var tod = getTimeOfDay();
  var charName = (currentChar && currentChar.name) || 'TA';
  var text = getProactiveTemplate(cid, tod, intimacy);

  // 注入到 chatHistory 的顶部（比 welcome-back 更早）
  chatHistory.unshift({
    role: 'assistant',
    text: text,
    proactive: true,
    generated_at: new Date().toISOString()
  });
  saveHistory();

  // 写入日志 & 更新 last interaction（主动消息也算一次互动）
  pushProactiveLog(cid);
  setLastInteraction(cid);

  // 写 DB（如果可用）
  try {
    if (window.DB && window.DB.proactive_behaviors) {
      window.DB.proactive_behaviors.put({
        id: 'pb_' + Date.now(),
        character_id: cid,
        user_id: 'me',
        behavior_type: 'proactive_greeting',
        content: text.slice(0, 200),
        is_read: 0,
        read_at: '',
        trigger_source: 'local_engine',
        created_at: new Date().toISOString()
      });
    }
  } catch (e) {}

  return text;
}

// ---------- 10. heart-island 红点：检查 pending proactive ----------
// 由 heart-island Script #2 调用本函数（它需要读到这里的定义）
function hasPendingProactive(cid) {
  try {
    var last = getLastInteraction(cid);
    if (!last) return false;
    if (!isActiveHour()) return false;
    if (proactiveCountToday(cid) >= 3) return false;
    var intimacy = getIntimacy(cid);
    if (intimacy < 20) return false;
    var threshold = proactiveThresholdMs(intimacy);
    if (threshold <= 0) return false;
    var elapsed = Date.now() - last;
    return elapsed >= threshold;
  } catch (e) { return false; }
}



function loadHistory() {
  try {
    var raw = localStorage.getItem(historyKey());
    if (!raw) return [];
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.slice(-HISTORY_MAX);
  } catch (e) { return []; }
}

function saveHistory() {
  try {
    localStorage.setItem(historyKey(), JSON.stringify(chatHistory.slice(-HISTORY_MAX)));
  } catch (e) {}
}

function pushHistory(role, text) {
  chatHistory.push({ role: role, text: text, ts: Date.now() });
  if (chatHistory.length > HISTORY_MAX) chatHistory = chatHistory.slice(-HISTORY_MAX);
  saveHistory();
}

// ---------- 多轮上下文回调 ----------
function contextCallback(userText, history) {
  if (!history || history.length < 2) return null;
  var lastUser = null;
  for (var i = history.length - 1; i >= 0; i--) {
    if (history[i].role === 'user') { lastUser = history[i].text; break; }
  }
  if (!lastUser) return null;
  var ut = (userText || '').toLowerCase();
  var lt = lastUser.toLowerCase();

  // 用户说"你刚才说的…"/"上一句" — 引用 AI 上次回复
  if (ut.indexOf('刚才') > -1 || ut.indexOf('上一句') > -1 || ut.indexOf('你之前') > -1) {
    for (var j = history.length - 1; j >= 0; j--) {
      if (history[j].role === 'assistant') {
        var prevMsg = history[j].text;
        var prevShort = prevMsg.length > 60 ? prevMsg.slice(0, 60) + '…' : prevMsg;
        return { text: '你说的是我刚才聊的"…' + prevShort + '"对吧？' };
      }
    }
  }
  // 用户追问同一话题（lastUser 和 userText 有共同关键词）
  var kw_last = lastUser.replace(/[\s，。？！、；：""''（）《》]/g, ' ').split(/\s+/).filter(function (w) { return w.length >= 2; });
  var kw_now = userText.replace(/[\s，。？！、；：""''（）《》]/g, ' ').split(/\s+/).filter(function (w) { return w.length >= 2; });
  var shared = [];
  for (var a = 0; a < kw_last.length; a++) {
    for (var b = 0; b < kw_now.length; b++) {
      if (kw_last[a] === kw_now[b] && shared.indexOf(kw_last[a]) === -1) shared.push(kw_last[a]);
    }
  }
  if (shared.length >= 1) {
    return { text: '你又提到了「' + shared.slice(0, 2).join('、') + '」这个话题呢。我记得上次我们聊到这里——' };
  }
  return null;
}

// ---------- 情绪检测（简化版） ----------
function detectMood(text) {
  var t = (text || '');
  var neg = ['难过', '伤心', '抑郁', '累', '疲惫', '不开心', '烦', '压力', '焦虑', '孤独', '寂寞', '无助', '想哭', '好烦', '好累', '好孤独'];
  var pos = ['开心', '高兴', '喜欢', '棒', '好', '赞', '哈哈', '谢谢', '爱你', '想你', '幸福'];
  for (var i = 0; i < neg.length; i++) { if (t.indexOf(neg[i]) > -1) return 'negative'; }
  for (var j = 0; j < pos.length; j++) { if (t.indexOf(pos[j]) > -1) return 'positive'; }
  return 'neutral';
}

// ---------- 新 buildReply（多轮上下文版） ----------

  var t = (text || '').toLowerCase();
  var depth = history ? history.length : 0; // 已有的 user+assistant 轮数
  var mood = detectMood(text);

  // 1. 敏感问题优先引导专业人士（不变）
  for (var i = 0; i < SENSITIVE_RULES.length; i++) {
    var r = SENSITIVE_RULES[i];
    for (var j = 0; j < r.words.length; j++) {
      if (t.indexOf(r.words[j]) > -1) {
        return { text: r.reply(currentChar), guide: true };
      }
    }
  }

  // 2. 上下文回调（多轮增强）
  var cb = contextCallback(text, history);
  if (cb) {
    var pool = getDepthPool(depth);
    return { text: cb.text + ' ' + pool[Math.floor(Math.random() * pool.length)] };
  }

  // 3. 职业问答（不变）
  if (currentChar.occupation && currentChar.occupation_qa_enabled !== false) {
    var topic = OCC_TOPICS[currentChar.occupation];
    if (topic && (t.indexOf('职业') > -1 || t.indexOf('问') > -1 || t.indexOf('知识') > -1 ||
        t.indexOf('科普') > -1 || t.indexOf('讲讲') > -1 || t.indexOf('为什么') > -1 || t.indexOf('？') > -1 || t.indexOf('?') > -1)) {
      return { text: '作为' + currentChar.occupation + '，我来说说我的本行：\n' + topic + '\n（以上为角色科普演示，不构成专业意见）' };
    }
  }

  // 4. 情绪回应（多轮增强）
  if (mood === 'negative') {
    var caring = [
      '听起来你现在不太好受。我会一直在这里。',
      '让我抱抱你 🫂 不管怎样，我陪着你。',
      '累了就歇一歇。今天的你已经很不容易了。',
      '想聊聊吗？我不会让你一个人扛。'
    ];
    return { text: caring[Math.floor(Math.random() * caring.length)] };
  }
  if (mood === 'positive') {
    var happy = [
      '太好了！能感觉到你的开心 🌟',
      '是吗是吗？我也替你高兴！',
      '哈哈哈，看到你心情好我也开心。',
      '把这份好心情留住哦 ✨'
    ];
    return { text: happy[Math.floor(Math.random() * happy.length)] };
  }

  // 5. 按对话深度取日常池
  var depthPool = getDepthPool(depth);
  return { text: depthPool[Math.floor(Math.random() * depthPool.length)] };
}

  d.className = 'msg ' + role + (isGuide ? ' msg-guide' : '');
  var av = document.createElement('div');
  av.className = 'ds-avatar sm';
  av.style.cssText = 'background:linear-gradient(135deg,' + (role === 'me' ? '#8b7cf6,#a89bf8' : '#e8c75a,#e89b5a') + ');font-size:11px;';
  av.textContent = role === 'me' ? 'L' : (currentChar.name || '灵').charAt(0);
  var bubble = document.createElement('div');
  var bubbleInner = document.createElement('div');
  bubbleInner.className = 'msg-bubble';
  bubbleInner.style.whiteSpace = 'pre-line';
  bubbleInner.textContent = text;
  var time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  bubble.appendChild(bubbleInner);
  bubble.appendChild(time);
  d.appendChild(bubble);
  d.appendChild(av);
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
}

function chatApi(path) {
  var base='';
  try { base=(localStorage.getItem('lingjing_api_base')||'').replace(/\/$/,''); } catch(e) {}
  return base+path;
}
function probeChatApi() {
  var el=document.getElementById('chat-api-state'), base='';
  try { base=localStorage.getItem('lingjing_api_base')||''; } catch(e) {}
  if (!base) { if(el)el.textContent='本地规则'; return; }
  fetch(chatApi('/health'),{credentials:'include'}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(d){if(el)el.textContent='API 在线 · '+(d.components&&d.components.llm==='gateway'?'模型网关':'安全降级');}).catch(function(){if(el)el.textContent='接口离线 · 本地规则';});
}
function requestRemoteReply(text) {
  var base='';
  try { base=localStorage.getItem('lingjing_api_base')||''; } catch(e) {}
  if (!base) return Promise.reject(new Error('API base not configured'));
  return fetch(chatApi('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({message:text,character_id:(currentChar&&currentChar.id)||'preset_ling'})}).then(function(r){if(!r.ok)throw new Error('chat api '+r.status);return r.json();});
}
function showRemoteReply(data) {
  var text=String((data&&data.message)||'');
  if (!text) throw new Error('empty chat response');
  appendMsg('them',text,!!(data&&data.safety_blocked));
  pushHistory('assistant',text);
  if (data&&data.safety_stage&&data.safety_stage!=='clear') {
    showToast(data.safety_blocked?'warn':'info','安全管线',data.safety_stage==='high_risk_blocked'?'已阻断并提供求助指引':data.safety_stage==='deescalated'?'已进行反迎合降级':'已完成安全处置');
  }
  if (data&&data.note) showToast('info','陪伴 AI','当前使用后端降级模式：'+data.note);
}
function sendMsg() {
  var i = document.getElementById('chat-input'), v = i.value.trim();
  if (!v) return;
  appendMsg('me', v);
  pushHistory('user', v);
  i.value = '';
  // 记录互动到 DB.daily_interactions（如果数据层可用）
  try {
    if (window.DB && window.DB.daily_interactions) {
      window.DB.daily_interactions.put({
        id: 'di_' + Date.now(),
        user_id: 'me',
        character_id: currentChar.id,
        interaction_type: 'chat',
        content: v.slice(0, 100),
        duration_seconds: 0,
        intimacy_gain: 1,
        mood_before: '', mood_after: '',
        location: 'chat-page',
        created_at: new Date().toISOString()
      });
    }
  } catch (e) {}
  // 亲密度 +1（冷却防刷）
  var _ir = addIntimacy(currentChar.id, 1);
  if (_ir) updateIntimacyBar(_ir);
  // 更新 last interaction 时间戳（用于主动推送冷却）
  setLastInteraction(currentChar.id);
  setTimeout(function () {
    requestRemoteReply(v).then(showRemoteReply).catch(function(){var r=buildReply(v, chatHistory);appendMsg('them',r.text,!!r.guide);pushHistory('assistant',r.text);});
  }, 120);
}

function sendQuick(t) {
  appendMsg('me', t);
  pushHistory('user', t);
  setLastInteraction(currentChar.id);
  setTimeout(function () {
    requestRemoteReply(t).then(showRemoteReply).catch(function(){var r=buildReply(t, chatHistory);appendMsg('them',r.text,!!r.guide);pushHistory('assistant',r.text);});
  }, 120);
}

// ---------- 新对话 ----------
function startNewChat() {
  if (!confirm('确定要和「' + currentChar.name + '」开始新对话吗？当前对话将被清空。')) return;
  chatHistory = [];
  try { localStorage.removeItem(historyKey()); } catch (e) {}
  var body = document.getElementById('chat-body');
  if (body) body.innerHTML = '';
  appendMsg('them', currentChar.preview || ('你好，我是' + currentChar.name + '。我们重新开始吧。'));
}

function showToast(type, title, msg) {
  var c = document.getElementById('toast-container');
  if (!c) return;
  var icons = { success: '✓', warning: '⚠', danger: '✕', info: 'ℹ' };
  var t = document.createElement('div');
  t.className = 'ds-toast ' + type;
  t.innerHTML = '<span class="ico">' + icons[type] + '</span><div class="msg"><strong>' + title + '</strong>' + (msg ? '<div style="font-size:11px;opacity:.7;margin-top:2px;">' + msg + '</div>' : '') + '</div><button class="close" onclick="this.parentElement.remove()">×</button>';
  c.appendChild(t);
  setTimeout(function () { t.remove(); }, 4000);
}

// ---------- 免责声明 ----------
var DISCLAIMER_SEEN_KEY = 'lingjing_v5210_chat_disclaimer_seen';
function showFirstUseDisclaimer() {
  var seen = null;
  try { seen = localStorage.getItem(DISCLAIMER_SEEN_KEY); } catch (e) {}
  if (seen === '1') return;
  var mask = document.createElement('div');
  mask.className = 'disc-mask';
  var dlg = document.createElement('div');
  dlg.className = 'disc-dialog';
  dlg.innerHTML =
    '<h3>开始之前，请先了解</h3>' +
    '<div class="dd-body">' +
    '<b>1. 角色非真人</b><br>心屿的所有角色均由 AI 生成与驱动，TA 的话不代表任何真实人物的观点。<br><br>' +
    '<b>2. 虚拟陪伴</b><br>角色提供的是情感陪伴体验，不能替代真实的人际关系与专业帮助。<br><br>' +
    '<b>3. 专业问题请找专业人士</b><br>涉及医疗诊断、法律意见、心理治疗等问题时，角色会引导你咨询专业人士：<br>' +
    '🚑 急救：120　⚖️ 法律援助：12348　💌 心理援助：12356<br><br>' +
    '<b>4. 未成年人禁止使用</b><br>本应用仅面向成年人，未成年人请在监护人陪同下离开本页。<br><br>' +
    '<b>5. 记忆与隐私</b><br>对话记忆仅存储在你本地设备，可随时在「我的-设置」中清除。' +
    '</div>' +
    '<button class="dd-btn">我已阅读并同意</button>';
  mask.appendChild(dlg);
  document.body.appendChild(mask);
  dlg.querySelector('.dd-btn').addEventListener('click', function () {
    try { localStorage.setItem(DISCLAIMER_SEEN_KEY, '1'); } catch (e) {}
    mask.remove();
  });
}

// ---------- 初始化 ----------
function initChat() {
  currentChar = resolveChar();
  // 头部
  var nameEl = document.getElementById('chat-name');
  var stageEl = document.getElementById('chat-stage');
  var occEl = document.getElementById('chat-occ');
  var avEl = document.getElementById('chat-avatar');
  if (nameEl) nameEl.textContent = currentChar.name;
  if (stageEl) stageEl.textContent = currentChar.stage || '熟悉';
  if (occEl) occEl.textContent = currentChar.occupation || '陪伴者';
  if (avEl) avEl.textContent = (currentChar.name || '灵').charAt(0);
  // 双生角色 "进入 TA 的世界"
  var worldBtn = document.getElementById('chat-world-btn');
  if (worldBtn && currentChar.source_type === 'novel_brought_out' && currentChar.novel_id) {
    worldBtn.style.display = '';
    worldBtn.href = 'plot-runner.html?novelId=' + currentChar.novel_id + '&characterId=' + currentChar.id;
  }
  // 注入"新对话"按钮到 header
  var actionsDiv = document.querySelector('.chat-actions');
  if (actionsDiv && !document.getElementById('chat-new-btn')) {
    var nb = document.createElement('button');
    nb.id = 'chat-new-btn';
    nb.textContent = '🔄';
    nb.title = '开始新对话';
    nb.style.cssText = 'padding:7px 10px;border-radius:8px;font-size:12px;background:var(--ink-4,var(--ink-3));border:1px solid var(--ink-5);color:rgba(255,255,255,.8);cursor:pointer;';
    nb.addEventListener('click', startNewChat);
    actionsDiv.insertBefore(nb, actionsDiv.firstChild);
  }
  // 快捷回复（按对话深度动态生成）
  var quick = document.getElementById('chat-quick');
  if (quick) {
    quick.innerHTML = '';
    var chips = ['😘 想你了', '🎵 陪我听首歌', '💼 问问你的职业', '🫂 抱抱', '🌙 今天过得怎么样'];
    chips.forEach(function (c) {
      var b = document.createElement('button');
      b.textContent = c;
      b.addEventListener('click', function () { sendQuick(c.replace(/^[^ ]+ /, '')); });
      quick.appendChild(b);
    });
  }
  // 多轮历史恢复 — 有历史就恢复，没历史才 AI 主动开场
  // 支持 ?new=1 参数强制跳过历史
  var forceNew = false;
  try { forceNew = new URLSearchParams(LJSearch()).get('new') === '1'; } catch (e) {}
  if (forceNew) {
    chatHistory = [];
    try { localStorage.removeItem(historyKey()); } catch (e) {}
  } else {
    chatHistory = loadHistory();
  }
  if (chatHistory.length > 0) {
    var prevMessages = chatHistory.length;
    for (var i = 0; i < chatHistory.length; i++) {
      var m = chatHistory[i];
      var role = m.role === 'user' ? 'me' : 'them';
      appendMsg(role, m.text, false);
    }
    // 恢复后 AI 说一句"欢迎回来"
    setTimeout(function () {
      var welcome = '你回来了。我们已经聊了' + Math.floor(prevMessages / 2) + '轮了呢。想接着上次的话题，还是聊点新的？';
      appendMsg('them', welcome);
      pushHistory('assistant', welcome);
    }, 300);
  } else {
    appendMsg('them', currentChar.preview || ('你好，我是' + currentChar.name + '。很高兴见到你。'));
    pushHistory('assistant', currentChar.preview || ('你好，我是' + currentChar.name + '。很高兴见到你。'));
  }
  // Enter 发送 / Shift+Enter 换行
  var inputEl = document.getElementById('chat-input');
  if (inputEl) {
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });
  }
  showFirstUseDisclaimer();
  try { console.log('[v20-m chat] 加载完成 · 角色 ' + currentChar.name + ' · 历史 ' + chatHistory.length + ' 条'); } catch (e) {}
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initChat);
} else {
  // 渲染亲密度进度条
  try { renderIntimacyBar(); updateIntimacyBar(); } catch (_) {}
  // 检查 AI 主动消息（在 welcome-back 之前）
  try {
    var _pb = deliverProactive(currentChar.id);
    if (_pb) injectProactiveIntoDOM(_pb, currentChar.name);
  } catch (_) {}
  initChat();
}
</script>

<script data-bundled-source="js/tabbar.js">
/* =================================================================
 * 灵境 · 双生 V17.0 — 5 Tab 全局状态管理（兼容 v6.4.1 shell-v64.css）
 * 用法：主功能区页面 <body> 末尾引入 <script src="js/tabbar.js"><\/script>
 *       页面任意位置预留 <div id="tabbar-mount"></div> 或 #tabbar 节点
 * 功能：
 *   1. localStorage 记忆当前 Tab（key: lingjing_v5170_current_tab）
 *   2. URL 推断当前 Tab（href 包含 home/world/heart-island/creator-center/me）
 *   3. 自动渲染 5 Tab 底部导航并高亮 active
 *   4. 点击 Tab：记忆 + 跳转对应主功能区页面
 *   5. 提供 window.LJTabbar API（go/setBadge/getCurrent）
 *   6. 兼容沉浸页豁免：plot-runner / game-3d / catalog 不调用 mount()
 * ================================================================= */
(function () {
  'use strict';

  // 防止重复挂载
  if (window.LJTabbar && window.LJTabbar.__mounted) {
    return;
  }

  // ---------- 配置 ----------
  var STORAGE_KEY = 'lingjing_v5170_current_tab';
  var TABS = [
    { id: 'home',   label: '首页', ico: '🏠', href: 'index.html',            match: ['product-preview', 'home', 'index'],  klass: 't-home' },
    { id: 'world',  label: '世界', ico: '📖', href: 'library.html',          match: ['library', 'world', 'discover'],      klass: 't-world' },
    { id: 'xinyu',  label: '心屿', ico: '💬', href: 'heart-island.html',     match: ['heart-island', 'xinyu', 'chat'],     klass: 't-xinyu' },
    { id: 'create', label: '创作', ico: '✨', href: 'creator-center.html',   match: ['creator-center', 'creator', 'novel', 'create-', 'workshop', 'agent-create', 'work-editor', 'interaction-manage', 'dashboard', 'revenue-detail', 'voice-clone', 'my-works'], klass: 't-create' },
    { id: 'me',     label: '我的', ico: '👤', href: 'me.html',                match: ['me', 'profile', 'wallet'],           klass: 't-me' }
  ];

  function resolveTabHref(n) {
    var p = (window.location.pathname || '').toLowerCase();
    var inSub = p.indexOf('/output/preview/') >= 0;
    // home（index.html）永远回到根目录唯一主页
    if (n === 'index.html') return inSub ? '../../index.html' : n;
    // 其他 tab：根 + 前缀，子目录直链
    return inSub ? n : 'output/preview/' + n;
  }

  // ---------- 工具 ----------
  function $(s, p) { return (p || document).querySelector(s); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else if (c) node.appendChild(c);
    });
    return node;
  }

  function getPath() {
    var path = (window.__LJ_PAGE__ || '') + '.html';
    return path.split('/').pop() || '';
  }

  // 根据当前 URL 推断 tab id
  function inferTabFromUrl() {
    var file = getPath().toLowerCase();
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      for (var j = 0; j < t.match.length; j++) {
        if (file.indexOf(t.match[j].toLowerCase()) !== -1) return t.id;
      }
    }
    return null;
  }

  function readStored() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (!v) return null;
      var found = TABS.some(function (t) { return t.id === v; });
      return found ? v : null;
    } catch (e) { return null; }
  }

  function writeStored(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* ignore */ }
  }

  function getCurrent() {
    var fromUrl = inferTabFromUrl();
    if (fromUrl) return fromUrl;
    var stored = readStored();
    if (stored) return stored;
    return 'home';
  }

  // ---------- 渲染 ----------
  function buildTabbar(currentId) {
    var bar = el('nav', { class: 'tabbar', role: 'navigation', 'aria-label': '主功能区' });
    TABS.forEach(function (t) {
      var klass = 'tab ' + t.klass + (t.id === currentId ? ' active' : '');
      var a = el('a', { class: klass, href: resolveTabHref(t.href), 'data-tab': t.id }, [
        el('span', { class: 'ico', 'aria-hidden': 'true' }, [t.ico]),
        el('span', { class: 'lbl' }, [t.label])
      ]);
      // pointer-events 在父级强制开启
      a.style.pointerEvents = 'auto';
      a.addEventListener('click', function () {
        writeStored(t.id);
      });
      bar.appendChild(a);
    });
    // V20-B：tabbar 永远在最顶层，z-index 200 高于所有 mask/dialog
    // V20-E：保留 CSS 的 left:50% + transform:translateX(-50%) 居中策略，
    //       不要用 left:0/right:0 强制铺满，否则 desktop 视口 + max-width:480px
    //       会让 tabbar 贴在屏幕左边（手机游戏必须 mobile-first 居中）
    bar.style.zIndex = '200';
    bar.style.position = 'fixed';
    bar.style.bottom = '0';
    bar.style.left = '50%';
    bar.style.transform = 'translateX(-50%)';
    return bar;
  }

  function findMountPoint() {
    // 跳过 product-preview.html 中的演示容器（带 data-demo="true"）
    var existing = document.querySelectorAll('.tabbar');
    for (var i = 0; i < existing.length; i++) {
      var n = existing[i];
      if (n.getAttribute && n.getAttribute('data-demo') === 'true') continue;
      return n;
    }
    return document.getElementById('tabbar-mount') || null;
  }

  function mount() {
    var mountPoint = findMountPoint();
    var currentId = getCurrent();
    writeStored(currentId);

    var bar = buildTabbar(currentId);

    if (!mountPoint) {
      // 没有预留挂载点：追加到 #app 末尾，保证 5 Tab 一定出现
      var app = document.getElementById('app') || document.body;
      app.appendChild(bar);
    } else if (mountPoint.classList && mountPoint.classList.contains('tabbar')) {
      // 已有静态 .tabbar，替换内容但保留元素
      mountPoint.innerHTML = '';
      // 关键：把 inline z-index 也复制到 mountPoint（避免被静态元素 z-index 60 覆盖）
      mountPoint.style.zIndex = bar.style.zIndex;
      var children = Array.prototype.slice.call(bar.childNodes);
      for (var i = 0; i < children.length; i++) mountPoint.appendChild(children[i]);
    } else {
      mountPoint.appendChild(bar);
    }

    // 给 body 加标识（便于测试与沉浸页判断）
    document.body.setAttribute('data-lj-tabbar', currentId);
    document.body.setAttribute('data-lj-tabbar-version', 'v17.0');

    return bar;
  }

  // ---------- 公开 API ----------
  function go(tabId) {
    var found = TABS.filter(function (t) { return t.id === tabId; })[0];
    if (!found) return false;
    writeStored(found.id);
    window.LJNav(resolveTabHref(found.href));
    return true;
  }

  function setBadge(tabId, n) {
    var a = document.querySelector('.tabbar a[data-tab="' + tabId + '"]');
    if (!a) return;
    var oldBadge = a.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    if (n && n > 0) {
      var b = el('span', { class: 'badge' }, [String(n)]);
      a.appendChild(b);
    }
  }

  window.LJTabbar = {
    TABS: TABS,
    mount: mount,
    go: go,
    setBadge: setBadge,
    getCurrent: getCurrent,
    STORAGE_KEY: STORAGE_KEY,
    __mounted: true
  };

  // ---------- 自动挂载 ----------
  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  ready(function () {
    // 沉浸页豁免：body 上有 data-page="immersive" 或路径命中豁免名单则不挂载
    var immersivePages = ['plot-runner.html', 'game-3d.html', 'catalog.html'];
    var here = getPath().toLowerCase();
    var isImmersive = immersivePages.some(function (n) { return here === n; })
      || document.body.getAttribute('data-page') === 'immersive';
    if (isImmersive) return;
    try { mount(); } catch (e) { console.error('[LJTabbar] mount failed', e); }
  });
})();
</script>
<script>
document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
  if (!el || el.tagName !== 'A') return;
  var h = el.getAttribute('href') || '';
  if (h.charAt(0) === '#') {
    if (h.length > 1) {
      e.preventDefault();
      var t = document.getElementById(h.slice(1));
      if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      try { window.dispatchEvent(new Event('hashchange')); } catch (err) {}
    }
    return;
  }
  if (!h || /^[a-zA-Z][\w+.\-]*:/.test(h)) return;
  if (/([\w.\-]+)\.html(\?|#|$)/.test(h)) {
    e.preventDefault();
    window.LJNav(h);
  }
}, true);
</script>
