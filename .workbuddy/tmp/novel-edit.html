window.matchGenre = function(text, title='') {
  if (!text && !title) return null;
  const corpus = (title + '\n' + (text || '').slice(0, 5000)).toLowerCase();
  const scores = GENRES_LIBRARY.map(g => {
    let s = 0;
    for (const kw of g.keywords) {
      const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      const m = corpus.match(re);
      if (m) s += m.length * (kw.length >= 2 ? 2 : 1); // 长关键词加权
    }
    return { id: g.id, score: s };
  });
  scores.sort((a, b) => b.score - a.score);
  return scores[0].score > 0 ? { top: scores[0], second: scores[1], all: scores.filter(s => s.score > 0) } : null;
};

<script data-bundled-source="js/novel-store.js">
/* v5.12 — 本地小说存储层（localStorage CRUD）
   一个 key = 一本小说
   每个 novel 含完整 plotTree
*/
(function () {
  const KEY_PREFIX = 'ljss_novel_v1_';
  const INDEX_KEY = 'ljss_novel_index_v1';

  function loadIndex() {
    try {
      return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]');
    } catch (e) { return []; }
  }
  function saveIndex(arr) {
    localStorage.setItem(INDEX_KEY, JSON.stringify(arr));
  }

  function loadNovel(id) {
    try {
      return JSON.parse(localStorage.getItem(KEY_PREFIX + id));
    } catch (e) { return null; }
  }
  function saveNovel(plot) {
    if (!plot || !plot.novel || !plot.novel.id) return false;
    localStorage.setItem(KEY_PREFIX + plot.novel.id, JSON.stringify(plot));
    const idx = loadIndex();
    const idxEntry = {
      id: plot.novel.id,
      title: plot.novel.title,
      author: plot.novel.author,
      genre: plot.novel.genre,
      uploadedAt: plot.novel.uploadedAt,
      chars: plot.chars.length,
      nodes: Object.keys(plot.nodes).length,
      endings: Object.keys(plot.endings).length,
      highlights: (plot.highlights || []).length,
      chapters: plot.novel.chapters.length
    };
    const ex = idx.findIndex(e => e.id === idxEntry.id);
    if (ex >= 0) idx[ex] = { ...idx[ex], ...idxEntry };
    else idx.push(idxEntry);
    saveIndex(idx);
    return true;
  }
  function deleteNovel(id) {
    localStorage.removeItem(KEY_PREFIX + id);
    const idx = loadIndex().filter(e => e.id !== id);
    saveIndex(idx);
    return true;
  }

  function listNovels() {
    return loadIndex();
  }
  function listByGenre(genreId) {
    return loadIndex().filter(e => e.genre === genreId);
  }
  function countNovels() {
    return loadIndex().length;
  }
  function countByGenre(genreId) {
    return loadIndex().filter(e => e.genre === genreId).length;
  }

  // 调试用 — 列出全部
  function dump() {
    const items = loadIndex();
    return items.map(e => ({
      ...e,
      text: loadNovel(e.id)?.novel?.text?.slice(0, 200) + '...'
    }));
  }

  // 全清（慎用）
  function clearAll() {
    const idx = loadIndex();
    for (const e of idx) localStorage.removeItem(KEY_PREFIX + e.id);
    localStorage.removeItem(INDEX_KEY);
  }

  window.NovelStore = {
    loadNovel, saveNovel, deleteNovel,
    listNovels, listByGenre, countNovels, countByGenre,
    dump, clearAll, KEY_PREFIX, INDEX_KEY
  };
  console.log('[v5.12] novel-store 加载完成');
})();

</script>
<script data-bundled-source="js/novel-parser.js">
/* v5.12 — 小说规则解析引擎（前端 JS，无 LLM）
   滑动窗口 2-3 字 + 高信度位置提示 + 章节标题排除 + 邻字合并
*/
(function () {
  // ===== 章节分段 =====
  function splitChapters(text) {
    if (!text || text.length < 10) return [{ id: 'c1', title: '第1节', heading: '', index: 0, text }];
    const lines = text.split(/[\n\r]+/);
    const chapterRe = /^\s*(第[一二三四五六七八九十百千零〇两\d]+[\s章回卷篇集部节][^\n]*|Chapter\s*\d+[^\n]*|CHAPTER\s*\d+[^\n]*|序章|终章|尾声|后记|外传[^\n]*)\s*$/i;
    const chs = []; let buf = []; let curTitle = '序章'; let curHeading = '序章'; let curIndex = 1;
    for (const line of lines) {
      if (chapterRe.test(line.trim())) {
        if (buf.length) {
          chs.push({ id: 'c' + curIndex, title: curTitle, heading: curHeading, index: curIndex, text: buf.join('\n').trim() });
          curIndex++;
        }
        curTitle = line.trim() || (curIndex + '章');
        curHeading = curTitle;
        buf = [];
      } else {
        buf.push(line);
      }
    }
    if (buf.length || chs.length === 0) {
      chs.push({ id: 'c' + curIndex, title: curTitle, heading: curHeading, index: curIndex, text: buf.join('\n').trim() });
    }
    return chs.length ? chs : [{ id: 'c1', title: '正文', heading: '', index: 1, text }];
  }

  // ===== 角色识别 — 仅 2-3 字 =====
  const STOP_NAMES = new Set([
    '什么','怎么','为何','为什么','这里','那里','此时','彼时','甚是','正是','可是','不料','原来','难道','或许','大约','忽然','突然','立刻','马上','片刻','半晌','看着','听了','说道','指了','心想','想到','再看','默默','偶然','神秘','悠悠','飘飘','淡淡','轻轻','缓缓','静静',
    '没有','可以','一个','一种','一些','这个','那个','这样','那样','现在','以后','以前','之后','之前','已经','还在','应该','必须','可能','所以','因此','因为','如果','虽然','然而','但是','不过','并且','以及',
    '开始','结束','继续','一时间','一会儿','一切','一直','一定','一样','一边','一面','一部分','如何','还有','不可能',
    '不是','就是','还是','也是','只是','甚至','比如','例如','自己','别人','大家','我们','你们','他们','她们','它们','这次','那次',
    '我叫','你是','他是','她是','就是','只是','终于','接着','陆家嘴','一开始','一招','一抬',
    '端着酒杯','大学时候','工作','时候','说是','点头','走来说话','的时候','时候'
  ]);

  function extractNames(text, maxNames = 30) {
    const chunks = text.match(/[\u4e00-\u9fa5]+/g) || [];
    const freq = new Map();
    for (const ch of chunks) {
      if (ch.length < 2) continue;
      // 仅 2-3 字滑动窗口
      for (let i = 0; i < ch.length; i++) {
        const maxLen = Math.min(3, ch.length - i);
        for (let len = 2; len <= maxLen; len++) {
          const w = ch.substr(i, len);
          if (STOP_NAMES.has(w)) continue;
          if (/^第[一二三四五六七八九十百千万零]+/.test(w)) continue;
          freq.set(w, (freq.get(w) || 0) + 1);
        }
      }
    }
    // 高信度位置加分
    const hintedNames = new Set();
    const nameHints = [
      /我叫([\u4e00-\u9fa5]{2,4})/g,
      /他叫([\u4e00-\u9fa5]{2,4})/g,
      /她叫([\u4e00-\u9fa5]{2,4})/g
    ];
    for (const re of nameHints) {
      let m; while ((m = re.exec(text)) !== null) {
        const name = m[1];
        if (STOP_NAMES.has(name)) continue;
        if (!freq.has(name)) freq.set(name, 0);
        freq.set(name, freq.get(name) + 5);
        hintedNames.add(name);
      }
    }
    // 章节标题行 — 用于排除假阳性
    const chapterTitles = new Set();
    const chapterLineRe = /^第[一二三四五六七八九十百千万零\d]+章\s*([^\n]+)/gm;
    let cm; while ((cm = chapterLineRe.exec(text)) !== null) {
      const t = cm[1].trim();
      for (let i = 0; i <= t.length - 2; i++) {
        for (let len = 2; len <= Math.min(3, t.length - i); len++) {
          chapterTitles.add(t.substr(i, len));
        }
      }
    }
    // 排序+过滤
    const sorted = [...freq.entries()].sort((a, b) => b[1] - a[1]);
    const filtered = sorted.filter(([n, c]) => (c >= 2) || (hintedNames.has(n) && c >= 1));
    // body 出现次数（除章节标题外）
    const bodyText = text.replace(/第[一二三四五六七八九十百千万零\d]+章[^\n]*\n?/g, '');
    const bodyChunks = bodyText.match(/[\u4e00-\u9fa5]+/g) || [];
    const bodyHas = (name) => bodyChunks.some(ch => ch.indexOf(name) >= 0);
    // 去重
    const result = [];
    for (const [n, c] of filtered) {
      if (result.length >= maxNames) break;
      let subsumed = false;
      for (const r of result) {
        if (r.name.length < n.length && n.indexOf(r.name) >= 0 && c <= r.count + 2) { subsumed = true; break; }
        if (n.length < r.name.length && r.name.indexOf(n) >= 0 && c <= r.count) { subsumed = true; break; }
      }
      if (subsumed) continue;
      if (chapterTitles.has(n) && !bodyHas(n)) continue;
      result.push({ name: n, count: c });
    }
    // 合并：对 2-3 字候选 + 1 字生成 3-4 字名（合并必须 ≥ 2 次出现）
    const finalResult = result.slice();
    for (const a of result) {
      if (a.name.length !== 2 && a.name.length !== 3) continue;
      const reTry = new RegExp(a.name + '([一-龥])', 'g');
      let m;
      while ((m = reTry.exec(text)) !== null) {
        const combined = a.name + m[1];
        if (combined.length > 4) continue;
        if (STOP_NAMES.has(combined)) continue;
        const rawCount = freq.get(combined);
        if (!rawCount || rawCount < 2) continue;  // 合并必须出现 ≥ 2 次
        const combinedScore = rawCount + 5;
        const exactIdx = finalResult.findIndex(x => x.name === combined);
        if (exactIdx >= 0) {
          if (combinedScore > finalResult[exactIdx].count) finalResult[exactIdx].count = combinedScore;
          continue;
        }
        const subsumedByIdx = finalResult.findIndex(x => x.name !== combined && x.name.indexOf(combined) >= 0);
        if (subsumedByIdx >= 0) continue;
        finalResult.push({ name: combined, count: combinedScore });
      }
    }
    finalResult.sort((a, b) => b.count - a.count);
    return finalResult.slice(0, maxNames);
  }

  // ===== 高光关键词 =====
  const HIGHLIGHT_KW = [
    { kw: '决战', badge: '决战' }, { kw: '告白', badge: '告白' },
    { kw: '表白', badge: '告白' }, { kw: '重生', badge: '重生' },
    { kw: '穿越', badge: '穿越' }, { kw: '变身', badge: '变身' },
    { kw: '觉醒', badge: '觉醒' }, { kw: '化身', badge: '化身' },
    { kw: '继位', badge: '登基' }, { kw: '登基', badge: '登基' },
    { kw: '复仇', badge: '复仇' }, { kw: '报仇', badge: '复仇' },
    { kw: '死亡', badge: '生死' }, { kw: '死去', badge: '生死' },
    { kw: '牺牲', badge: '牺牲' }, { kw: '大战', badge: '决战' },
    { kw: '始祖', badge: '揭秘' }, { kw: '发现', badge: '揭秘' },
    { kw: '真相', badge: '揭秘' }, { kw: '秘密', badge: '揭秘' },
    { kw: '结婚', badge: '成婚' }, { kw: '成婚', badge: '成婚' },
    { kw: '埋伏', badge: '遭遇' }, { kw: '遇袭', badge: '遭遇' },
    { kw: '中毒', badge: '危机' }, { kw: '中计', badge: '危机' },
    { kw: '突破', badge: '突破' }, { kw: '飞升', badge: '飞升' },
    { kw: '复活', badge: '复活' }, { kw: '解救', badge: '解救' },
    { kw: '终局', badge: '决战' }, { kw: '拥抱', badge: '告白' },
    { kw: '赌', badge: '抉择' }
  ];

  function findHighlights(text) {
    const out = [];
    for (const h of HIGHLIGHT_KW) {
      const re = new RegExp(h.kw, 'g');
      let m;
      while ((m = re.exec(text)) !== null) {
        const start = Math.max(0, m.index - 80);
        const end = Math.min(text.length, m.index + 80);
        out.push({
          id: 'hl-' + out.length,
          keyword: h.kw,
          badge: h.badge,
          pos: m.index,
          excerpt: text.slice(start, end).replace(/\s+/g, ' ').trim()
        });
        if (out.length >= 30) break;
      }
    }
    return out;
  }

  // ===== 场景关键词 =====
  const SCENE_KW = [
    { kw: ['凉亭','雨夜','远山','灯笼'], scene: 'pavilion_night', mood: 'rainy' },
    { kw: ['教室','走廊','课桌','阳光','操场'], scene: 'classroom_sunny', mood: 'sunny' },
    { kw: ['霓虹','高楼','街道','摩天','招牌'], scene: 'neon_street', mood: 'cyber' },
    { kw: ['客厅','沙发','落地灯','茶几','暖灯'], scene: 'livingroom_warm', mood: 'warm' },
    { kw: ['飞剑','仙山','云海','古松','祭坛'], scene: 'xianxia_peak', mood: 'mystic' },
    { kw: ['宫殿','宴席','丝绸','红柱','团扇'], scene: 'palace_tang', mood: 'ancient' },
    { kw: ['书架','怀表','雨','电灯','古书'], scene: 'study_republic', mood: 'vintage' },
    { kw: ['森林','古树','精灵','萤火','小溪','遗迹'], scene: 'elf_forest', mood: 'forest' },
    { kw: ['星舰','舰桥','舷窗','操控台','光环'], scene: 'starship_bridge', mood: 'space' },
    { kw: ['咖啡馆','咖啡','街角','橱窗'], scene: 'cafe_dusk', mood: 'warm' },
    { kw: ['墓园','墓地','黑夜','月光','枯树'], scene: 'graveyard_night', mood: 'dark' },
    { kw: ['战场','军营','营帐','烽火'], scene: 'battle_field', mood: 'epic' },
    { kw: ['学院','魔法','塔楼','魔法阵'], scene: 'magic_academy', mood: 'fantasy' },
    { kw: ['飞船','太空舱','星空','银河'], scene: 'space_cabin', mood: 'space' },
    { kw: ['投行','写字楼','陆家嘴','办公室','酒会'], scene: 'cafe_dusk', mood: 'urban' },
    { kw: ['婚礼','订婚'], scene: 'palace_tang', mood: 'warm' }
  ];

  function matchScenes(text) {
    const matched = [];
    for (const sk of SCENE_KW) {
      let count = 0;
      for (const kw of sk.kw) {
        const re = new RegExp(kw, 'g');
        const m = text.match(re);
        if (m) count += m.length;
      }
      if (count >= 1) matched.push({ ...sk, count });
    }
    matched.sort((a, b) => b.count - a.count);
    return matched;
  }

  function pickOrTruncate(text, max = 60) {
    const t = text.replace(/\s+/g, ' ').trim();
    if (t.length <= max) return t;
    return t.slice(0, max).replace(/[,，。 ;；]+$/, '') + '…';
  }
  function pickFirstSentence(text, max = 60) {
    const m = text.match(/[^。！？.!?\n]{1,80}/);
    if (!m) return pickOrTruncate(text, max);
    return pickOrTruncate(m[0], max);
  }

  // ===== 主函数 =====
  function parse(text, opts = {}) {
    const title = (opts.title || '未命名小说').slice(0, 100);
    const author = opts.author || '匿名';
    const genreId = opts.genre || matchBestGenreId(text, title);
    const chapters = splitChapters(text);

    const chars = nameFreq.slice(0, 12).map((n, i) => ({
      id: 'ch-' + i,

    }));

    for (const sm of sceneMatches) {

      const para = (ch.text || '').split(/[\n\r]+/).filter(s => s.trim()).slice(0, 2).join(' ').trim();
      const speakerLine = para ? pickFirstSentence(para, 50) : '【' + ch.title + '】\n故事继续。';
      const chapterHighlight = highlights.find(h => (ch.text || '').indexOf(h.keyword) >= 0);
      const sceneKey = sceneMatches[0]?.scene || null;
      nodes[id] = {
        id: id,
        chapterId: ch.id,
        charIds: chars.slice(0, Math.min(3, chars.length)).map(c => c.id),
        speaker: speaker,
        text: '【' + ch.title + '】\n' + speakerLine,
        isMain: true,

        ]

    }

      for (const ch of chapters) {
        if ((ch.text || '').indexOf(hl.keyword) >= 0) belongChapter = ch.id;
      }
      nodes[id] = {
        id: id,
        chapterId: belongChapter,
        charIds: chars.slice(0, 2).map(c => c.id),
        speaker: chars[Math.random() < 0.5 ? 0 : 1]?.name || '旁白',
        text: '【高光 · ' + hl.badge + '】\n"' + hl.excerpt + '"',
        isMain: false,
        isHighlight: true,
        sceneKey: sceneMatches[1 % sceneMatches.length]?.scene || sceneMatches[0]?.scene || null,
        bg: null,
        choices: [
          { label: '正面回应', next: 'ending-good', effects: { trust: 3, intimacy: 3 } },
          { label: '保持距离', next: 'ending-cautious', effects: { trust: 0, intimacy: 1 } },
          { label: '追问详情', next: 'ending-truth', effects: { trust: 1, intimacy: 2, reputation: 2 } }

      };

    };
    const audit = runAudit({ chars, highlights, chapters, nodes: nodes, endings });
    return { novel: novelObj, chars, highlights, sceneHints, nodes, endings, flags: {}, audit };
  }

  function runAudit(plot) {
    const nodeList = Array.isArray(plot.nodes) ? plot.nodes : Object.values(plot.nodes || {});
    const nodesById = Array.isArray(plot.nodes) ? Object.fromEntries(plot.nodes.map(n => [n.id, n])) : (plot.nodes || {});
    const chaptersCovered = new Set();
    const charsCovered = new Set();
    const highlightsCovered = new Set();
    // 统计每章节出现的角色和高光
    for (const n of nodeList) {
      chaptersCovered.add(n.chapterId);
      for (const cid of (n.charIds||[])) charsCovered.add(cid);
      if (n.isHighlight) {
        const hl = (plot.highlights || []).find(h => (n.text||'').indexOf(h.excerpt) >= 0);
        if (hl) highlightsCovered.add(hl.id);
      }
    }
    // === 自动修复：未覆盖角色强制并入最近章节节点 ===
    for (const c of plot.chars) {
      if (!charsCovered.has(c.id)) {
        const targetChapter = c.firstChapter || plot.chapters[plot.chapters.length - 1]?.id;
        const targetNode = nodesById[targetChapter + '-main'];
        if (targetNode) {
          targetNode.charIds = Array.from(new Set([...(targetNode.charIds||[]), c.id]));
          charsCovered.add(c.id);
        }
      }
    }
    // === 自动修复：未覆盖高光强制并入最近章节主线 ===
    for (const hl of plot.highlights || []) {
      if (!highlightsCovered.has(hl.id)) {
        const targetChapter = (() => {
          for (const ch of plot.chapters) {
            if ((ch.text || '').indexOf(hl.keyword) >= 0) return ch.id;
          }
          return plot.chapters[plot.chapters.length - 1]?.id;
        })();
        const targetNode = nodesById[targetChapter + '-main'];
        if (targetNode) {
          targetNode.isHighlight = true;
          highlightsCovered.add(hl.id);
        }
      }
    }
    return {
      total: { chapters: plot.chapters.length, chars: plot.chars.length, highlights: (plot.highlights||[]).length },
      covered: { chapters: chaptersCovered.size, chars: charsCovered.size, highlights: highlightsCovered.size },
      gaps: {
        chapters: plot.chapters.map(c => c.id).filter(id => !chaptersCovered.has(id)),
        chars: plot.chars.filter(c => !charsCovered.has(c.id)).map(c => c.name),
        highlights: (plot.highlights||[]).filter(h => !highlightsCovered.has(h.id)).map(h => h.keyword)
      }
    };
  }

  function matchBestGenreId(text, title = '') {
    if (!window.matchGenre) return 'xianxia';
    const r = window.matchGenre(text, title);
    return (r && r.top && r.top.score > 0) ? r.top.id : 'xianxia';
  }

  window.NovelParser = { parse, splitChapters, extractNames, findHighlights, matchScenes, runAudit };
  console.log('[v5.12] novel-parser 加载完成');
})();

  function ensure() {
    if (!window.NovelStore) return;
    const idx = NovelStore.listNovels();
    const demoIds = DEMO_NOVELS.map(n => n.meta.id);
    const haveAll = demoIds.every(id => idx.find(e => e.id === id));
    if (haveAll) return;
    // 注入缺失的
    for (const d of DEMO_NOVELS) {
      if (idx.find(e => e.id === d.meta.id)) continue;
      const plot = {
        novel: {
          id: d.meta.id,
          title: d.meta.title,
          author: d.meta.author,
          genre: d.meta.genre,
          keywords: Object.keys(d.sceneHints || {}),
          cover: null,
          uploadedAt: new Date().toISOString(),
          text: d.chapters.map(c => c.text).join('\n\n'),
          chapters: d.chapters
        },
        chars: d.chars,
        highlights: d.highlights,
        sceneHints: d.sceneHints,
        nodes: d.nodes.reduce((acc, n) => { acc[n.id] = n; return acc; }, {}),
        endings: d.endings,
        flags: {},
        audit: computeAudit(d)
      };
      NovelStore.saveNovel(plot);
    }
    console.log('[v5.12] 已注入 5 份 demo 小说种子数据');
  }

  function computeAudit(d) {
    const chapSet = new Set();
    const charSet = new Set();
    const hlSet = new Set();
    for (const n of d.nodes) {
      chapSet.add(n.chapterId);
      for (const cid of (n.charIds || [])) charSet.add(cid);
      if (n.isHighlight && n.id) hlSet.add(n.id);
    }
    return {
      total: { chapters: d.chapters.length, chars: d.chars.length, highlights: d.highlights.length },
      covered: { chapters: chapSet.size, chars: charSet.size, highlights: hlSet.size },
      gaps: { chapters: [], chars: [], highlights: [] }
    };
  }

  // 首次启动注入
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(ensure, 50);
  } else {
    document.addEventListener('DOMContentLoaded', () => setTimeout(ensure, 50));
  }

  window.DemoSeed = { ensure, DEMO_NOVELS };
  console.log('[v5.12] demo-seed 加载完成');
})();

<script>
(function () {
  const params = new URLSearchParams(LJSearch());
  const novelId = params.get('novelId');
  if (!novelId) { LJNav('library.html'); return; }
  DemoSeed.ensure();
  let original = NovelStore.loadNovel(novelId);
  if (!original) { alert('没找到这本小说'); LJNav('library.html'); return; }
  // 深拷贝（编辑全程)
  let plot = JSON.parse(JSON.stringify(original));
  let currentTab = 'nodes';
  let currentSelection = null;
  let dirty = false;

  document.getElementById('top-title').textContent = `编辑：${plot.novel.title}`;

  // ===== Tabs =====
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      currentTab = b.dataset.tab;
      renderSide();
    };
  });

  function setDirty() {
    dirty = true;
    document.getElementById('dirty-flag').style.display = '';
  }

  function updateAudit() {
    plot.audit = NovelParser.runAudit({
      chars: plot.chars, chapters: plot.novel.chapters, highlights: plot.highlights || [],
      nodes: Object.values(plot.nodes), endings: plot.endings
    });
    const a = plot.audit;
    const lines = [
      { l: '章节', t: a.total.chapters, c: a.covered.chapters },
      { l: '角色', t: a.total.chars, c: a.covered.chars },
      { l: '高光', t: a.total.highlights, c: a.covered.highlights }
    ];
    const html = lines.map(x => {
      const ok = x.c === x.t;
      return `<div class="${ok?'ok':'warn'}">${x.l}：${x.c}/${x.t} ${ok?'✅':'⚠️'}</div>`;
    }).join('');
    document.getElementById('audit-box').innerHTML = html;
  }
  updateAudit();

  // ===== Side list =====
  function renderSide() {
    const list = document.getElementById('side-list');
    list.innerHTML = '';
    if (currentTab === 'nodes') {
      const sorted = Object.values(plot.nodes).sort((a,b)=> a.chapterId.localeCompare(b.chapterId));
      sorted.forEach(n => {
        const row = document.createElement('div');
        row.className = 'item-row' + (currentSelection===n.id?' sel':'');
        row.innerHTML = `
          <div style="font-weight:600;">${escape(n.speaker||'旁白')} · ${escape(n.id)}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.5);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;">${escape((n.text||'').slice(0,40))}</div>
          <div style="margin-top:4px;">
            ${n.isMain?'<span class="pill" style="background:rgba(110,198,255,.16);color:#6ec6ff;">主线</span>':''}
            ${n.isHighlight?'<span class="pill highlight">高光</span>':''}
          </div>`;
        row.onclick = () => { currentSelection = n.id; renderSide(); renderEditor(); renderPreview(); };
        list.appendChild(row);
      });
    } else if (currentTab === 'chars') {
      plot.chars.forEach(c => {
        const row = document.createElement('div');
        row.className = 'item-row' + (currentSelection===c.id?' sel':'');
        row.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pill ${c.role}">${c.role==='main'?'主角':c.role==='antag'?'反派':'配角'}</span>
            <span style="font-weight:600;">${escape(c.name)}</span>
            <span style="margin-left:auto;color:rgba(255,255,255,.5);font-size:11px;">${c.mentions}次</span>
          </div>`;
        row.onclick = () => { currentSelection = c.id; renderSide(); renderEditor(); };
        list.appendChild(row);
      });
    } else if (currentTab === 'chapters') {
      plot.novel.chapters.forEach(c => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `<div style="font-weight:600;">第${c.index}章</div><div style="font-size:11px;color:rgba(255,255,255,.5);">${escape(c.title)}</div>`;
        list.appendChild(row);
      });
    } else if (currentTab === 'highlights') {
      (plot.highlights || []).forEach(h => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span class="pill highlight">${escape(h.badge)}</span>
          <div style="margin-top:6px;font-size:12px;color:rgba(255,255,255,.85);">"${escape(h.excerpt)}"</div>`;
        list.appendChild(row);
      });
    } else if (currentTab === 'endings') {
      Object.values(plot.endings).forEach(e => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const colorMap = { legendary:'#f6a6d8', epic:'#8b7cf6', rare:'#6ec6ff', common:'#7cf6c0' };
        row.innerHTML = `
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="pill" style="background:${colorMap[e.rarity]}22;color:${colorMap[e.rarity]};">${escape(e.rarity)}</span>
            <span style="font-weight:600;">${escape(e.title)}</span>
          </div>
          <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;font-style:italic;">${escape(e.quote)}</div>`;
        list.appendChild(row);
      });
    }
  }

  // ===== Editor =====
  function renderEditor() {
    const panel = document.getElementById('editor-panel');
    if (!currentSelection) { panel.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,.55);margin:40px 0;">从左侧选择一个项目开始编辑</p>'; return; }
    if (currentTab === 'nodes') {
      const n = plot.nodes[currentSelection];
      if (!n) return panel.innerHTML = '<p>找不到此节点</p>';
      const nextOpts = Object.values(plot.nodes).filter(x => x.id !== n.id).map(x => `<option value="${x.id}" ${n.choices && n.choices.some(c => c.next === x.id) ? 'selected':''}>${escape(x.speaker)} · ${escape(x.id)}</option>`).join('');
      const endingOpts = Object.values(plot.endings).map(e => `<option value="${e.id}" ${n.choices && n.choices.some(c => c.next === e.id) ? 'selected':''}>[结局] ${escape(e.title)}</option>`).join('');
      panel.innerHTML = `
        <h3 style="font:18px 'Noto Serif SC',serif;font-weight:600;margin-bottom:12px;">编辑节点：${escape(n.id)}</h3>
        <div class="field"><label>说话者</label><input id="ed-speaker" value="${escape(n.speaker||'')}" /></div>
        <div class="field"><label>正文</label><textarea id="ed-text" rows="5">${escape(n.text||'')}</textarea></div>
        <div class="field"><label>章节</label><input id="ed-chapter" value="${escape(n.chapterId)}" /></div>
        <div class="field"><label>场景</label>
          <select id="ed-scene">
            <option value="">— 未指定 —</option>
            ${['pavilion_night','classroom_sunny','neon_street','livingroom_warm','xianxia_peak','palace_tang','study_republic','elf_forest','starship_bridge','cafe_dusk','graveyard_night','battle_field','magic_academy','space_cabin'].map(s => `<option value="${s}" ${n.sceneKey===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label><input type="checkbox" id="ed-ismain" ${n.isMain?'checked':''}/> 标记为主线节点</label></div>
        <div class="field"><label><input type="checkbox" id="ed-ishl" ${n.isHighlight?'checked':''}/> 标记为高光节点</label></div>
        <h4 style="margin-top:18px;font:14px;color:#8b7cf6;">选项 (${(n.choices||[]).length})</h4>
        <div id="choices-editor">${(n.choices||[]).map((c,i)=>`
          <div style="border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;margin-bottom:8px;">
            <div class="field"><label>选项 ${i+1}</label><input data-cidx="${i}" data-key="label" value="${escape(c.label)}" /></div>
            <div class="field"><label>跳转 →</label>
              <select data-cidx="${i}" data-key="next">
                <option value="">— 兜底下一节点 —</option>
                <optgroup label="剧情节点">${nextOpts.replace(`value="${c.next}"`, `value="${c.next}" selected`)}</optgroup>
                <optgroup label="结局">${endingOpts}</optgroup>
              </select>
            </div>
            <div class="field"><label>信任变化</label><input type="number" data-cidx="${i}" data-key="trust" value="${c.effects?.trust||0}" /></div>
            <div class="field"><label>亲密变化</label><input type="number" data-cidx="${i}" data-key="intimacy" value="${c.effects?.intimacy||0}" /></div>
          </div>`).join('')}
        </div>
        <div style="margin-top:12px;"><button class="btn" id="btn-del-node" style="border-color:#f6a6d8;color:#f6a6d8;">🗑 删除此节点</button></div>
      `;
      // 绑定
      ['speaker','text','chapterId','sceneKey','isMain','isHighlight'].forEach(k => {
        const el = document.getElementById('ed-' + k.replace('isMain','ismain').replace('isHighlight','ishl').replace('text','text').replace('chapterId','chapter').replace('sceneKey','scene'));
        if (!el) return;
        el.oninput = el.onchange = () => {
          const v = el.type === 'checkbox' ? el.checked : el.value;
          plot.nodes[n.id][k] = v;
          setDirty();
          renderPreview();
        };
      });
      // choices
      document.querySelectorAll('#choices-editor input, #choices-editor select').forEach(el => {
        el.oninput = el.onchange = () => {
          const i = parseInt(el.dataset.cidx);
          const k = el.dataset.key;
          if (!plot.nodes[n.id].choices[i].effects) plot.nodes[n.id].choices[i].effects = {};
          if (k === 'label' || k === 'next') plot.nodes[n.id].choices[i][k] = el.value;
          else plot.nodes[n.id].choices[i].effects[k] = parseInt(el.value || 0);
          setDirty();
          renderPreview();
        };
      });
      // 删除
      const delBtn = document.getElementById('btn-del-node');
      if (delBtn) delBtn.onclick = () => { if (!confirm('删除此节点？')) return; delete plot.nodes[n.id]; currentSelection = null; renderSide(); renderEditor(); renderPreview(); setDirty(); updateAudit(); };
    } else if (currentTab === 'chars') {
      const c = plot.chars.find(x => x.id === currentSelection);
      if (!c) return panel.innerHTML = '<p>找不到此角色</p>';
      panel.innerHTML = `
        <h3 style="font:18px 'Noto Serif SC',serif;font-weight:600;margin-bottom:12px;">编辑角色：${escape(c.name)}</h3>
        <div class="field"><label>姓名</label><input id="ed-cname" value="${escape(c.name)}" /></div>
        <div class="field"><label>角色定位</label>
          <select id="ed-crole">
            <option value="main" ${c.role==='main'?'selected':''}>主角</option>
            <option value="support" ${c.role==='support'?'selected':''}>配角</option>
            <option value="antag" ${c.role==='antag'?'selected':''}>反派</option>
          </select>
        </div>
        <div class="field"><label>亲密度（初始）</label><input type="number" id="ed-caff" value="${c.affinity||50}" /></div>
        <div class="field"><label>立绘 URL（可选）</label><input id="ed-cport" value="${escape(c.portrait||'')}" placeholder="portraits/xxx.png" /></div>
      `;
      document.getElementById('ed-cname').oninput = () => { c.name = document.getElementById('ed-cname').value; setDirty(); renderSide(); renderPreview(); };
      document.getElementById('ed-crole').onchange = () => { c.role = document.getElementById('ed-crole').value; setDirty(); renderSide(); renderPreview(); };
      document.getElementById('ed-caff').oninput = () => { c.affinity = parseInt(document.getElementById('ed-caff').value||50); setDirty(); };
      document.getElementById('ed-cport').oninput = () => { c.portrait = document.getElementById('ed-cport').value; setDirty(); renderPreview(); };
    }
  }

  // ===== 预览 =====
  function renderPreview() {
    const n = plot.nodes[currentSelection];
    if (!n) {
      document.getElementById('pv-scene').style.background = 'transparent';
      document.getElementById('pv-char').innerHTML = '<div style="color:rgba(255,255,255,.4);font-size:12px;">— 选一个节点看预览 —</div>';
      document.getElementById('pv-dlg').innerHTML = '<div style="color:rgba(255,255,255,.4);font-size:12px;">—</div>';
      return;
    }
    const sceneColors = {
      pavilion_night: 'linear-gradient(180deg, #0d1326, #1c1939 70%, #2a1f4e)',
      classroom_sunny: 'linear-gradient(180deg, #f6dca6, #fff5d6 70%, #b3c8ff)',
      neon_street: 'linear-gradient(180deg, #2a1a4a, #1c1939 70%, #5b3a9e)',
      palace_tang: 'radial-gradient(60% 60% at 50% 30%, #5b2026, #2a1019 70%)',
      study_republic: 'radial-gradient(60% 60% at 30% 30%, #3a2a1a, #2a1f0a 70%)',
      elf_forest: 'radial-gradient(80% 80% at 50% 60%, #1a4e2a, #0a1f14 70%)',
      starship_bridge: 'radial-gradient(60% 60% at 50% 30%, #0a1a4e, #050a1a 70%)'
    };
    document.getElementById('pv-scene').style.background = sceneColors[n.sceneKey] || 'linear-gradient(180deg, #1c1939, #08071a 70%)';
    const char = plot.chars.find(c => n.charIds && n.charIds.includes(c.id));
    document.getElementById('pv-char').innerHTML = char
      ? `<div style="width:80px;height:110px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);">${escape(char.name)}</div>
         <div>
           <div style="font-weight:600;color:#fff;">${escape(char.name)}</div>
           <div style="font-size:11px;color:rgba(255,255,255,.55);">${char.role==='main'?'主角':char.role==='antag'?'反派':'配角'} · ${char.mentions}次提及</div>
         </div>`
      : '<div style="color:rgba(255,255,255,.4);font-size:12px;">无人立绘</div>';
    document.getElementById('pv-dlg').innerHTML = `
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px;">
        <span style="font-family:'Cormorant Garamond',serif;color:#f6a6d8;">${escape(n.speaker||'旁白')}</span>
        ${n.isHighlight?'<span class="pill highlight">✦ 高光</span>':''}
        ${n.isMain?'<span class="pill" style="background:rgba(110,198,255,.16);color:#6ec6ff;">主线</span>':''}
      </div>
      <div style="white-space:pre-wrap;color:#fff;font:13px/1.7 'Noto Sans SC';">${escape(n.text||'')}</div>
      <div style="margin-top:14px;">
        ${(n.choices||[]).map((c,i)=>`<button class="opt-preview">${i+1}. ${escape(c.label)}</button>`).join('')}
      </div>`;
  }

  // ===== 操作按钮 =====
  document.getElementById('btn-save').onclick = () => {
    NovelStore.saveNovel(plot);
    dirty = false;
    document.getElementById('dirty-flag').style.display = 'none';
    // toast
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:999;background:#7cf6c0;color:#08071a;padding:10px 18px;border-radius:10px;font-size:13px;';
    t.textContent = '✅ 已保存到 localStorage';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
  };
  document.getElementById('btn-reset').onclick = () => {
    if (!confirm('放弃当前所有改动，恢复到加载时的版本？')) return;
    plot = JSON.parse(JSON.stringify(original));
    dirty = false;
    document.getElementById('dirty-flag').style.display = 'none';
    renderSide(); renderEditor(); renderPreview(); updateAudit();
  };
  document.getElementById('btn-run').onclick = () => {
    if (dirty && !confirm('有未保存的改动，是否先保存再进入游戏？')) return;
    if (dirty) NovelStore.saveNovel(plot);
    LJNav(`plot-runner.html?novelId=${plot.novel.id}`);
  };

  function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // 初始化：自动选第一个节点
  currentSelection = Object.keys(plot.nodes)[0];
  renderSide();
  renderEditor();
  renderPreview();
})();
</script>
<script>
document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
  if (!el || el.tagName !== 'A') return;
  var h = el.getAttribute('href') || '';
  if (h.charAt(0) === '#') {
    if (h.length > 1) {
      e.preventDefault();
      var t = document.getElementById(h.slice(1));
      if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      try { window.dispatchEvent(new Event('hashchange')); } catch (err) {}
    }
    return;
  }
  if (!h || /^[a-zA-Z][\w+.\-]*:/.test(h)) return;
  if (/([\w.\-]+)\.html(\?|#|$)/.test(h)) {
    e.preventDefault();
    window.LJNav(h);
  }
}, true);
</script>
</body>
</html>
