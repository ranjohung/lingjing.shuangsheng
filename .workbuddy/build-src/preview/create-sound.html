<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>创建声音 · 灵境</title>
<link rel="stylesheet" href="css/shell-v64.css">
<link rel="stylesheet" href="css/mobile-lock.css">
<style>
:root{--bg:#1A1A2E;--card:#16213E;--accent:#E94560;--xinyu:#6C5CE7;--ok:#4ECCA3;--warn:#FFB347;--text:#EAEAEA;--sub:#8A8A9A;--border:#2A2A4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:100px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar .back{font-size:18px;cursor:pointer;color:var(--accent)}
.topbar h1{font-size:17px;font-weight:600}
.topbar .quota{font-size:12px;color:var(--ok);background:rgba(78,202,163,.1);padding:4px 10px;border-radius:12px}
.container{padding:16px}
.section{margin-bottom:24px}
.section-title{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:12px;letter-spacing:1px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-card{background:var(--card);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.type-card:active,.type-card.selected{border-color:var(--accent);background:rgba(233,69,96,.05)}
.type-card .icon{font-size:28px;margin-bottom:6px}
.type-card .name{font-size:12px;font-weight:500;margin-bottom:2px}
.type-card .desc{font-size:10px;color:var(--sub)}
.form-label{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.form-label .ai-btn{font-size:11px;color:var(--xinyu);cursor:pointer}
.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;min-height:80px;resize:vertical;font-family:inherit}
.form-textarea:focus{border-color:var(--accent)}
.voice-list{display:flex;flex-direction:column;gap:10px}
.voice-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.voice-item:active,.voice-item.selected{border-color:var(--accent)}
.voice-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--xinyu),var(--accent));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.voice-info{flex:1;min-width:0}
.voice-name{font-size:14px;font-weight:500;margin-bottom:2px}
.voice-desc{font-size:11px;color:var(--sub)}
.voice-play{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0}
.param-group{margin-bottom:16px}
.param-label{font-size:13px;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between}
.param-label span:last-child{color:var(--xinyu);font-size:12px}
.slider-wrap{position:relative}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
.candidates{margin-top:12px}
.candidate-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.candidate-item:active,.candidate-item.selected{border-color:var(--ok)}
.candidate-item .ci{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--xinyu),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.candidate-item .cf{flex:1;min-width:0}
.candidate-item .cn{font-size:13px;font-weight:500;margin-bottom:2px}
.candidate-item .cd{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.candidate-item .play{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:12px;flex-shrink:0}
.generate-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center}
.cost-info{font-size:12px;color:var(--warn)}
.cost-info .free{color:var(--ok)}
.btn-gen{flex:1;padding:14px;background:linear-gradient(135deg,var(--accent),var(--xinyu));border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.waveform{height:40px;background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 12px;margin-top:12px}
.waveform .bar{width:3px;background:var(--accent);border-radius:2px;animation:wave 1s ease-in-out infinite}
.waveform .bar:nth-child(1){height:10px;animation-delay:0s}
.waveform .bar:nth-child(2){height:20px;animation-delay:.1s}
.waveform .bar:nth-child(3){height:30px;animation-delay:.2s}
.waveform .bar:nth-child(4){height:15px;animation-delay:.3s}
.waveform .bar:nth-child(5){height:25px;animation-delay:.4s}
.waveform .bar:nth-child(6){height:35px;animation-delay:.1s}
.waveform .bar:nth-child(7){height:20px;animation-delay:.2s}
.waveform .bar:nth-child(8){height:10px;animation-delay:.3s}
.waveform .bar:nth-child(9){height:28px;animation-delay:.15s}
.waveform .bar:nth-child(10){height:18px;animation-delay:.25s}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
</style>
<link rel="stylesheet" href="css/tabbar-embed.css">
</head>
<body>
<div class="topbar">
  <span class="back" onclick="history.back()">‹ 返回</span>
  <h1>🔊 创建声音</h1>
  <span class="quota">今日 5/5 免费</span>
</div>
<div class="container">
  <div class="section">
    <div class="section-title">声音类型</div>
    <div class="type-grid">
      <div class="type-card selected" onclick="sel(this)"><div class="icon">🗣️</div><div class="name">角色语音</div><div class="desc">角色台词/对白</div></div>
      <div class="type-card" onclick="sel(this)"><div class="icon">📢</div><div class="name">旁白</div><div class="desc">叙述/解说</div></div>
      <div class="type-card" onclick="sel(this)"><div class="icon">🎵</div><div class="name">音效</div><div class="desc">环境/动作音效</div></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">选择音色</div>
    <div class="voice-list">
      <div class="voice-item selected" onclick="vs(this)">
        <div class="voice-avatar">🧑</div>
        <div class="voice-info"><div class="voice-name">清冷男声</div><div class="voice-desc">低沉磁性·适合冷酷角色</div></div>
        <div class="voice-play">▶</div>
      </div>
      <div class="voice-item" onclick="vs(this)">
        <div class="voice-avatar">👩</div>
        <div class="voice-info"><div class="voice-name">温柔女声</div><div class="voice-desc">柔和甜美·适合治愈系角色</div></div>
        <div class="voice-play">▶</div>
      </div>
      <div class="voice-item" onclick="vs(this)">
        <div class="voice-avatar">🧙</div>
        <div class="voice-info"><div class="voice-name">沧桑老者</div><div class="voice-desc">低沉沧桑·适合智者/长老</div></div>
        <div class="voice-play">▶</div>
      </div>
      <div class="voice-item" onclick="vs(this)">
        <div class="voice-avatar">👧</div>
        <div class="voice-info"><div class="voice-name">元气少女</div><div class="voice-desc">活泼明亮·适合年少角色</div></div>
        <div class="voice-play">▶</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">台词内容</div>
    <div class="form-label"><span>输入要生成的台词</span><span class="ai-btn" onclick="aiHelp()">✨ AI帮我写台词</span></div>
    <textarea class="form-textarea" id="script" placeholder="输入角色要说的台词..."></textarea>
    <div id="ai-cands" class="candidates"></div>
  </div>
  <div class="section">
    <div class="section-title">语音参数</div>
    <div class="param-group">
      <div class="param-label"><span>语速</span><span id="speedVal">1.0x</span></div>
      <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('speedVal').textContent=this.value+'x'">
    </div>
    <div class="param-group">
      <div class="param-label"><span>语调</span><span id="pitchVal">正常</span></div>
      <input type="range" min="0" max="100" value="50" oninput="const v=+this.value;document.getElementById('pitchVal').textContent=v<30?'低沉':v<70?'正常':'高亢'">
    </div>
    <div class="param-group">
      <div class="param-label"><span>情感强度</span><span id="emoVal">中等</span></div>
      <input type="range" min="0" max="100" value="50" oninput="const v=+this.value;document.getElementById('emoVal').textContent=v<30?'平静':v<70?'中等':'强烈'">
    </div>
  </div>
</div>
<div class="generate-bar">
  <div class="cost-info"><span class="free">免费额度内</span> · 今日剩余 5 条</div>
  <button class="btn-gen" onclick="gen()">✨ 生成候选语音</button>
</div>
<script>
function sel(e){document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function vs(e){document.querySelectorAll('.voice-item').forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function aiHelp(){
  const c=document.getElementById('ai-cands');
  c.innerHTML='<div style="text-align:center;padding:16px;color:var(--xinyu);font-size:13px">AI正在构思台词...</div>';
  setTimeout(()=>{
    const d=[
      {n:'冷淡告别',d:'「……你走吧。从今以后，你我再无瓜葛。」'},
      {n:'温柔告白',d:'「其实从第一次见到你开始，我就知道，你是不一样的。」'},
      {n:'愤怒质问',d:'「你凭什么替我做决定？你有什么资格！」'},
      {n:'悲伤独白',d:'「我以为时间能冲淡一切……可每个夜晚，你的影子都会回来。」'},
      {n:'霸气宣言',d:'「这天下，我要让它换个模样。谁挡我，我便碾碎谁。」'}
    ];
    c.innerHTML=d.map((x,i)=>'<div class="candidate-item" onclick="useC(this,\''+x.d.replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\')"><div class="ci">'+['❄️','💕','😤','💔','👑'][i]+'</div><div class="cf"><div class="cn">'+x.n+'</div><div class="cd">'+x.d+'</div></div><div class="play">▶</div></div>').join('')+'<div style="text-align:center;margin-top:8px"><span style="font-size:12px;color:var(--xinyu);cursor:pointer" onclick="aiHelp()">🔄 换一批</span></div>';
  },1000);
}
function useC(e,d){document.querySelectorAll('.candidate-item').forEach(c=>c.classList.remove('selected'));e.classList.add('selected');document.getElementById('script').value=d}
function gen(){
  const btn=document.querySelector('.btn-gen');
  btn.textContent='⏳ 生成中...';btn.disabled=true;
  setTimeout(()=>{
    btn.textContent='✨ 生成候选语音';btn.disabled=false;
    alert('已生成4条候选语音，请在音色列表中试听选择！');
  },2000);
}
</script>
<script src="js/creator-store.js"></script>
<script src="js/creator-ai.js"></script>
<script src="js/creator-pages.js"></script>
<script src="js/tabbar.js"></script>
</body>
</html>
