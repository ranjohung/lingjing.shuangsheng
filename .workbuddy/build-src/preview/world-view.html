<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小说世界 · 沉浸模式 — 灵境 · 双生</title>
<meta name="description" content="由小说原文自动生成的小说世界，主线零删减，背景与角色由本地 SD + Blender 产出。">
<link rel="stylesheet" href="css/mobile-lock.css" />
<style>
:root{
  --gold:#F0D89A; --gold-mid:#D9B871; --gold-deep:#A8843C;
  --ink:#3A2E1C; --ink-soft:#6B5B43; --paper:#FBF3E0; --paper-2:#F6EAD0;
  --red:#E94560; --purple:#6C5CE7; --green:#00B894;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:#0b0b14; color:#fff; overflow:hidden;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;
}
button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; }

#game{ position:fixed; inset:0; overflow:hidden; }

/* ---------- 全屏背景 ---------- */
.bgwrap{ position:absolute; inset:0; }
#bg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 42%;
  transition:opacity .6s ease, transform 10s ease;
  background:linear-gradient(165deg,#16203a,#2c3a63 55%,#4a3a6b);
}
.bgtint{
  position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(180deg, rgba(8,8,18,.55) 0%, rgba(8,8,18,.02) 18%, rgba(8,8,18,.08) 55%, rgba(8,8,18,.80) 100%),
    radial-gradient(120% 70% at 50% 28%, transparent 40%, rgba(6,6,14,.55) 100%);
}
.bggrain{
  position:absolute; inset:0; opacity:.05; mix-blend-mode:overlay; pointer-events:none;
  background-image:repeating-conic-gradient(rgba(255,255,255,.7) 0 .0001turn, transparent 0 .0002turn);
}
.bgorn{
  position:absolute; left:0; right:0; bottom:0; height:90px; pointer-events:none; opacity:.45;
  background:radial-gradient(circle at 10% 100%, rgba(240,216,154,.18), transparent 38%),
             radial-gradient(circle at 90% 100%, rgba(240,216,154,.18), transparent 38%);
}

/* ---------- 电影上下遮幅 ---------- */
.cinema{
  position:absolute; left:0; right:0; height:42px; pointer-events:none;
  background:rgba(0,0,0,.35);
  z-index:55;
}
.cinema.top{ top:0; }
.cinema.bottom{ bottom:0; }

/* ---------- 顶部状态 ---------- */
.topbar{
  position:absolute; top:calc(8px + env(safe-area-inset-top)); left:0; right:0;
  z-index:60; display:flex; justify-content:center; gap:8px; padding:0 62px;
  pointer-events:none;
}
.tb{
  pointer-events:auto; display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; color:#F6EFDD; letter-spacing:.5px;
  background:linear-gradient(180deg, rgba(28,24,38,.72), rgba(18,16,26,.72));
  border:1px solid rgba(240,216,154,.34);
  border-radius:999px; padding:4px 11px;
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  box-shadow:0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
}
.tb b{ font-weight:600; color:var(--gold); }

/* ---------- 两侧悬浮栏 ---------- */
.rail{
  position:absolute; top:50%; transform:translateY(-50%);
  z-index:70; display:flex; flex-direction:column; gap:13px;
}
.rail.left{ left:8px; }
.rail.right{ right:8px; }
.rbtn{
  width:44px; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:7px 0 5px; border-radius:13px;
  background:linear-gradient(180deg, rgba(30,26,40,.62), rgba(16,14,24,.66));
  border:1px solid rgba(240,216,154,.24);
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  box-shadow:0 3px 12px rgba(0,0,0,.34);
  transition:transform .12s, border-color .2s, background .2s;
}
.rbtn:active{ transform:scale(.92); }
.rbtn .ic{ font-size:16px; line-height:1; color:#F7EFDA; }
.rbtn .lb{ font-size:9px; color:rgba(247,239,218,.78); letter-spacing:.5px; }
.rbtn.on{ border-color:rgba(240,216,154,.72); background:linear-gradient(180deg, rgba(96,72,32,.72), rgba(58,44,22,.72)); }
.rbtn.on .ic{ color:var(--gold); }
.rbtn.dis{ opacity:.45; }

/* ---------- 立绘层 ---------- */
.sprites{
  position:absolute; left:50%; bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:54; width:100%; height:54vh; pointer-events:none;
  display:flex; align-items:flex-end; justify-content:center; gap:0;
}
.sprite{
  position:relative; flex:0 0 auto; height:100%; max-width:42vw;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  opacity:0; transform:translateY(18px); transition:opacity .5s, transform .5s;
}
.sprite.in{ opacity:1; transform:translateY(0); }
.sprite img{
  max-height:100%; max-width:100%; object-fit:contain;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
}
.sprite .name{
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  font-size:10px; font-weight:700; color:#F6EFDD; letter-spacing:1px;
  padding:2px 10px; border-radius:999px;
  background:linear-gradient(180deg, rgba(30,24,40,.78), rgba(16,12,24,.78));
  border:1px solid rgba(240,216,154,.4);
  white-space:nowrap;
}
.sprite .placeholder{
  width:min(34vw,170px); height:100%; border-radius:20px 20px 8px 8px;
  background:linear-gradient(180deg, rgba(245,230,200,.22), rgba(30,24,40,.35));
  border:1.5px solid rgba(240,216,154,.35);
  box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
  position:relative;
}
.sprite .placeholder::before{
  content:''; position:absolute; top:10%; left:50%; transform:translateX(-50%);
  width:52%; padding-top:52%; border-radius:50%;
  background:linear-gradient(180deg, rgba(245,230,200,.35), rgba(180,150,100,.15));
  border:1px solid rgba(240,216,154,.3);
}
.sprite .placeholder::after{
  content:''; position:absolute; top:42%; left:50%; transform:translateX(-50%);
  width:74%; height:48%; border-radius:50% 50% 10px 10px;
  background:linear-gradient(180deg, rgba(245,230,200,.18), rgba(30,24,40,.25));
}

/* ---------- 场景热点 ---------- */
.hotlayer{
  position:absolute; left:50%; top:55%; transform:translate(-50%,-50%);
  z-index:65; width:min(72vw,300px);
  display:flex; flex-direction:column; gap:10px;
  pointer-events:none;
}
.hot{
  pointer-events:auto; position:relative;
  display:block; width:100%; text-align:center;
  font-size:13.5px; font-weight:600; letter-spacing:1.5px; color:var(--ink);
  padding:10px 14px 10px 32px;
  border-radius:12px;
  background:linear-gradient(180deg, rgba(251,243,224,.94), rgba(240,226,196,.90));
  border:1.5px solid rgba(168,132,60,.55);
  box-shadow:0 4px 16px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.75);
  transition:transform .13s, box-shadow .2s;
}
.hot:active{ transform:scale(.975); box-shadow:0 2px 8px rgba(0,0,0,.4); }
.hot::before{
  content:''; position:absolute; left:12px; top:50%;
  width:7px; height:7px; border-radius:2px;
  transform:translateY(-50%) rotate(45deg);
  background:linear-gradient(135deg,var(--gold-mid),var(--gold-deep));
}
.hot.loc{ background:linear-gradient(180deg, rgba(255,246,225,.95), rgba(243,229,197,.92)); }
.hot.loc::before{ background:linear-gradient(135deg,#E8B24C,#A8762A); }

/* ---------- 底部对话框（收窄） ---------- */
.dlg{
  position:absolute; left:16px; right:16px;
  bottom:calc(54px + env(safe-area-inset-bottom));
  z-index:66; max-height:22vh; min-height:72px; overflow-y:auto;
  padding:10px 12px 9px;
  border-radius:16px 16px 12px 12px;
  background:linear-gradient(180deg, rgba(251,243,224,.93), rgba(242,231,207,.90));
  border:1.5px solid rgba(168,132,60,.55);
  box-shadow:0 5px 20px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-overflow-scrolling:touch;
}
.dlg::-webkit-scrollbar{ width:0; }
.dlg::before,.dlg::after{
  content:''; position:absolute; width:12px; height:12px; pointer-events:none;
  border-color:rgba(168,132,60,.72);
}
.dlg::before{ left:5px; top:5px; border-left:1.5px solid; border-top:1.5px solid; border-radius:4px 0 0 0; }
.dlg::after{ right:5px; bottom:5px; border-right:1.5px solid; border-bottom:1.5px solid; border-radius:0 0 4px 0; }
.dlg-scene{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10px; font-weight:700; letter-spacing:.6px;
  color:#4A3A1E; background:linear-gradient(180deg,#F2E1B4,#E3CB90);
  border:1px solid rgba(168,132,60,.6); border-radius:999px;
  padding:2px 9px; margin-bottom:6px;
}
.dlg-scene .canon-mark{
  font-size:9px; color:#8a5c0a; background:rgba(255,255,255,.45);
  border-radius:999px; padding:1px 5px;
}
.dlg-text{
  font-size:14.5px; line-height:1.72; color:var(--ink);
  text-align:justify; word-break:break-word;
}
.dlg-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
.dlg-id{ font-size:9px; color:var(--ink-soft); opacity:.7; }
.dlg-chips{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{
  font-size:9px; color:#5A4A30; background:rgba(255,255,255,.5);
  border:1px solid rgba(168,132,60,.35); border-radius:999px; padding:2px 7px;
}
.chip.cam{ color:#4a3c7a; border-color:rgba(108,92,231,.4); background:rgba(232,228,255,.5); }

/* ---------- 底部操作 ---------- */
.ops{
  position:absolute; left:0; right:0; bottom:0; z-index:72;
  display:flex; gap:8px; align-items:center;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(8,8,16,.90) 45%, rgba(8,8,16,0));
}
.op{
  border-radius:10px; padding:9px 0; font-size:12.5px; font-weight:700; letter-spacing:.5px;
  border:1px solid transparent; transition:transform .12s, filter .2s;
}
.op:active{ transform:scale(.97); }
.op.prev{ flex:0 0 72px; font-weight:500; font-size:11.5px;
  color:rgba(247,239,218,.86); background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.16); }
.op.next{ flex:1; color:#3A2410; background:linear-gradient(135deg,#F3DC9E,#D9B060); border-color:rgba(255,255,255,.4);
  box-shadow:0 4px 12px rgba(217,176,96,.30); }
.op.home{ flex:0 0 72px; font-weight:500; font-size:11.5px;
  color:#d8f5ea; background:rgba(0,184,148,.18); border-color:rgba(0,184,148,.5); }
.op.dis{ opacity:.45; pointer-events:none; }

/* ---------- 模式选择 ---------- */
.veil{
  position:absolute; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start; padding:64px 18px 24px;
  background:linear-gradient(180deg, rgba(8,8,18,.92), rgba(6,6,14,.85)); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.veil-t{ font-size:22px; font-weight:800; letter-spacing:3px; color:var(--gold); margin-top:10px; }
.veil-s{ font-size:12px; color:rgba(247,239,218,.65); margin:8px 0 22px; text-align:center; line-height:1.8; }
.veil-list{ width:min(86vw,340px); display:flex; flex-direction:column; gap:12px; }
.mcard{
  position:relative; text-align:left; border-radius:14px; padding:16px 16px 15px;
  background:linear-gradient(180deg, rgba(251,243,224,.95), rgba(240,226,196,.92));
  border:1.5px solid rgba(168,132,60,.5);
  box-shadow:0 6px 22px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .13s;
}
.mcard:active{ transform:scale(.978); }
.mcard .mn{ font-size:16px; font-weight:800; color:var(--ink); letter-spacing:.8px; }
.mcard .md{ font-size:11.5px; color:var(--ink-soft); margin-top:7px; line-height:1.75; }
.mcard .tag{ position:absolute; top:12px; right:12px; font-size:9.5px; border-radius:999px; padding:2px 8px; font-weight:700; }
.tag.rec{ background:rgba(0,184,148,.16); color:#0a6b52; border:1px solid rgba(0,150,120,.45); }
.tag.soon{ background:rgba(120,110,90,.12); color:#7a6c54; border:1px solid rgba(120,110,90,.3); }
.mcard.lock{ opacity:.6; }

/* ---------- 世界加载页 ---------- */
.boot{
  position:absolute; inset:0; z-index:230;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#0a0a14; transition:opacity .5s;
}
.boot.vanish{ opacity:0; pointer-events:none; }
.boot-cov{
  width:110px; height:110px; border-radius:50%;
  display:grid; place-items:center; font-size:48px;
  background:linear-gradient(135deg,#2c3a63,#4a3a6b);
  border:2px solid rgba(240,216,154,.35);
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.boot-title{ font-size:20px; font-weight:800; letter-spacing:2px; color:var(--gold); margin-top:22px; }
.boot-sub{ font-size:11px; color:rgba(247,239,218,.55); margin-top:8px; text-align:center; line-height:1.8; }
.boot-meta{ font-size:10px; color:rgba(247,239,218,.4); margin-top:18px; }

/* ---------- 弹卡 ---------- */
.sheet{
  position:absolute; left:12px; right:12px; top:50%; transform:translateY(-50%);
  z-index:210; max-height:74vh; overflow-y:auto;
  border-radius:14px; padding:16px;
  background:linear-gradient(180deg, rgba(251,243,224,.96), rgba(242,231,207,.94));
  border:1.5px solid rgba(168,132,60,.55);
  box-shadow:0 10px 40px rgba(0,0,0,.55);
}
.sheet-x{ position:absolute; top:9px; right:12px; font-size:17px; color:var(--ink-soft); }
.sheet-t{ font-size:14px; font-weight:800; color:var(--ink); letter-spacing:1px; margin-bottom:10px; }
.sheet-tx{ font-size:14px; line-height:1.9; color:var(--ink); text-align:justify; }
.sheet-k{ display:inline-block; font-size:10px; font-weight:700; border-radius:5px; padding:2px 8px; margin-bottom:8px; }
.sheet-k.ex{ background:#BFEBD9; color:#0a4433; }
.sheet-k.loc{ background:#F0D89A; color:#4A3410; }
.sheet-img{ width:100%; border-radius:10px; display:block; margin-bottom:10px; }
.sheet-cap{ font-size:11px; color:var(--ink-soft); }

.toast{
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%) translateY(6px);
  z-index:300; max-width:74vw; text-align:center;
  font-size:12px; color:#F7EFDA; padding:9px 16px; border-radius:999px;
  background:rgba(20,18,30,.94); border:1px solid rgba(240,216,154,.35);
  opacity:0; transition:opacity .28s, transform .28s; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.hidden{ display:none !important; }
</style>
</head>
<body>

<div id="game">

  <div class="bgwrap">
    <img id="bg" src="" alt="场景" />
    <div class="bgtint"></div>
    <div class="bggrain"></div>
  </div>
  <div class="bgorn"></div>
  <div class="cinema top"></div><div class="cinema bottom"></div>

  <div class="topbar">
    <span class="tb" id="st-ch"><b>—</b></span>
    <span class="tb" id="st-prog">—</span>
    <span class="tb" id="st-mode">—</span>
  </div>

  <div class="rail left">
    <button class="rbtn" id="btn-back" aria-label="返回">
      <span class="ic">←</span><span class="lb">返回</span>
    </button>
    <button class="rbtn" id="btn-like" aria-label="点亮">
      <span class="ic" id="like-ic">♡</span><span class="lb">点亮</span>
    </button>
  </div>

  <div class="rail right">
    <button class="rbtn" id="btn-menu" aria-label="菜单">
      <span class="ic">☰</span><span class="lb">菜单</span>
    </button>
    <button class="rbtn" id="btn-fav" aria-label="收藏">
      <span class="ic">★</span><span class="lb">收藏</span>
    </button>
    <button class="rbtn" id="btn-3d" aria-label="3D 场景">
      <span class="ic">◇</span><span class="lb">3D</span>
    </button>
  </div>

  <div class="sprites" id="sprites"></div>

  <div class="hotlayer" id="hots"></div>

  <div class="dlg" id="dlg">
    <div class="dlg-scene" id="sc-cap">
      <span>—</span><span class="canon-mark" id="canon-mark">【原著剧情】</span>
    </div>
    <div class="dlg-text" id="canon-text">—</div>
    <div class="dlg-meta">
      <span class="dlg-id" id="anchor-meta"></span>
      <div class="dlg-chips" id="pres"></div>
    </div>
  </div>

  <div class="ops">
    <button class="op prev" id="b-prev">上一段</button>
    <button class="op next" id="b-next">继续 ▸</button>
    <button class="op home hidden" id="b-home">回主线</button>
  </div>

  <div class="veil" id="mode-veil">
    <div class="veil-t">选择进入方式</div>
    <div class="veil-s" id="mode-book">主线永远走原著 —— 你的选择只影响你自己的世界状态</div>
    <div class="veil-list">
      <button class="mcard" id="md-A">
        <span class="tag rec">推荐</span>
        <div class="mn">📖 原著阅读者</div>
        <div class="md">完整体验小说：原文 + 场景 + 镜头，按原著剧情推进，点击文字继续。</div>
      </button>
      <button class="mcard" id="md-B">
        <div class="mn">🏮 世界游客</div>
        <div class="md">进入这个世界看看：点击场景里的物件与地点自由探索，主线随时可以返回。</div>
      </button>
      <button class="mcard lock" id="md-C">
        <span class="tag soon">即将开放</span>
        <div class="mn">🎭 同人玩家</div>
        <div class="md">选择身份，在不破坏主线的前提下书写你的故事。</div>
      </button>
    </div>
  </div>

  <div class="sheet hidden" id="rv-sheet">
    <span class="sheet-x" id="rv-close">✕</span>
    <span class="sheet-k ex" id="rv-kind">【世界探索】</span>
    <div class="sheet-tx" id="rv-text"></div>
  </div>

  <div class="sheet hidden" id="m3d-sheet">
    <span class="sheet-x" id="m3d-close">✕</span>
    <div class="sheet-t" id="m3d-cap">3D 场景</div>
    <img class="sheet-img" id="m3d-img" src="" alt="3D 场景" />
    <div class="sheet-cap">本地 Blender 无头渲染 · 场景白模 + EEVEE</div>
  </div>

  <div class="boot" id="boot">
    <div class="boot-cov" id="boot-emoji">📖</div>
    <div class="boot-title" id="boot-title">—</div>
    <div class="boot-sub" id="boot-sub">正在进入小说世界</div>
    <div class="boot-meta" id="boot-meta">Canon Lock 已启用 · 原著不可改写</div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script>
var WORLD = null;
var BOOK = '';
var MODE = 'A';
var idx = 0;
var curBg = '';
var typing = null;

function $(id) { return document.getElementById(id); }

function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.classList.remove('show'); }, 1900);
}

function loadWorld() {
  var p = new URLSearchParams(location.search).get('book');
  if (p) {
    BOOK = p;
    loadWorldById(p);
  } else {
    fromLocal();
  }
}

function loadWorldById(id) {
  if (window.__LJ_WORLD__ && window.__LJ_WORLD__[id]) {
    WORLD = window.__LJ_WORLD__[id]; showBoot(); return;
  }
  var sc = document.createElement('script');
  sc.src = 'worlds/' + id + '.js';
  sc.onload = function () {
    if (window.__LJ_WORLD__ && window.__LJ_WORLD__[id]) { WORLD = window.__LJ_WORLD__[id]; showBoot(); }
    else { fetchWorld(id); }
  };
  sc.onerror = function () { fetchWorld(id); };
  document.head.appendChild(sc);
}

function fetchWorld(id) {
  fetch('worlds/' + id + '.json').then(function (r) {
    if (!r.ok) throw new Error('status ' + r.status);
    return r.json();
  }).then(function (w) {
    WORLD = w; showBoot();
  }).catch(function () {
    fromLocal();
  });
}

function fromLocal() {
  try {
    var raw = localStorage.getItem('lingjing_forge_current');
    var obj = raw ? JSON.parse(raw) : null;
    WORLD = obj && obj.world;
    BOOK = obj && obj.bookId ? obj.bookId : '';
  } catch (e) {}
  if (!WORLD) { location.replace('world-forge.html'); return; }
  showBoot();
}

function showBoot() {
  if (!WORLD) { location.replace('world-forge.html'); return; }
  $('boot-title').textContent = '《' + WORLD.meta.title + '》';
  var sc = WORLD.scenes[0] || {};
  $('boot-sub').textContent = (sc.location || '未知世界') + ' · 正在生成场景';
  $('boot-meta').textContent = 'Canon Lock · ' + WORLD.anchors.length + ' 个原著锚点 · 原文不可改写';
  setTimeout(function () {
    $('boot').classList.add('vanish');
    setTimeout(function () { boot(); }, 520);
  }, 1200);
}

function boot() {
  $('mode-book').textContent = '《' + WORLD.meta.title + '》 — 主线永远走原著，你的选择只影响你自己的世界状态';
  $('md-A').addEventListener('click', function () { enter('A'); });
  $('md-B').addEventListener('click', function () { enter('B'); });
}

function enter(m) {
  MODE = m;
  $('mode-veil').classList.add('hidden');
  $('b-home').classList.toggle('hidden', m !== 'B');
  idx = 0;
  render();
}

function currentScene() {
  var a = WORLD.anchors[idx];
  return WORLD.scenes.filter(function (s) { return a.idx >= s.from && a.idx <= s.to; })[0] || WORLD.scenes[0];
}

function bgForScene(sc) {
  var bg = WORLD.assets.backgrounds.filter(function (b) { return b.scene_ids.indexOf(sc.scene_id) >= 0; })[0];
  if (bg && bg.image) return bg.image;
  var m3d = WORLD.assets.models3d.filter(function (m) { return m.kind === sc.kind; })[0];
  if (m3d && m3d.render) return 'img/novel-forge/' + BOOK + '/3d/' + m3d.render;
  return '';
}

function m3dForScene(sc) {
  return WORLD.assets.models3d.filter(function (m) { return m.kind === sc.kind; })[0];
}

function typeText(el, str) {
  if (typing) { clearInterval(typing); typing = null; }
  el.textContent = '';
  var i = 0;
  var step = Math.max(1, Math.round(str.length / 90));
  typing = setInterval(function () {
    i += step;
    if (i >= str.length) { el.textContent = str; clearInterval(typing); typing = null; return; }
    el.textContent = str.slice(0, i);
  }, 16);
}

function render() {
  var a = WORLD.anchors[idx];
  if (!a) return;
  var sc = currentScene();
  var p = WORLD.presentation[a.id] || {};

  var bgKey = bgForScene(sc) || 'linear-gradient(165deg,#16203a,#2c3a63 55%,#4a3a6b)';
  if (bgKey !== curBg) {
    curBg = bgKey;
    var img = $('bg');
    img.style.opacity = 0;
    setTimeout(function () {
      if (bgKey.indexOf('linear-gradient') === 0) {
        img.removeAttribute('src');
        img.style.background = bgKey;
      } else {
        img.style.background = '';
        img.setAttribute('src', bgKey);
      }
      img.style.opacity = 1;
    }, 240);
  }

  $('sc-cap').childNodes[0].textContent = (sc.location || '—') + ((p.camera && p.camera[0]) ? ' · ' + p.camera[0] : '');
  $('canon-mark').textContent = MODE === 'A' ? '【原著剧情】' : '【世界探索】';

  var chips = [];
  if (p.action) chips.push('<span class="chip">动作 · ' + p.action + '</span>');
  (p.camera || []).slice(1).forEach(function (c) { chips.push('<span class="chip cam">镜头 · ' + c + '</span>'); });
  $('pres').innerHTML = chips.join('');

  typeText($('canon-text'), a.text);
  $('anchor-meta').textContent = 'Canon ' + a.id + ' · 第' + a.chapter + '章 · ' + a.type;

  $('st-ch').innerHTML = '<b>第' + a.chapter + '章</b>';
  $('st-prog').textContent = (idx + 1) + ' / ' + WORLD.anchors.length;
  $('st-mode').textContent = MODE === 'A' ? '原著阅读者' : '世界游客';

  $('b-prev').classList.toggle('dis', idx === 0);

  renderSprites(p);
  renderHots(a, sc);

  var m3d = m3dForScene(sc);
  $('btn-3d').classList.toggle('dis', !m3d);
  $('btn-3d').onclick = function () {
    if (!m3d) { toast('本场景暂无 3D 模型'); return; }
    $('m3d-img').src = 'img/novel-forge/' + BOOK + '/3d/' + m3d.render;
    $('m3d-cap').textContent = '3D 场景 · ' + sc.location;
    $('m3d-sheet').classList.remove('hidden');
  };
}

function renderSprites(p) {
  var box = $('sprites');
  var chars = p.characters || [];
  if (!chars.length) { box.innerHTML = ''; return; }
  var html = '';
  chars.forEach(function (c) {
    var por = findPortrait(c);
    if (por) {
      html += '<div class="sprite"><img src="' + por.image + '" alt="' + c + '" /><span class="name">' + c + '</span></div>';
    } else {
      html += '<div class="sprite"><div class="placeholder"></div><span class="name">' + c + '</span></div>';
    }
  });
  box.innerHTML = html;
  setTimeout(function () {
    box.querySelectorAll('.sprite').forEach(function (el, i) {
      setTimeout(function () { el.classList.add('in'); }, i * 120);
    });
  }, 30);
}

function findPortrait(name) {
  if (!WORLD.assets.portraits) return null;
  return WORLD.assets.portraits.filter(function (p) {
    return name.indexOf(p.character) >= 0 || p.character.indexOf(name) >= 0;
  })[0];
}

function renderHots(a, sc) {
  var box = $('hots');
  var html = '';
  var seen = {};
  WORLD.interactions.forEach(function (ix) {
    if (seen[ix.object]) return;
    if (MODE === 'B') {
      var anchor = WORLD.anchors.filter(function (aa) { return aa.id === ix.anchor_id; })[0];
      var inScene = anchor && anchor.idx >= sc.from && anchor.idx <= sc.to;
      if (inScene) { html += hotBtn(ix); seen[ix.object] = 1; }
    } else {
      if (ix.anchor_id === a.id) { html += hotBtn(ix); seen[ix.object] = 1; }
    }
  });
  box.innerHTML = html;
  var btns = box.querySelectorAll('.hot');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      openReveal(this.getAttribute('data-text'), this.getAttribute('data-kind'));
    });
  }
  box.style.display = btns.length ? 'flex' : 'none';
}

function hotBtn(ix) {
  var cls = ix.kind === '地点' ? 'hot loc' : 'hot';
  var text = ix.kind === '地点'
    ? ('你沿着小径走向' + ix.object + '，此处景物与原文一一对应。')
    : ('你细看' + ix.object + '，它在此处出现，出自原文。');
  return '<button class="' + cls + '" data-kind="' + ix.kind + '" data-text="' + text + '">' + ix.object + '</button>';
}

function openReveal(text, kind) {
  $('rv-kind').className = 'sheet-k ' + (kind === '地点' ? 'loc' : 'ex');
  $('rv-kind').textContent = kind === '地点' ? '【地点探索】' : '【世界探索】';
  $('rv-text').textContent = text;
  $('rv-sheet').classList.remove('hidden');
}

$('rv-close').addEventListener('click', function () { $('rv-sheet').classList.add('hidden'); });
$('m3d-close').addEventListener('click', function () { $('m3d-sheet').classList.add('hidden'); });

$('btn-back').addEventListener('click', function () { location.href = 'library.html'; });
$('btn-like').addEventListener('click', function () {
  var on = this.classList.toggle('on');
  $('like-ic').textContent = on ? '♥' : '♡';
  toast(on ? '已点亮这个世界' : '已取消点亮');
});
$('btn-menu').addEventListener('click', function () { $('mode-veil').classList.remove('hidden'); });
$('btn-fav').addEventListener('click', function () {
  var on = this.classList.toggle('on');
  toast(on ? '已收藏到「我的世界」' : '已取消收藏');
});

$('b-next').addEventListener('click', function () {
  if (typing) { clearInterval(typing); typing = null; $('canon-text').textContent = WORLD.anchors[idx].text; return; }
  if (idx < WORLD.anchors.length - 1) { idx++; render(); }
  else toast('已到本章最后一幕 · 全文后续内容即将开放');
});
$('b-prev').addEventListener('click', function () {
  if (idx > 0) { idx--; render(); }
});
$('b-home').addEventListener('click', function () {
  $('rv-sheet').classList.add('hidden');
  toast('主线始终在这里：' + (idx + 1) + ' / ' + WORLD.anchors.length);
});

loadWorld();
</script>
</body>
</html>
