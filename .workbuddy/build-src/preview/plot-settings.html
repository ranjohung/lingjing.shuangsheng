<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏设置 · 灵境 · 双生</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; padding: 0; min-height: 100vh; background: linear-gradient(180deg, #0d1326 0%, #1c1939 60%, #0a0d1a 100%); color: #e8ecf4; font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
* { box-sizing: border-box; }

/* 统一返回箭头 */
.back-arrow { position: fixed; top: 14px; left: 14px; z-index: 60;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px 8px 12px; border-radius: 999px;
  background: rgba(20,18,46,.75); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.15); color: #fff;
  font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: none;
  transition: all .2s;
}
.back-arrow:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); transform: translateX(-2px); }
.back-arrow .icon { font-size: 18px; line-height: 1; font-weight: 700; }

.page { max-width: 560px; margin: 0 auto; padding: 70px 22px 60px; }
.head { text-align: center; margin-bottom: 28px; }
.head h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; color: #fff; }
.head p { margin: 0; font-size: 12px; color: #9faec2; letter-spacing: .2em; }
.card { background: linear-gradient(180deg, rgba(28,24,56,.7), rgba(11,8,28,.7));
  border: 1px solid rgba(255,255,255,.10); border-radius: 14px;
  padding: 18px 22px; margin-bottom: 14px; }
.card-title { font-size: 11px; color: #c9a8ff; letter-spacing: .25em; margin-bottom: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.row:last-child { border-bottom: none; }
.row-label { font-size: 14px; color: #e8ecf4; }
.row-label small { display: block; font-size: 11px; color: #6e7d96; margin-top: 2px; }
.row-ctrl { display: flex; gap: 6px; align-items: center; }

/* Slider */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  flex: 1; margin: 0 14px; height: 4px; background: rgba(255,255,255,.12);
  border-radius: 2px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(120deg, #c9a8ff, #6ec6ff);
  border: 2px solid #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(142,91,216,.4);
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(120deg, #c9a8ff, #6ec6ff);
  border: 2px solid #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(142,91,216,.4);
}
.speed-val { width: 70px; text-align: right; font-size: 13px; color: #fff; font-variant-numeric: tabular-nums; }

/* Toggle */
.toggle { position: relative; width: 44px; height: 22px; background: rgba(255,255,255,.12); border-radius: 999px; cursor: pointer; transition: all .2s; border: none; padding: 0; }
.toggle::after { content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: all .2s; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.toggle.on { background: linear-gradient(120deg, #8e5bd8, #5b9cd8); }
.toggle.on::after { left: 24px; }

.btn { padding: 11px 18px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14); color: #e8ecf4; font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s; }
.btn:hover { background: rgba(255,255,255,.08); }
.btn.primary { background: linear-gradient(120deg, rgba(216,91,142,.30), rgba(142,91,216,.30)); border-color: rgba(216,91,142,.55); color: #fff; }
.btn.primary:hover { filter: brightness(1.15); }
.actions { display: flex; gap: 10px; margin-top: 22px; }
.actions .btn { flex: 1; text-decoration: none; text-align: center; display: inline-block; }

.notice { padding: 10px 14px; border-radius: 8px; background: rgba(91,197,160,.10); border: 1px solid rgba(91,197,160,.35); color: #7cf6c0; font-size: 12px; margin-top: 14px; display: none; }
.notice.show { display: block; }

@media (max-width: 768px) {
  .page { padding: 60px 16px 40px; }
  .head h1 { font-size: 18px; }
  .card { padding: 14px 16px; }
}
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
</head>
<body>
<a class="back-arrow" href="plot-runner.html" id="backArrow"><span class="icon">◀</span><span>返回游戏</span></a>

<div class="page">
  <div class="head">
    <h1>⚙ 游戏设置</h1>
    <p>SETTINGS · 只显示当前功能区</p>
  </div>

  <div class="card">
    <div class="card-title">文字显示</div>
    <div class="row">
      <div class="row-label">打字机速度<small>数字越小越快，10 为最快</small></div>
      <div class="row-ctrl">
        <input type="range" id="set-speed" min="10" max="120" step="4" value="38" />
        <span class="speed-val" id="set-speed-val">38ms/字</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">游戏模式</div>
    <div class="row">
      <div class="row-label">自动模式<small>开启后每 3.5 秒自动推进对话</small></div>
      <button class="toggle" id="set-auto" aria-label="自动模式"></button>
    </div>
    <div class="row">
      <div class="row-label">快进模式<small>开启后跳过打字机，立刻显示全文</small></div>
      <button class="toggle" id="set-skip" aria-label="快进模式"></button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">音频</div>
    <div class="row">
      <div class="row-label">背景音乐<small>不同场景自动切换 BGM</small></div>
      <button class="toggle" id="set-bgm" aria-label="背景音乐"></button>
    </div>
    <div class="row">
      <div class="row-label">音效<small>点击 / 选项 / 结局音效</small></div>
      <button class="toggle" id="set-sfx" aria-label="音效"></button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">剧情</div>
    <div class="row">
      <div class="row-label">重新开始本小说<small>清除当前进度，回到开头</small></div>
      <button class="btn" id="set-reset">↻ 重置</button>
    </div>
    <div class="row">
      <div class="row-label">清除所有存档<small>5 个槽位全部清空</small></div>
      <button class="btn" id="set-clear-saves" style="color:#ff9eb8;border-color:rgba(216,91,142,.35)">清空</button>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="actions">
    <a class="btn primary" href="plot-runner.html" id="saveBtn">✓ 保存并返回游戏</a>
  </div>
</div>

<script>
const params = new URLSearchParams(LJSearch());
const novelId = params.get('novelId') || 'demo_palace';
const KEY = 'plotrunner.opts';
const SAVES_KEY_PREFIX = 'plotrunner.save.';
const RUNNER_KEY = 'plotrunner.last.';

function loadOpts() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function saveOpts(o) { localStorage.setItem(KEY, JSON.stringify(o)); }

let opts = loadOpts();
opts.textSpeed = opts.textSpeed ?? 38;
opts.autoMode = opts.autoMode ?? false;
opts.skipMode = opts.skipMode ?? false;
opts.bgm = opts.bgm ?? true;
opts.sfx = opts.sfx ?? true;

const speed = document.getElementById('set-speed');
const speedVal = document.getElementById('set-speed-val');
const autoBtn = document.getElementById('set-auto');
const skipBtn = document.getElementById('set-skip');
const bgmBtn = document.getElementById('set-bgm');
const sfxBtn = document.getElementById('set-sfx');
const resetBtn = document.getElementById('set-reset');
const clearSavesBtn = document.getElementById('set-clear-saves');
const notice = document.getElementById('notice');
const backArrow = document.getElementById('backArrow');

function syncUI() {
  speed.value = opts.textSpeed;
  speedVal.textContent = opts.textSpeed + 'ms/字';
  autoBtn.classList.toggle('on', opts.autoMode);
  skipBtn.classList.toggle('on', opts.skipMode);
  bgmBtn.classList.toggle('on', opts.bgm);
  sfxBtn.classList.toggle('on', opts.sfx);
}
syncUI();

// 返回箭头携带 novelId
if (backArrow) backArrow.href = `plot-runner.html?novelId=${novelId}`;

speed.oninput = () => { opts.textSpeed = parseInt(speed.value, 10); speedVal.textContent = opts.textSpeed + 'ms/字'; };
autoBtn.onclick = () => { opts.autoMode = !opts.autoMode; syncUI(); };
skipBtn.onclick = () => { opts.skipMode = !opts.skipMode; syncUI(); };
bgmBtn.onclick = () => { opts.bgm = !opts.bgm; syncUI(); };
sfxBtn.onclick = () => { opts.sfx = !opts.sfx; syncUI(); };
resetBtn.onclick = () => {
  if (!confirm('确认重置当前小说进度？此操作不可撤销。')) return;
  localStorage.removeItem(RUNNER_KEY + novelId);
  showNotice('已重置 — 返回游戏将从头开始');
  setTimeout(() => LJNav(`plot-runner.html?novelId=${novelId}`, 800));
};
clearSavesBtn.onclick = () => {
  if (!confirm('确认清空该小说的所有 5 个存档槽位？')) return;
  for (let i = 0; i < 5; i++) localStorage.removeItem(SAVES_KEY_PREFIX + novelId + '.' + i);
  showNotice('已清空所有存档');
};

document.getElementById('saveBtn').onclick = (e) => {
  e.preventDefault();
  saveOpts(opts);
  showNotice('✓ 已保存');
  setTimeout(() => LJNav(`plot-runner.html?novelId=${novelId}`, 600));
};

function showNotice(msg) {
  notice.textContent = msg;
  notice.classList.add('show');
  setTimeout(() => notice.classList.remove('show'), 2400);
}
</script>
</body>
</html>
