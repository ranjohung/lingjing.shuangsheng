<style>
/* =================================================================
 * plot-detail 详情页专属样式（page-level override ≤ 30 行）
 * ================================================================= */
.pl-tabs{display:flex;gap:8px;padding:12px var(--margin);border-bottom:1px solid var(--line)}
.pl-tab{padding:8px 16px;font-size:14px;color:var(--sub);border-radius:8px;cursor:pointer}
.pl-tab.active{color:#fff;background:var(--accent)}
.pl-pane{padding:16px var(--margin)}
.pl-empty{text-align:center;color:var(--sub);padding:40px 0;font-size:13px}
.lj-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:rgba(0,0,0,.85);color:#fff;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
.lj-toast.show{opacity:1}
.lj-toast.warn{border-left:3px solid #FFB347}
.lj-toast.ok{border-left:3px solid #4ECCA3}
</style>
<style>
/* 主演横滑 */
.pl-cast{padding:12px var(--margin);overflow:hidden}
.pl-cast-list{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.pl-cast-list::-webkit-scrollbar{display:none}
.pl-cast-card{flex:0 0 110px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px}
.pl-cast-cover{width:90px;height:120px;border-radius:10px;display:grid;place-items:center;font-size:48px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.pl-cast-name{font-size:13px;font-weight:600}
.pl-cast-alias{font-size:11px;color:var(--sub);text-align:center}
/* 中部 banner */
.pl-banner{padding:0 var(--margin) 12px}
.pl-banner-card{position:relative;background:linear-gradient(135deg,#FFE4B5,#FFC0CB);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);border:1px solid #FFB6C1}
.pl-banner-badge{position:absolute;top:8px;right:12px;background:#E94560;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px}
.pl-banner-emoji{font-size:36px}
.pl-banner-title{font-size:16px;font-weight:700;color:#8B4513}
.pl-banner-sub{font-size:12px;color:#A0522D;grid-column:2/4}
.pl-banner-period{font-size:11px;color:#A0522D;grid-column:1/4}
/* 互动区 */
.pl-section-title{font-size:16px;font-weight:700;padding:12px var(--margin) 8px;display:flex;align-items:center;justify-content:space-between}
.pl-interact-tabs{display:flex;gap:6px;padding:0 var(--margin) 8px}
.pl-interact-tab{padding:4px 10px;font-size:12px;color:var(--sub);border-radius:6px;cursor:pointer;border:1px solid var(--line)}
.pl-interact-tab.active{color:var(--accent);border-color:var(--accent)}
.pl-posts{display:flex;gap:10px;overflow-x:auto;padding:0 var(--margin);-webkit-overflow-scrolling:touch}
.pl-posts::-webkit-scrollbar{display:none}
.pl-post-card{flex:0 0 220px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.pl-post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pl-post-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:18px}
.pl-post-user{font-size:13px;font-weight:600}
.pl-post-time{font-size:11px;color:var(--sub)}
.pl-post-content{font-size:13px;line-height:1.5;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pl-post-badge{font-size:10px;color:var(--sub);margin-top:8px}
/* 交流区 */
.pl-groups{display:flex;gap:10px;padding:0 var(--margin) 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pl-groups::-webkit-scrollbar{display:none}
.pl-group-card{flex:0 0 180px;background:linear-gradient(135deg,#FFF5E6,#FFE4B5);border:1px solid #FFB6C1;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#8B4513;cursor:pointer;position:relative}
.pl-group-emoji{font-size:28px}
.pl-group-name{font-size:13px;font-weight:700;text-align:center}
.pl-group-info{display:flex;gap:8px;font-size:11px}
.pl-group-price{color:#E94560;font-weight:700}
.pl-group-members{color:#A0522D}
.pl-group-cta{position:absolute;bottom:6px;right:8px;background:#E94560;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px}
/* 底部操作栏 */
.pl-action-bar{position:fixed;bottom:60px;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(0,0,0,.95);border-top:1px solid var(--line);padding:10px var(--margin);display:flex;align-items:center;gap:10px;z-index:60}
.pl-act-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);cursor:pointer;border:none;background:none;padding:4px}
.pl-act-btn .ico{font-size:20px}
.pl-act-btn.liked{color:var(--accent)}
.pl-act-start{flex:2;background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;font-weight:700;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;border:none}
/* 角色卡 */
.pl-roles-list{display:flex;flex-direction:column;gap:10px}
.pl-role-card{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.pl-role-rank{font-size:11px;color:var(--sub);font-weight:700;padding-top:4px}
.pl-role-emoji{font-size:36px}
.pl-role-name{font-size:14px;font-weight:700}
.pl-role-stat{font-size:11px;color:var(--sub);margin:4px 0}
.pl-role-line{font-size:12px;color:#fff;background:var(--accent);padding:6px 10px;border-radius:8px;margin-top:6px;font-style:italic}
/* 榜单 */
.pl-rank-section{margin-bottom:16px}
.pl-rank-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.pl-rank-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.pl-rank-num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:12px;font-weight:700}
.pl-rank-num-top{background:var(--accent);color:#fff}
.pl-rank-num-normal{background:var(--line);color:var(--sub)}
.pl-rank-name{flex:1;font-size:14px}
.pl-rank-score{font-size:13px;color:var(--accent);font-weight:700}
/* V20-J 介绍大图 hero 区 */
.pl-hero{position:relative;height:210px;display:flex;align-items:flex-end;overflow:hidden}
.pl-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,26,46,.05) 30%,rgba(26,26,46,.94) 100%)}
.pl-hero-emoji{position:absolute;top:36px;left:0;right:0;text-align:center;font-size:78px;text-shadow:0 6px 18px rgba(0,0,0,.55);z-index:1}
.pl-hero-info{position:relative;z-index:2;padding:14px var(--margin) 12px;width:100%}
.pl-hero-title{font-size:20px;font-weight:700;color:#fff}
.pl-hero-sub{font-size:12px;color:var(--sub);margin-top:2px}
.pl-hero-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pl-hero-tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 8px}
.pl-hero-summary{padding:12px var(--margin) 0;font-size:13px;color:rgba(255,255,255,.75);line-height:1.8}
.pl-hero-stats{display:flex;gap:18px;padding:10px var(--margin) 2px;font-size:11px;color:var(--sub)}
.pl-hero-stats b{display:block;color:#fff;font-size:14px;font-weight:700}
</style>
