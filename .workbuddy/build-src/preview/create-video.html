<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>创建视频 · 灵境</title>
<link rel="stylesheet" href="css/shell-v64.css">
<link rel="stylesheet" href="css/mobile-lock.css">
<style>
:root{--bg:#1A1A2E;--card:#16213E;--accent:#E94560;--xinyu:#6C5CE7;--ok:#4ECCA3;--warn:#FFB347;--text:#EAEAEA;--sub:#8A8A9A;--border:#2A2A4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:100px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar .back{font-size:18px;cursor:pointer;color:var(--accent)}
.topbar h1{font-size:17px;font-weight:600}
.topbar .quota{font-size:12px;color:var(--ok);background:rgba(78,202,163,.1);padding:4px 10px;border-radius:12px}
.container{padding:16px}
.section{margin-bottom:24px}
.section-title{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:12px;letter-spacing:1px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-card{background:var(--card);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.type-card:active,.type-card.selected{border-color:var(--accent);background:rgba(233,69,96,.05)}
.type-card .icon{font-size:28px;margin-bottom:6px}
.type-card .name{font-size:12px;font-weight:500;margin-bottom:2px}
.type-card .desc{font-size:10px;color:var(--sub)}
.form-label{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.form-label .ai-btn{font-size:11px;color:var(--xinyu);cursor:pointer}
.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;min-height:100px;resize:vertical;font-family:inherit}
.form-textarea:focus{border-color:var(--accent)}
.dur-options{display:flex;gap:12px}
.dur-btn{flex:1;padding:16px;background:var(--card);border-radius:12px;text-align:center;cursor:pointer;border:2px solid transparent}
.dur-btn.selected{border-color:var(--accent)}
.dur-btn .dur-t{font-size:20px;font-weight:700;margin-bottom:2px}
.dur-btn .dur-d{font-size:11px;color:var(--sub)}
.style-tags{display:flex;flex-wrap:wrap;gap:8px}
.style-tag{padding:8px 14px;background:var(--card);border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);transition:all .2s}
.style-tag.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.candidates{margin-top:12px}
.candidate-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.candidate-item:active,.candidate-item.selected{border-color:var(--ok)}
.candidate-item .ci{width:60px;height:40px;background:linear-gradient(135deg,var(--xinyu),var(--accent));border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.candidate-item .cf{flex:1;min-width:0}
.candidate-item .cn{font-size:13px;font-weight:500;margin-bottom:2px}
.candidate-item .cd{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.generate-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center}
.cost-info{font-size:12px;color:var(--warn)}
.cost-info .free{color:var(--ok)}
.btn-gen{flex:1;padding:14px;background:linear-gradient(135deg,var(--accent),var(--xinyu));border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-sheet{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:24px;max-height:80vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center}
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.video-card{aspect-ratio:9/16;max-height:200px;background:var(--card);border-radius:16px;overflow:hidden;position:relative;cursor:pointer;border:3px solid transparent}
.video-card.selected{border-color:var(--ok)}
.video-card .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--sub)}
.video-card .ph .gi{font-size:36px;opacity:.6}
.video-card .play{position:absolute;bottom:8px;left:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.video-card .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:none;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:bold}
.video-card.selected .ck{display:flex}
.ref-select{margin-top:16px;padding:12px;background:var(--card);border-radius:12px}
.ref-select label{font-size:12px;color:var(--sub);display:block;margin-bottom:8px}
.ref-options{display:flex;gap:8px;flex-wrap:wrap}
.ref-opt{padding:6px 12px;background:var(--bg);border-radius:8px;font-size:11px;cursor:pointer;border:1px solid var(--border)}
.ref-opt.selected{border-color:var(--xinyu);color:var(--xinyu)}
</style>
<link rel="stylesheet" href="css/tabbar-embed.css">
</head>
<body>
<div class="topbar">
  <span class="back" onclick="history.back()">‹ 返回</span>
  <h1>🎬 创建视频</h1>
  <span class="quota">本月 1/1 免费</span>
</div>
<div class="container">
  <div class="section">
    <div class="section-title">视频类型</div>
    <div class="type-grid">
      <div class="type-card selected" onclick="sel(this)"><div class="icon">🎥</div><div class="name">角色预告</div><div class="desc">角色登场动画</div></div>
      <div class="type-card" onclick="sel(this)"><div class="icon">📖</div><div class="name">剧情片段</div><div class="desc">关键剧情演绎</div></div>
      <div class="type-card" onclick="sel(this)"><div class="icon">🌅</div><div class="name">动态壁纸</div><div class="desc">循环动态背景</div></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">场景描述</div>
    <div class="form-label"><span>描述视频画面</span><span class="ai-btn" onclick="aiHelp()">✨ AI帮我写脚本</span></div>
    <textarea class="form-textarea" id="prompt" placeholder="描述你想要的视频内容，例如：角色在雨中撑伞回眸，镜头缓慢推进，背景是霓虹闪烁的街道..."></textarea>
    <div id="ai-cands" class="candidates"></div>
  </div>
  <div class="section">
    <div class="section-title">视频时长</div>
    <div class="dur-options">
      <div class="dur-btn selected" onclick="dur(this)"><div class="dur-t">6s</div><div class="dur-d">短视频片段</div></div>
      <div class="dur-btn" onclick="dur(this)"><div class="dur-t">15s</div><div class="dur-d">完整预告</div></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">视觉风格</div>
    <div class="style-tags">
      <div class="style-tag selected" onclick="stag(this)">电影质感</div>
      <div class="style-tag" onclick="stag(this)">动画风格</div>
      <div class="style-tag" onclick="stag(this)">水墨意境</div>
      <div class="style-tag" onclick="stag(this)">赛博朋克</div>
      <div class="style-tag" onclick="stag(this)">梦幻唯美</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">运镜方式</div>
    <div class="style-tags">
      <div class="style-tag selected" onclick="stag(this)">缓慢推进</div>
      <div class="style-tag" onclick="stag(this)">环绕拍摄</div>
      <div class="style-tag" onclick="stag(this)">固定机位</div>
      <div class="style-tag" onclick="stag(this)">跟随角色</div>
      <div class="style-tag" onclick="stag(this)">俯拍视角</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">参考素材（可选）</div>
    <div class="ref-select">
      <label>使用已有素材作为参考</label>
      <div class="ref-options">
        <div class="ref-opt selected">不使用</div>
        <div class="ref-opt">角色立绘</div>
        <div class="ref-opt">场景背景图</div>
        <div class="ref-opt">小说封面</div>
      </div>
    </div>
  </div>
</div>
<div class="generate-bar">
  <div class="cost-info"><span class="free">免费额度内</span> · 本月剩余 1 条</div>
  <button class="btn-gen" onclick="gen()">✨ 生成候选视频</button>
</div>
<div class="modal-overlay" id="resultModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">选择你喜欢的候选视频（共4个）</div>
    <div class="video-grid" id="videoGrid">
      <div class="video-card selected" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>候选1</div><div class="play">▶</div><div class="ck">✓</div></div>
      <div class="video-card" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>候选2</div><div class="play">▶</div><div class="ck">✓</div></div>
      <div class="video-card" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>候选3</div><div class="play">▶</div><div class="ck">✓</div></div>
      <div class="video-card" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>候选4</div><div class="play">▶</div><div class="ck">✓</div></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:12px">
      <button style="flex:1;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);cursor:pointer" onclick="regen()">🔄 换一批</button>
      <button style="flex:1;padding:12px;background:var(--ok);border:none;border-radius:12px;color:#fff;font-weight:600;cursor:pointer" onclick="confirm()">✅ 确认使用</button>
    </div>
  </div>
</div>
<script>
function sel(e){document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function stag(e){const p=e.parentElement;[...p.children].forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function dur(e){document.querySelectorAll('.dur-btn').forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function selV(e){document.querySelectorAll('.video-card').forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function aiHelp(){
  const c=document.getElementById('ai-cands');
  c.innerHTML='<div style="text-align:center;padding:20px;color:var(--xinyu);font-size:13px">AI正在编写分镜脚本...</div>';
  setTimeout(()=>{
    const d=[
      {n:'雨中回眸',d:'角色在雨中缓缓转身回眸，镜头从远景推至特写，雨滴在逆光中闪烁'},
      {n:'剑光一闪',d:'角色拔剑出鞘的瞬间，剑光映照瞳孔，镜头环绕360度，樱花飘落'},
      {n:'星空约定',d:'两人并肩仰望星空，流星划过，镜头缓慢上升，银河铺满画面'},
      {n:'废墟独行',d:'角色独自行走在废弃都市中，镜头跟随背影，远方夕阳余晖'}
    ];
    c.innerHTML=d.map((x,i)=>'<div class="candidate-item" onclick="useC(this,\''+x.d.replace(/'/g,"\\'")+'\')"><div class="ci">'+['🌧️','⚔️','🌌','🏚️'][i]+'</div><div class="cf"><div class="cn">'+x.n+'</div><div class="cd">'+x.d+'</div></div></div>').join('')+'<div style="text-align:center;margin-top:8px"><span style="font-size:12px;color:var(--xinyu);cursor:pointer" onclick="aiHelp()">🔄 换一批</span></div>';
  },1500);
}
function useC(e,d){document.querySelectorAll('.candidate-item').forEach(c=>c.classList.remove('selected'));e.classList.add('selected');document.getElementById('prompt').value=d}
function gen(){document.getElementById('resultModal').classList.add('show')}
function regen(){
  const g=document.getElementById('videoGrid');
  g.innerHTML='<div style="text-align:center;padding:40px;color:var(--xinyu);font-size:13px;grid-column:span 2">AI正在重新生成...</div>';
  setTimeout(()=>{g.innerHTML='<div class="video-card selected" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>新候选1</div><div class="play">▶</div><div class="ck">✓</div></div><div class="video-card" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>新候选2</div><div class="play">▶</div><div class="ck">✓</div></div><div class="video-card" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>新候选3</div><div class="play">▶</div><div class="ck">✓</div></div><div class="video-card" onclick="selV(this)"><div class="ph"><span class="gi">🎬</span>新候选4</div><div class="play">▶</div><div class="ck">✓</div></div>'},2000);
}
function confirm(){document.getElementById('resultModal').classList.remove('show');alert('视频已保存到你的灵境素材库！')}
</script>
<script src="js/creator-store.js"></script>
<script src="js/creator-ai.js"></script>
<script src="js/creator-pages.js"></script>
<script src="js/tabbar.js"></script>
</body>
</html>
