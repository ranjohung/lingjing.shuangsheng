<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>我的卡牌 · 灵境 · 双生</title>
<meta name="description" content="V20-M · 我的卡牌 · 命运卡牌收藏 · 稀有度 5 档 + 来源筛选 · 详情 / 分享 / 设为背景" />
<meta name="theme-color" content="#0d0b22" />
<link rel="stylesheet" href="css/shell-v64.css" />
<style>
.kc-page{padding-bottom:32px}
.kc-filter{display:flex;gap:6px;margin:14px var(--margin) 4px;flex-wrap:wrap}
.kc-chip{padding:6px 12px;border-radius:14px;font-size:11px;cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.kc-chip.on{background:rgba(108,92,231,.16);border-color:rgba(108,92,231,.45);color:#A29BFE}
.kc-sub-title{font-size:10px;color:var(--sub);margin:6px var(--margin) 8px}
.kc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 var(--margin)}
.kc-card{
  aspect-ratio:3/4.2;border-radius:12px;padding:10px 8px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);transition:transform .2s;overflow:hidden;
}
.kc-card:active{transform:scale(.96)}
.kc-card .emoji{font-size:30px}
.kc-card .nm{font-size:11px;font-weight:600;text-align:center;line-height:1.4}
.kc-card .rr{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:600}
.rr-普通{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.rr-稀有{background:rgba(110,198,255,.16);color:#6ec6ff}
.rr-史诗{background:rgba(168,91,224,.18);color:#c99bf0}
.rr-传说{background:rgba(232,199,90,.18);color:#e8c75a}
.rr-限定{background:rgba(233,69,96,.16);color:#f07b8f}
.kc-card.rare::after{content:'✦';position:absolute;top:6px;right:8px;font-size:10px;color:#e8c75a}
.kc-empty{margin:40px var(--margin);text-align:center;color:var(--sub);font-size:13px;line-height:2}
.kc-total{font-size:11px;color:var(--sub);margin:10px var(--margin) 0;text-align:right}
/* 卡牌详情弹窗 */
.kc-detail-mask{position:fixed;inset:0;background:rgba(10,10,26,.8);display:none;place-items:center;z-index:99;padding:24px}
.kc-detail-mask.show{display:grid}
.kc-detail{
  width:100%;max-width:300px;border-radius:18px;padding:26px 20px;text-align:center;
  background:linear-gradient(160deg,#1E1B3A,#2A1E4A);border:1px solid rgba(232,199,90,.3);
}
.kc-detail .big{font-size:64px;margin-bottom:10px}
.kc-detail h3{font:600 18px 'Noto Serif SC';color:#fff;margin:0 0 6px}
.kc-detail .sub{font-size:12px;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:16px}
.kc-detail .btns{display:flex;gap:8px}
.kc-detail .btns button{
  flex:1;padding:11px 0;border-radius:10px;font-size:13px;cursor:pointer;
  border:1px solid rgba(255,255,255,.14);background:none;color:rgba(255,255,255,.8);
}
.kc-detail .btns button.pri{border:0;background:linear-gradient(135deg,var(--xinyu),#9b5be0);color:#fff;font-weight:600}
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
</head>
<body>
<div id="app" class="kc-page">
  <header class="topbar">
    <a class="icon-btn" href="me.html" title="返回">‹</a>
    <div class="topbar-title"><span class="dot"></span>我的卡牌</div>
    <div class="topbar-acts"><span style="font-size:11px;color:var(--sub);align-self:center">命运卡牌收藏</span></div>
  </header>

  <main>
    <!-- 稀有度筛选（普通/稀有/史诗/传说/限定）+ 来源筛选（小说世界/角色）· 设计文档 §4.4 -->
    <div class="kc-filter" id="kc-rarity">
      <span class="kc-chip on" data-r="all">全部稀有度</span>
      <span class="kc-chip" data-r="普通">普通</span>
      <span class="kc-chip" data-r="稀有">稀有</span>
      <span class="kc-chip" data-r="史诗">史诗</span>
      <span class="kc-chip" data-r="传说">传说</span>
      <span class="kc-chip" data-r="限定">限定</span>
    </div>
    <div class="kc-filter" id="kc-src" style="margin-top:4px">
      <span class="kc-chip on" data-s="all">全部来源</span>
      <span class="kc-chip" data-s="world">小说世界</span>
      <span class="kc-chip" data-s="char">角色</span>
    </div>
    <div class="kc-sub-title" id="kc-count"></div>
    <div class="kc-grid" id="kc-grid"></div>
    <div class="kc-empty" id="kc-empty" style="display:none">没有符合筛选的卡牌<br/>推进剧情 / 提升亲密度可解锁更多命运卡</div>
    <div class="kc-total">已收集 8 / 32 张 · 图鉴完成度 25%</div>
  </main>
</div>

<div id="toast"></div>
<!-- 卡牌详情（分享 / 设为背景 · 设计文档 §4.4） -->
<div class="kc-detail-mask" id="kc-mask">
  <div class="kc-detail">
    <div class="big" id="kd-emoji">🌸</div>
    <h3 id="kd-name">限定卡牌 · 初见</h3>
    <div class="sub" id="kd-sub">稀有度 限定 · 来自《西游记》<br/>「与你初见的那个雨夜，命运的齿轮开始转动。」</div>
    <div class="btns">
      <button id="kd-share">📤 分享</button>
      <button id="kd-bg">🖼️ 设为背景</button>
      <button class="pri" id="kd-close">收下</button>
    </div>
  </div>
</div>
<script>
function showToast(kind, title, msg){
  var c = document.getElementById('toast');
  var t = document.createElement('div');
  t.className = 'toast-item ' + (kind || 'ok');
  t.innerHTML = '<span class="ti"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
/* 命运卡牌：稀有度 5 档 × 来源（小说世界/角色） */
var CARDS = [
  { id:'k1', emoji:'🌸', name:'初见', rarity:'限定', src:'world', from:'西游记', line:'与你初见的那个雨夜，命运的齿轮开始转动。' },
  { id:'k2', emoji:'⚔️', name:'并肩', rarity:'史诗', src:'world', from:'西游记', line:'背靠背穿过整条雨巷，谁也没有回头。' },
  { id:'k3', emoji:'🌙', name:'永夜灯', rarity:'传说', src:'world', from:'西游记', line:'城市熄灯之后，只剩你手中那盏火。' },
  { id:'k4', emoji:'🌊', name:'回声', rarity:'史诗', src:'world', from:'红楼梦', line:'有些话沉进海底，会在梦里浮上来。' },
  { id:'k5', emoji:'🏮', name:'除夕', rarity:'稀有', src:'char', from:'阿岁', line:'「今年陪我守岁的人是你，明年也是。」' },
  { id:'k6', emoji:'🖊️', name:'采访笔记', rarity:'稀有', src:'char', from:'孙悟空', line:'笔记本最后一页只写了你的名字。' },
  { id:'k7', emoji:'🗡️', name:'方天画戟', rarity:'传说', src:'world', from:'三国 · 灵境版', line:'兵器认主，山河易帜。' },
  { id:'k8', emoji:'🍵', name:'一盏清茶', rarity:'普通', src:'char', from:'苏晚', line:'茶凉了可以续，人走了会回来吗？' }
];
var curR = 'all', curS = 'all';
var RARITY_BG = {
  '普通': 'linear-gradient(160deg,#2A2A3E,#3A3A4E)',
  '稀有': 'linear-gradient(160deg,#1E3A5E,#2E5A8E)',
  '史诗': 'linear-gradient(160deg,#3A1E5E,#5A2E8E)',
  '传说': 'linear-gradient(160deg,#5E4A1E,#8E6E2E)',
  '限定': 'linear-gradient(160deg,#5E1E38,#8E2E4E)'
};

function render() {
  var list = CARDS.filter(function (k) {
    return (curR === 'all' || k.rarity === curR) && (curS === 'all' || k.src === curS);
  });
  var grid = document.getElementById('kc-grid');
  grid.innerHTML = '';
  document.getElementById('kc-empty').style.display = list.length ? 'none' : '';
  document.getElementById('kc-count').textContent = list.length ? ('共 ' + list.length + ' 张') : '';
  list.forEach(function (k) {
    var d = document.createElement('div');
    d.className = 'kc-card' + (k.rarity === '传说' || k.rarity === '限定' ? ' rare' : '');
    d.style.background = RARITY_BG[k.rarity];
    d.innerHTML =
      '<div class="emoji">' + k.emoji + '</div>' +
      '<div class="nm">' + k.name + '</div>' +
      '<span class="rr rr-' + k.rarity + '">' + k.rarity + '</span>';
    d.addEventListener('click', function () { openDetail(k); });
    grid.appendChild(d);
  });
}
var curCard = null;
function openDetail(k) {
  curCard = k;
  document.getElementById('kd-emoji').textContent = k.emoji;
  document.getElementById('kd-name').textContent = k.rarity + '卡牌 · ' + k.name;
  document.getElementById('kd-sub').innerHTML =
    '稀有度 ' + k.rarity + ' · 来自' + (k.src === 'world' ? '《' + k.from + '》' : k.from) + '<br/>「' + k.line + '」';
  document.getElementById('kc-mask').classList.add('show');
}
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('kc-rarity').addEventListener('click', function (ev) {
    var t = ev.target.closest('.kc-chip');
    if (!t) return;
    curR = t.dataset.r;
    this.querySelectorAll('.kc-chip').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    render();
  });
  document.getElementById('kc-src').addEventListener('click', function (ev) {
    var t = ev.target.closest('.kc-chip');
    if (!t) return;
    curS = t.dataset.s;
    this.querySelectorAll('.kc-chip').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    render();
  });
  document.getElementById('kd-close').addEventListener('click', function () { document.getElementById('kc-mask').classList.remove('show'); });
  document.getElementById('kc-mask').addEventListener('click', function (ev) { if (ev.target === this) this.classList.remove('show'); });
  document.getElementById('kd-share').addEventListener('click', function () {
    showToast('ok', '已生成分享图', (curCard ? curCard.rarity + '卡牌 · ' + curCard.name : '') + ' · 可保存到相册');
  });
  document.getElementById('kd-bg').addEventListener('click', function () {
    showToast('ok', '已设为个人主页背景', (curCard ? curCard.name : '') + ' · 返回「我的」查看');
    try { localStorage.setItem('lingjing_v52x_profile_bg', curCard ? curCard.id : ''); } catch (e) {}
  });
  render();
});
</script>
<script src="js/tabbar.js"></script>
</body>
</html>
