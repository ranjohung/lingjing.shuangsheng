<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>我的世界 · 灵境 · 双生</title>
<meta name="description" content="V20-M · 我的世界 · 正在游玩 / 已完成 · 进度 + 继续游玩" />
<meta name="theme-color" content="#0d0b22" />
<link rel="stylesheet" href="css/shell-v64.css" />
<style>
.wp-page{padding-bottom:32px}
.wp-sub{display:flex;gap:6px;margin:14px var(--margin) 12px}
.wp-chip{flex:1;padding:9px 0;text-align:center;font-size:13px;color:var(--sub);border-radius:10px;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.wp-chip.on{background:linear-gradient(135deg,#00B894,#4ECCA3);color:#fff;font-weight:600}
.wp-list{margin:0 var(--margin);display:flex;flex-direction:column;gap:10px}
.wp-item{display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit}
.wp-item .cov{width:56px;height:76px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:26px}
.wp-item .body{flex:1;min-width:0}
.wp-item .t{font-size:14px;font-weight:600}
.wp-item .s{font-size:11px;color:var(--sub);margin-top:4px}
.wp-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.wp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#00B894,#4ECCA3)}
.wp-fill.done{background:linear-gradient(90deg,var(--warn),var(--accent))}
.wp-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:4px}
.wp-play{
  flex-shrink:0;align-self:center;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:600;
  background:linear-gradient(135deg,#00B894,#4ECCA3);color:#fff;text-decoration:none;white-space:nowrap;
}
.wp-empty{margin:40px var(--margin);text-align:center;color:var(--sub);font-size:13px;line-height:2}
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
</head>
<body>
<div id="app" class="wp-page">
  <header class="topbar">
    <a class="icon-btn" href="me.html" title="返回">‹</a>
    <div class="topbar-title"><span class="dot"></span>我的世界</div>
    <div class="topbar-acts"><span style="font-size:11px;color:var(--sub);align-self:center">小说世界进度</span></div>
  </header>

  <main>
    <!-- 正在游玩 / 已完成（设计文档 §4.3） -->
    <div class="wp-sub" id="wp-sub">
      <div class="wp-chip on" data-st="playing">正在游玩</div>
      <div class="wp-chip" data-st="done">已完成</div>
    </div>
    <div class="wp-list" id="wp-list"></div>
    <div class="wp-empty" id="wp-empty" style="display:none">暂无记录<br/>去世界大厅选一本书，进入小说世界</div>
    <a href="library.html" style="display:block;margin:14px var(--margin) 0;padding:13px 0;border-radius:12px;text-align:center;border:1px dashed rgba(0,184,148,.5);color:#4ECCA3;font-size:14px;font-weight:600;text-decoration:none">📖 去世界大厅选书</a>
  </main>
</div>

<div id="toast"></div>
<script>
function showToast(kind, title, msg){
  var c = document.getElementById('toast');
  var t = document.createElement('div');
  t.className = 'toast-item ' + (kind || 'ok');
  t.innerHTML = '<span class="ti"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
/* 世界进度：封面 / 书名 / 进度百分比 / 最后游玩时间（设计文档 §4.3） */
var WORLDS = [
  { st: 'playing', emoji: '🌙', bg: 'linear-gradient(160deg,#2E3A6E,#4A3A8C)', title: '西游记', pct: 42, last: '今天 05:12', chapter: '第 3 章 · 雨夜追踪', href: 'plot-runner.html?novel=xiyouji' },
  { st: 'playing', emoji: '🏛️', bg: 'linear-gradient(160deg,#6E5A2E,#8C7A3A)', title: '三国演义 · 灵境版', pct: 17, last: '昨天 21:40', chapter: '第 1 卷 · 黄巾之乱', href: 'sanguo-world.html' },
  { st: 'done', emoji: '🌸', bg: 'linear-gradient(160deg,#1F5C4D,#2E8B6E)', title: '红楼梦', pct: 100, last: '09-10 22:05', chapter: '已通关 · 双生角色已带出', href: 'plot-detail.html?novel=hongloumeng' }
];
var curSt = 'playing';

function render() {
  var list = WORLDS.filter(function (w) { return w.st === curSt; });
  var box = document.getElementById('wp-list');
  box.innerHTML = '';
  document.getElementById('wp-empty').style.display = list.length ? 'none' : '';
  list.forEach(function (w) {
    var a = document.createElement('a');
    a.className = 'wp-item'; a.href = w.href;
    a.innerHTML =
      '<div class="cov" style="background:' + w.bg + '">' + w.emoji + '</div>' +
      '<div class="body">' +
        '<div class="t">' + w.title + '</div>' +
        '<div class="s">' + w.chapter + ' · 最后游玩 ' + w.last + '</div>' +
        '<div class="wp-bar"><div class="wp-fill' + (w.st === 'done' ? ' done' : '') + '" style="width:' + w.pct + '%"></div></div>' +
        '<div class="wp-meta"><span>进度 ' + w.pct + '%</span><span>' + (w.st === 'done' ? '已完成' : '游玩中') + '</span></div>' +
      '</div>' +
      '<span class="wp-play">' + (w.st === 'done' ? '🔄 重玩' : '▶ 继续游玩') + '</span>';
    box.appendChild(a);
  });
}
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('wp-sub').addEventListener('click', function (ev) {
    var t = ev.target.closest('.wp-chip');
    if (!t) return;
    curSt = t.dataset.st;
    this.querySelectorAll('.wp-chip').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    render();
  });
  render();
});
</script>
<script src="js/tabbar.js"></script>
</body>
</html>
