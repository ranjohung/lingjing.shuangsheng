<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>切换场景 · 灵境 · 双生</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; padding: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #1a1530, #050608); color: #e8ecf4; font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
* { box-sizing: border-box; }

.back-arrow { position: fixed; top: 14px; left: 14px; z-index: 60;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px 8px 12px; border-radius: 999px;
  background: rgba(20,18,46,.75); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.15); color: #fff;
  font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: none;
  transition: all .2s;
}
.back-arrow:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); transform: translateX(-2px); }
.back-arrow .icon { font-size: 18px; line-height: 1; font-weight: 700; }

.page { max-width: 1180px; margin: 0 auto; padding: 70px 24px 50px; }
.head { text-align: center; margin-bottom: 22px; }
.head h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; background: linear-gradient(120deg, #c9a8ff, #5b9cd8); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: .15em; }
.head p { margin: 0; font-size: 12px; color: #9faec2; letter-spacing: .2em; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.card {
 position: relative; aspect-ratio: 16/10; border-radius: 14px; overflow: hidden;
 cursor: pointer; border: 1px solid rgba(255,255,255,.10);
 transition: all .25s; background: linear-gradient(135deg, #2a1f4e, #0b0f1c);
}
.card:hover { transform: translateY(-4px); border-color: rgba(142,91,216,.5); box-shadow: 0 16px 48px rgba(0,0,0,.4); }
.card.current { border-color: rgba(255,209,128,.5); box-shadow: 0 0 0 1px rgba(255,209,128,.5); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.55); transition: filter .25s; }
.card:hover img { filter: brightness(.75); }
.card .info { position: absolute; inset: 0; padding: 14px 16px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
.card .tag { font-size: 10px; color: #c9a8ff; letter-spacing: .25em; margin-bottom: 6px; }
.card .title { font-size: 17px; font-weight: 600; }
.card .sub { font-size: 11px; opacity: .8; line-height: 1.6; margin-top: 4px; }
.card .current-badge { position: absolute; top: 12px; right: 12px; font-size: 10px; padding: 3px 10px; border-radius: 999px; background: linear-gradient(120deg, rgba(255,209,128,.4), rgba(216,91,142,.4)); border: 1px solid rgba(255,209,128,.5); color: #ffd180; letter-spacing: .15em; }

.actions { text-align: center; margin-top: 28px; }
.actions .btn { padding: 10px 22px; border-radius: 999px; background: linear-gradient(120deg, rgba(216,91,142,.25), rgba(142,91,216,.25)); border: 1px solid rgba(216,91,142,.5); color: #fff; cursor: pointer; font-size: 13px; font-family: inherit; text-decoration: none; display: inline-block; transition: all .15s; }
.actions .btn:hover { filter: brightness(1.18); }

@media (max-width: 768px) {
  .page { padding: 60px 16px 30px; }
  .head h1 { font-size: 20px; }
  .grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .card .title { font-size: 14px; }
}
</style>
</head>
<body>
<a class="back-arrow" href="library.html"><span class="icon">◀</span><span>退出游戏</span></a>

<div class="page">
  <div class="head">
    <h1>灵 境 · 双 生</h1>
    <p>SCENE PICKER · 选择一个新场景</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <a class="btn" href="library.html">↩ 返回小说世界</a>
  </div>
</div>

<script>
// 9 个场景（与 game-3d.html 完全对齐）
const SCENES = [
  { key: 'pavilion',   icon: '⌖', cn: '雨夜凉亭', genre: '古风',     desc: '长夜城·凉亭·雨声连绵',     bg: 'pavilion_night' },
  { key: 'classroom',  icon: '✎', cn: '教室走廊', genre: '校园',     desc: '春风中学·走廊·粉笔轻响',   bg: 'classroom_sunny' },
  { key: 'neon',       icon: '⚡', cn: '霓虹街',  genre: '赛博',     desc: '新东京·霓虹·雨夜',         bg: 'neon_street' },
  { key: 'livingroom', icon: '✦', cn: '客厅暖灯', genre: '现代',     desc: '公寓·沙发·窗外雨',         bg: 'livingroom_warm' },
  { key: 'xianxia',    icon: '☁', cn: '仙山之巅', genre: '仙侠',     desc: '云海·仙山·剑光万里',       bg: 'xianxia_peak' },
  { key: 'palace',     icon: '🏮', cn: '大明宫宴', genre: '穿越',     desc: '大明宫·宴席·宫灯如昼',     bg: 'palace_tang' },
  { key: 'study',      icon: '🕯', cn: '民国书房', genre: '悬疑',     desc: '上海滩·书房·旧纸',         bg: 'study_republic' },
  { key: 'forest',     icon: '🍃', cn: '精灵森林', genre: '奇幻',     desc: '月森林·精灵·星辉',         bg: 'elf_forest' },
  { key: 'starship',   icon: '🚀', cn: '星舰舰桥', genre: '科幻',     desc: '银心号·舰桥·星海',         bg: 'starship_bridge' }
];

const grid = document.getElementById('grid');
const current = sessionStorage.getItem('game3d.currentScene') || '';

grid.innerHTML = SCENES.map(s => `
  <div class="card ${s.key === current ? 'current' : ''}" data-key="${s.key}">
    <img src="scenes/${s.bg}.png" alt="${s.cn}" loading="lazy" onerror="this.style.display='none'" />
    <div class="info">
      <div class="tag">${s.icon} ${s.genre.toUpperCase()}</div>
      <div class="title">${s.cn}</div>
      <div class="sub">${s.desc}</div>
    </div>
    ${s.key === current ? '<div class="current-badge">◉ 当前</div>' : ''}
  </div>
`).join('');

grid.querySelectorAll('.card').forEach(card => {
  card.onclick = () => {
    const key = card.dataset.key;
    sessionStorage.setItem('game3d.currentScene', key);
    // 写一个 intent 让 game-3d.html 知道要切场景
    sessionStorage.setItem('game3d.loadScene', key);
    location.href = 'game-3d.html';
  };
});
</script>
</body>
</html>
