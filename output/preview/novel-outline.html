<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大纲与章节规划 · 创作者中心 · 灵境 · 双生</title>
<meta name="description" content="V21 大纲编辑（AI 候选 + 确认锁定）与章节规划（依大纲自动生成）" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/design-system.css" />
<style>
  .ol-wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 56px; }
  /* 步骤条 */
  .ol-steps { display: flex; align-items: center; gap: 4px; padding: 14px 0 6px; overflow-x: auto; }
  .ol-step { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--r-full);
    border: 1px solid var(--border-default); background: var(--bg-elevated); font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
  .ol-step.active { border-color: rgba(139,124,246,.55); background: rgba(139,124,246,.14); color: var(--text-primary); font-weight: 600; }
  .ol-step.done { border-color: rgba(78,204,163,.45); color: var(--brand-green); }
  .ol-step-arrow { color: var(--text-muted); font-size: 12px; }
  /* 简报摘要 */
  .ol-brief { padding: 14px 16px; border-radius: var(--r-md); background: var(--bg-elevated); border: 1px solid var(--border-subtle); margin-bottom: 16px; }
  .ol-brief-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .ol-brief-title { font-size: 13px; font-weight: 600; }
  .ol-brief-tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .ol-tag { padding: 2px 10px; border-radius: var(--r-full); background: var(--bg-muted); border: 1px solid var(--border-subtle); }
  /* 字段 */
  .ol-field { padding: 16px; border-radius: var(--r-lg); background: var(--bg-elevated); border: 1px solid var(--border-default); margin-bottom: 12px; }
  .ol-field-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ol-field-label { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .ol-field-label .no { width: 18px; height: 18px; border-radius: 50%; background: rgba(139,124,246,.16); color: var(--brand-violet);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .ol-field-label .lock { font-size: 11px; color: var(--brand-gold); }
  .ol-hint { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
  .ol-field textarea { width: 100%; min-height: 72px; resize: vertical; }
  .ol-field.locked textarea { background: var(--bg-muted); color: var(--text-secondary); opacity: .85; }
  /* 章节 */
  .plan-card { padding: 14px 16px; border-radius: var(--r-lg); background: var(--bg-elevated); border: 1px solid var(--border-default); margin-bottom: 12px; }
  .plan-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .plan-no { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
  .plan-acts { display: flex; gap: 6px; }
  .plan-mini { width: 30px; height: 30px; border-radius: var(--r-md); border: 1px solid var(--border-default); background: var(--bg-muted);
    color: var(--text-secondary); cursor: pointer; font-size: 13px; transition: all var(--dur-fast); }
  .plan-mini:hover { border-color: var(--brand-violet); color: var(--text-primary); }
  .plan-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .plan-item label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .plan-item input, .plan-item textarea { width: 100%; font-size: 12.5px; }
  .plan-item textarea { min-height: 44px; resize: vertical; }
  .plan-card.locked input, .plan-card.locked textarea { background: var(--bg-muted); color: var(--text-secondary); }
  .ol-empty { text-align: center; padding: 36px 20px; border-radius: var(--r-xl); background: var(--bg-elevated); border: 1px dashed var(--border-strong); margin-bottom: 16px; }
  .ol-empty .t { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .ol-empty .s { font-size: 12.5px; color: var(--text-tertiary); margin-bottom: 14px; }
  .ol-sec-title { font-size: 15px; font-weight: 600; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .ol-sec-title::before { content: ''; width: 3px; height: 15px; background: var(--brand-violet); border-radius: 2px; }
  /* 弹窗 */
  .ol-modal { position: fixed; inset: 0; background: rgba(8,7,26,.7); backdrop-filter: blur(8px); z-index: 80; display: grid; place-items: center; padding: 16px; }
  .ol-modal-card { width: 100%; max-width: 560px; background: var(--bg-overlay); border: 1px solid var(--border-default); border-radius: var(--r-xl); overflow: hidden; }
  .ol-modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
  .ol-modal-body { padding: 20px 22px; max-height: 60vh; overflow-y: auto; }
  .ol-modal-foot { padding: 14px 22px; border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .ol-opt { padding: 13px 16px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--r-md); cursor: pointer; margin-bottom: 8px; transition: all var(--dur-fast); }
  .ol-opt:hover { border-color: var(--brand-violet); transform: translateX(4px); }
  .ol-opt-tag { font-size: 10px; color: var(--text-tertiary); background: var(--bg-muted); padding: 2px 8px; border-radius: var(--r-full); margin-right: 8px; }
  .ol-opt-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; display: inline; }
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
</head>
<body>

<header class="ds-page-header">
  <div class="ds-page-header-inner">
    <a href="creator-center.html" class="ds-back"><span class="arrow">←</span> 返回创作者中心</a>
    <nav class="ds-breadcrumb">
      <a href="novel-ai-helper.html">小说辅助模拟器</a><span class="sep">/</span>
      <span class="current">大纲与章节规划</span>
    </nav>
    <div class="ds-page-header-right">
      <div class="ds-user-chip"><div class="ds-user-avatar">L</div><span>灵境作者</span></div>
    </div>
  </div>
</header>

<div class="ol-wrap">
  <!-- 步骤条 -->
  <div class="ol-steps" id="ol-steps">
    <span class="ol-step" id="step-1">① 创作简报</span><span class="ol-step-arrow">→</span>
    <span class="ol-step" id="step-2">② 大纲编辑</span><span class="ol-step-arrow">→</span>
    <span class="ol-step" id="step-3">③ 章节规划</span><span class="ol-step-arrow">→</span>
    <span class="ol-step" id="step-4">④ 逐章创作</span>
  </div>

  <!-- 简报摘要 -->
  <div id="brief-slot"></div>

  <!-- 空态（无简报） -->
  <div class="ol-empty" id="empty-state" style="display:none;">
    <div class="t">还没有创作简报</div>
    <div class="s">先完成 8 问引导（3 个必答），AI 才能帮你立住故事骨架。</div>
    <a class="ds-btn ds-btn-primary" id="btn-goto-guide" href="novel-ai-helper.html">🌱 先去完成创作引导</a>
    <button class="ds-btn ds-btn-secondary" id="btn-import-expert" style="display:none; margin-left:8px;">📥 从专家模式 28 字段导入</button>
  </div>

  <!-- 大纲编辑 -->
  <div id="outline-section" style="display:none;">
    <div class="ol-sec-title">大纲编辑 <span id="ol-lock-badge" style="display:none;font-size:11px;color:var(--brand-gold);">🔒 已锁定</span></div>
    <div id="ol-fields"></div>
    <div style="display:flex; justify-content:space-between; gap:8px; margin-top:14px;">
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="btn-unlock-outline" style="display:none;">🔓 解锁修改</button>
      <span style="flex:1;"></span>
      <button class="ds-btn ds-btn-primary" id="btn-confirm-outline">✅ 确认大纲并锁定</button>
    </div>
  </div>

  <!-- 章节规划 -->
  <div id="plans-section" style="display:none;">
    <div class="ol-sec-title">章节规划 <span id="plans-lock-badge" style="display:none;font-size:11px;color:var(--brand-gold);">🔒 已锁定</span></div>
    <p style="font-size:12px;color:var(--text-tertiary);margin-bottom:12px;">AI 依据<b>已确认的大纲</b> + 创作简报生成章节列表；每章的「章节目标」是后续生成的硬约束。可调整后锁定。</p>
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
      <button class="ds-btn ds-btn-secondary ds-btn-sm" id="btn-gen-plans">🤖 根据大纲生成章节规划</button>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="btn-add-plan">＋ 新增章节</button>
      <span style="flex:1;"></span>
      <button class="ds-btn ds-btn-primary ds-btn-sm" id="btn-lock-plans">🔒 锁定章节规划</button>
    </div>
    <div id="plans-list"></div>
    <div style="display:flex; justify-content:flex-end; margin-top:14px;">
      <a class="ds-btn ds-btn-primary" id="btn-goto-writer" href="novel-writer.html?chapter=1" style="display:none;">进入逐章创作台 →</a>
    </div>
  </div>
</div>

<script src="js/novel-sim-store.js"></script>
<script src="js/novel-sim-ai.js"></script>
<script>
  var AI = window.NovelSimAI, Store = window.NovelSimStore;
  var proj = Store.load();

  var FIELDS = [
    { key: 'theme', no: 1, label: '故事主题', hint: '这个故事最终想表达什么（成长 / 救赎 / 真相 / 权力与代价…）', kind: 'outline_theme' },
    { key: 'background', no: 2, label: '世界背景', hint: '故事发生在什么样的世界 / 时代 / 环境', kind: 'outline_background' },
    { key: 'main_plot', no: 3, label: '主线梗概', hint: '主线一句话 + 起承路径，AI 生成章节规划时以此为纲', kind: 'outline_plot' },
    { key: 'turning_points', no: 4, label: '关键转折点', hint: '每行一个转折点（建议 3-5 个），选中 AI 候选会追加一行', kind: 'outline_turning', lines: true },
    { key: 'ending_direction', no: 5, label: '结局方向', hint: '走向哪一种结局（治愈 / 余味 / 开放 / 庄重 / 回环…）', kind: 'outline_ending' }
  ];

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /* ---------- 渲染 ---------- */
  function renderSteps() {
    var outlineLocked = proj.outline.status === 'locked';
    var plansLocked = proj.plans_status === 'locked';
    el('step-1').className = 'ol-step done';
    el('step-2').className = 'ol-step' + (outlineLocked ? ' done' : ' active');
    el('step-3').className = 'ol-step' + (outlineLocked ? (plansLocked ? ' done' : ' active') : '');
    el('step-4').className = 'ol-step';
  }

  function renderBrief() {
    var b = proj.brief;
    if (!b) {
      el('empty-state').style.display = '';
      // 专家模式导入：任一 lingjing_v514_novel_outline_v_* 有 logline 即可
      var imported = null;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('lingjing_v514_novel_outline_v_') === 0) {
            var v = JSON.parse(localStorage.getItem(k) || '{}');
            if (v.logline || v.main_goal) { imported = v; break; }
          }
        }
      } catch (e) {}
      if (imported) {
        el('btn-import-expert').style.display = '';
        el('btn-import-expert').onclick = function () { importExpert(imported); };
      }
      return;
    }
    var p = b.protagonist || {}, c = b.conflict || {}, d = b.deep || {};
    el('brief-slot').innerHTML =
      '<div class="ol-brief"><div class="ol-brief-head"><span class="ol-brief-title">📋 创作简报</span>' +
      '<a href="novel-ai-helper.html" style="font-size:12px;color:var(--brand-violet);text-decoration:none;">重新填写问卷</a></div>' +
      '<div class="ol-brief-tags">' +
      (b.genre ? '<span class="ol-tag">题材 · ' + esc(b.genre) + '</span>' : '') +
      (b.idea ? '<span class="ol-tag">概要 · ' + esc(b.idea.slice(0, 24)) + (b.idea.length > 24 ? '…' : '') + '</span>' : '') +
      (p.type ? '<span class="ol-tag">' + esc(p.type) + '</span>' : '') +
      (p.job ? '<span class="ol-tag">主角 · ' + esc(p.job) + '</span>' : '') +
      (p.traits ? '<span class="ol-tag">' + esc(p.traits) + '</span>' : '') +
      (c.type ? '<span class="ol-tag">冲突 · ' + esc(c.type) + '</span>' : '') +
      (c.drive ? '<span class="ol-tag">驱动 · ' + esc(c.drive) + '</span>' : '') +
      (d.tone ? '<span class="ol-tag">' + esc(d.tone) + '</span>' : '') +
      (d.length ? '<span class="ol-tag">' + esc(d.length) + '</span>' : '') +
      '</div></div>';
  }

  function importExpert(v) {
    var b = {
      genre: (v.genre || v.book_genre || '').slice(0, 12) || '都市现实',
      idea: v.logline || v.main_goal || '',
      protagonist: { type: '单主角', job: (v.char1_name ? '主角 ' + v.char1_name : '未指定'), traits: (v.char1_personality || '').slice(0, 20) || '' },
      conflict: { type: (v.core_conflict || '').slice(0, 8) || '追寻真相', drive: '查明真相' },
      deep: { world: (v.world_type || '') + (v.era ? ' · ' + v.era : ''), cast: v.char2_name || '', relations: '', length: '', tone: v.tone || '' },
      fromExpert: true
    };
    Store.setBrief(b);
    showToast('已从专家模式导入创作简报', 'success');
    setTimeout(function () { location.reload(); }, 500);
  }

  function renderOutlineFields() {
    var locked = proj.outline.status === 'locked';
    el('outline-section').style.display = '';
    el('ol-lock-badge').style.display = locked ? '' : 'none';
    el('btn-confirm-outline').style.display = locked ? 'none' : '';
    el('btn-unlock-outline').style.display = locked ? '' : 'none';
    el('ol-fields').innerHTML = FIELDS.map(function (f) {
      var val = proj.outline[f.key] || '';
      return '<div class="ol-field' + (locked ? ' locked' : '') + '">' +
        '<div class="ol-field-head"><span class="ol-field-label"><span class="no">' + f.no + '</span>' + f.label +
        (locked ? '<span class="lock">🔒</span>' : '') + '</span>' +
        (locked ? '' : '<button class="aih-ai-btn ol-ai-btn" data-kind="' + f.kind + '" data-key="' + f.key + '">🤖 AI 给几个选项</button>') + '</div>' +
        '<div class="ol-hint">' + f.hint + '</div>' +
        '<textarea id="ol-' + f.key + '" rows="' + (f.lines ? 4 : 2) + '"' + (locked ? ' readonly' : '') + ' oninput="outlineInput(\'' + f.key + '\', this.value)">' + esc(val) + '</textarea>' +
        '</div>';
    }).join('');
    document.querySelectorAll('.ol-ai-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { openFieldAI(btn.dataset.kind, btn.dataset.key); });
    });
  }

  function outlineInput(key, val) {
    proj.outline[key] = val;
    proj.outline.status = 'confirmed';
    Store.save(proj);
  }

  /* ---------- AI 候选弹窗 ---------- */
  function openFieldAI(kind, key) {
    var res = AI.gen(kind, { brief: proj.brief, outline: proj.outline });
    var modal = document.createElement('div');
    modal.className = 'ol-modal';
    modal.innerHTML =
      '<div class="ol-modal-card"><div class="ol-modal-head"><div style="font-weight:600;font-size:15px;">🤖 AI 给几个选项</div>' +
      '<button class="ds-modal-close" onclick="this.closest(\'.ol-modal\').remove()">✕</button></div>' +
      '<div class="ol-modal-body" id="olc-body"></div>' +
      '<div class="ol-modal-foot"><span style="font-size:11px;color:var(--text-tertiary);margin-right:auto;">' + (res.context || '') + '</span>' +
      '<button class="ds-btn ds-btn-ghost ds-btn-sm" onclick="this.closest(\'.ol-modal\').remove()">关闭</button>' +
      '<button class="ds-btn ds-btn-secondary ds-btn-sm" id="olc-refresh">🔄 换一批</button>' +
      '<button class="ds-btn ds-btn-gold ds-btn-sm" id="olc-mysay">✏️ 我来说</button></div></div>';
    document.body.appendChild(modal);
    function draw() {
      el('olc-body') && (modal.querySelector('#olc-body').innerHTML = res.candidates.map(function (c, i) {
        return '<div class="ol-opt" data-i="' + i + '"><span class="ol-opt-tag">' + c.style + '</span><span class="ol-opt-text">' + esc(c.text) + '</span></div>';
      }).join('') + '<textarea class="ds-textarea" id="olc-mysay-input" rows="3" style="display:none;margin-top:8px;" placeholder="按你的想法写，采纳后填入字段"></textarea>' +
      '<button class="ds-btn ds-btn-primary ds-btn-sm" id="olc-mysay-ok" style="display:none;margin-top:8px;">采纳我的说法</button>');
      modal.querySelectorAll('.ol-opt').forEach(function (op) {
        op.addEventListener('click', function () {
          var c = res.candidates[Number(op.dataset.i)];
          applyPick(key, c.text, kind);
          modal.remove();
        });
      });
      var ok = modal.querySelector('#olc-mysay-ok');
      if (ok) ok.addEventListener('click', function () {
        var t = modal.querySelector('#olc-mysay-input').value;
        if (!t.trim()) { showToast('先写点想法', 'error'); return; }
        applyPick(key, t.trim(), kind);
        modal.remove();
      });
    }
    function applyPick(key, text, kind) {
      var ta = el('ol-' + key);
      var f = FIELDS.filter(function (x) { return x.key === key; })[0];
      if (f && f.lines && ta.value.trim()) {
        ta.value = ta.value.replace(/\s+$/, '') + '\n' + text;
      } else {
        ta.value = text;
      }
      outlineInput(key, ta.value);
      Store.addAiLog(kind + '_pick', res.context, res.candidates.length, null);
      showToast('已采纳候选', 'success');
    }
    draw();
    modal.querySelector('#olc-refresh').addEventListener('click', function () {
      res = AI.gen(kind, { brief: proj.brief, outline: proj.outline });
      draw();
      modal.querySelector('.ol-modal-foot span').textContent = res.context || '';
      showToast('已换一批', 'info');
    });
    modal.querySelector('#olc-mysay').addEventListener('click', function () {
      var i = modal.querySelector('#olc-mysay-input'), o = modal.querySelector('#olc-mysay-ok');
      if (i) { i.style.display = ''; o.style.display = ''; i.focus(); }
    });
    modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
  }

  /* ---------- 大纲确认 / 解锁 ---------- */
  function confirmDialog(title, body, okText, onOk) {
    var modal = document.createElement('div');
    modal.className = 'ol-modal';
    modal.innerHTML = '<div class="ol-modal-card" style="max-width:400px;"><div class="ol-modal-head"><div style="font-weight:600;">' + title + '</div>' +
      '<button class="ds-modal-close" onclick="this.closest(\'.ol-modal\').remove()">✕</button></div>' +
      '<div class="ol-modal-body" style="font-size:13px;color:var(--text-secondary);line-height:1.7;">' + body + '</div>' +
      '<div class="ol-modal-foot"><button class="ds-btn ds-btn-ghost ds-btn-sm" onclick="this.closest(\'.ol-modal\').remove()">取消</button>' +
      '<button class="ds-btn ds-btn-primary ds-btn-sm" id="olc-ok">' + okText + '</button></div></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
    modal.querySelector('#olc-ok').addEventListener('click', function () { modal.remove(); onOk(); });
  }

  function missingFields() {
    return FIELDS.filter(function (f) { return !(proj.outline[f.key] || '').trim(); });
  }

  el('btn-confirm-outline') && el('btn-confirm-outline').addEventListener('click', function () {
    var miss = missingFields();
    if (miss.length) {
      showToast('还有 ' + miss.length + ' 项未填：' + miss.map(function (f) { return f.label; }).join('、'), 'error');
      return;
    }
    confirmDialog('确认大纲？', '确认后大纲进入 <b>🔒 锁定态</b>：所有字段只读，后续章节生成将严格围绕此大纲展开。<br><br>如需修改可随时「解锁修改」（需重新确认）。', '✅ 确认并锁定', function () {
      Store.confirmOutline();
      proj = Store.load();
      renderAll();
      showToast('大纲已锁定，可进行章节规划', 'success');
    });
  });

  el('btn-unlock-outline') && el('btn-unlock-outline').addEventListener('click', function () {
    confirmDialog('解锁大纲修改？', '解锁后章节规划也会回到<b>草稿态</b>，修改大纲后需重新确认并重新生成/锁定章节规划。', '🔓 解锁', function () {
      Store.unlockOutline();
      proj = Store.load();
      renderAll();
      showToast('大纲已解锁（草稿态）', 'info');
    });
  });

  /* ---------- 章节规划 ---------- */
  function collectPlans() {
    var list = [];
    document.querySelectorAll('.plan-card').forEach(function (card, i) {
      list.push({
        no: i + 1,
        goal: card.querySelector('.plan-goal').value,
        conflict: card.querySelector('.plan-conflict').value,
        characters: card.querySelector('.plan-chars').value.split(/[，,、\s]+/).filter(Boolean),
        events: card.querySelector('.plan-events').value,
        prev: card.querySelector('.plan-prev').value,
        next: card.querySelector('.plan-next').value,
        place: (proj.chapter_plans[i] && proj.chapter_plans[i].place) || '未指定',
        status: (proj.chapter_plans[i] && proj.chapter_plans[i].status) || 'planned'
      });
    });
    return list;
  }

  function planCardHTML(p, i, locked) {
    return '<div class="plan-card' + (locked ? ' locked' : '') + '" data-i="' + i + '">' +
      '<div class="plan-head"><span class="plan-no">第 ' + (i + 1) + ' 章</span>' +
      '<div class="plan-acts">' +
      (locked ? '' :
        '<button class="plan-mini" data-act="up" data-i="' + i + '" title="上移">↑</button>' +
        '<button class="plan-mini" data-act="down" data-i="' + i + '" title="下移">↓</button>' +
        '<button class="plan-mini" data-act="replan" data-i="' + i + '" title="AI 换个思路">🎲</button>' +
        '<button class="plan-mini" data-act="del" data-i="' + i + '" title="删除">✕</button>') +
      '</div></div>' +
      '<div class="plan-grid">' +
      '<div class="plan-item"><label>章节目标（生成时的硬约束）</label><textarea class="plan-goal" ' + (locked ? 'readonly' : '') + '>' + esc(p.goal) + '</textarea></div>' +
      '<div class="plan-item"><label>主要冲突</label><input class="plan-conflict" ' + (locked ? 'readonly' : '') + ' value="' + esc(p.conflict) + '" /></div>' +
      '<div class="plan-item"><label>出场人物（顿号分隔）</label><input class="plan-chars" ' + (locked ? 'readonly' : '') + ' value="' + esc((p.characters || []).join('、')) + '" /></div>' +
      '<div class="plan-item"><label>关键事件</label><textarea class="plan-events" ' + (locked ? 'readonly' : '') + '>' + esc(p.events) + '</textarea></div>' +
      '<div class="plan-item"><label>承接上章</label><input class="plan-prev" ' + (locked ? 'readonly' : '') + ' value="' + esc(p.prev) + '" /></div>' +
      '<div class="plan-item"><label>引向下章</label><input class="plan-next" ' + (locked ? 'readonly' : '') + ' value="' + esc(p.next) + '" /></div>' +
      '</div></div>';
  }

  function renderPlans() {
    var outlineLocked = proj.outline.status === 'locked';
    var plansLocked = proj.plans_status === 'locked';
    el('plans-section').style.display = outlineLocked ? '' : 'none';
    if (!outlineLocked) return;
    el('plans-lock-badge').style.display = plansLocked ? '' : 'none';
    el('btn-gen-plans').style.display = (plansLocked || proj.chapter_plans.length) ? 'none' : '';
    el('btn-add-plan').style.display = plansLocked ? 'none' : '';
    el('btn-lock-plans').style.display = plansLocked ? 'none' : '';
    el('btn-goto-writer').style.display = plansLocked ? '' : 'none';
    el('plans-list').innerHTML = proj.chapter_plans.map(function (p, i) { return planCardHTML(p, i, plansLocked); }).join('');
    if (!plansLocked) bindPlanActs();
  }

  function bindPlanActs() {
    document.querySelectorAll('.plan-mini').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = Number(b.dataset.i), act = b.dataset.act;
        var list = collectPlans();
        if (act === 'up' && i > 0) { var t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; }
        else if (act === 'down' && i < list.length - 1) { var t2 = list[i + 1]; list[i + 1] = list[i]; list[i] = t2; }
        else if (act === 'del') { list.splice(i, 1); }
        else if (act === 'replan') {
          var np = AI.replanChapter(list[i], proj.brief);
          list[i] = Object.assign({}, list[i], { goal: np.goal });
          showToast('已按大纲换个思路', 'info');
        }
        list.forEach(function (p, k) { p.no = k + 1; });
        Store.setPlans(list);
        proj = Store.load();
        renderPlans();
      });
    });
    document.querySelectorAll('.plan-card input, .plan-card textarea').forEach(function (inp) {
      inp.addEventListener('change', function () {
        Store.setPlans(collectPlans());
        proj = Store.load();
      });
    });
  }

  el('btn-gen-plans') && el('btn-gen-plans').addEventListener('click', function () {
    var plans = AI.chapterPlans(proj.brief, proj.outline);
    Store.setPlans(plans);
    proj = Store.load();
    renderPlans();
    showToast('已生成 ' + plans.length + ' 章规划（依据已确认大纲）', 'success');
  });

  el('btn-add-plan') && el('btn-add-plan').addEventListener('click', function () {
    var list = collectPlans();
    list.push({ no: list.length + 1, goal: '（填写本章目标）', conflict: (proj.brief && proj.brief.conflict.type) || '', characters: ['主角'], events: '', prev: '承接第 ' + list.length + ' 章', next: '引向第 ' + (list.length + 2) + ' 章', place: '未指定', status: 'planned' });
    Store.setPlans(list);
    proj = Store.load();
    renderPlans();
  });

  el('btn-lock-plans') && el('btn-lock-plans').addEventListener('click', function () {
    var list = collectPlans();
    if (!list.length) { showToast('先生成或新增章节', 'error'); return; }
    Store.setPlans(list);
    confirmDialog('锁定章节规划？', '锁定后每章的「章节目标 / 冲突 / 出场人物」将成为逐章创作的<b>硬约束</b>。可在创作台中随时回到本页解锁。', '🔒 锁定并进入创作', function () {
      Store.lockPlans();
      proj = Store.load();
      renderAll();
      showToast('章节规划已锁定', 'success');
    });
  });

  /* ---------- init ---------- */
  function renderAll() {
    renderSteps();
    renderBrief();
    var hasBrief = !!proj.brief;
    el('outline-section').style.display = hasBrief ? '' : 'none';
    if (hasBrief) { renderOutlineFields(); renderPlans(); }
  }
  renderAll();

  function showToast(text, type) {
    type = type || 'info';
    var container = document.querySelector('.ds-toast-container');
    if (!container) { container = document.createElement('div'); container.className = 'ds-toast-container'; document.body.appendChild(container); }
    var icon = { success: '✓', error: '✕', info: 'ⓘ' }[type];
    var toast = document.createElement('div');
    toast.className = 'ds-toast ' + type;
    toast.innerHTML = '<div class="ds-toast-icon">' + icon + '</div><div class="ds-toast-body"><div class="ds-toast-desc">' + text + '</div></div>';
    container.appendChild(toast);
    setTimeout(function () { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; toast.style.transition = 'all 240ms'; setTimeout(function () { toast.remove(); }, 240); }, 2400);
  }
</script>

</body>
</html>
