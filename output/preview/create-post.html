<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>创建动态 · 灵境</title>
<link rel="stylesheet" href="css/shell-v64.css">
<link rel="stylesheet" href="css/mobile-lock.css">
<style>
:root{--bg:#1A1A2E;--card:#16213E;--accent:#E94560;--xinyu:#6C5CE7;--ok:#4ECCA3;--warn:#FFB347;--text:#EAEAEA;--sub:#8A8A9A;--border:#2A2A4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:100px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar .back{font-size:18px;cursor:pointer;color:var(--accent)}
.topbar h1{font-size:17px;font-weight:600}
.topbar .draft{font-size:12px;color:var(--xinyu);cursor:pointer}
.container{padding:16px}
.post-textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:15px;outline:none;min-height:150px;resize:none;font-family:inherit;line-height:1.6}
.post-textarea::placeholder{color:var(--sub)}
.char-count{text-align:right;font-size:11px;color:var(--sub);margin-top:4px}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.media-add{aspect-ratio:1;background:var(--card);border:2px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px;font-size:12px;color:var(--sub)}
.media-add .icon{font-size:24px}
.media-slot{aspect-ratio:1;background:var(--card);border-radius:12px;position:relative;overflow:hidden}
.media-slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.media-slot .remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.topic-section{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topic-tag{padding:6px 12px;background:var(--card);border-radius:16px;font-size:12px;color:var(--sub);cursor:pointer;border:1px solid var(--border)}
.topic-tag.selected{background:rgba(108,92,231,.15);border-color:var(--xinyu);color:var(--xinyu)}
.link-card{background:var(--card);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:16px;cursor:pointer;border:1px solid var(--border)}
.link-card .link-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--xinyu),var(--accent));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.link-card .link-info{flex:1;min-width:0}
.link-card .link-title{font-size:13px;font-weight:500;margin-bottom:2px}
.link-card .link-desc{font-size:11px;color:var(--sub)}
.link-card .link-remove{font-size:16px;color:var(--sub);cursor:pointer}
.visibility{display:flex;gap:0;background:var(--card);border-radius:12px;padding:4px;margin-bottom:16px}
.vis-option{flex:1;padding:10px;text-align:center;font-size:13px;border-radius:10px;cursor:pointer;color:var(--sub)}
.vis-option.active{background:var(--accent);color:#fff}
.ai-bar{background:linear-gradient(135deg,rgba(108,92,231,.1),rgba(233,69,96,.1));border:1px solid rgba(108,92,231,.2);border-radius:12px;padding:12px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.ai-bar .icon{font-size:20px}
.ai-bar .text{flex:1;font-size:13px;color:var(--sub)}
.ai-bar .btn{padding:6px 14px;background:var(--xinyu);border:none;border-radius:8px;color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.preview-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
.preview-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.preview-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--xinyu),var(--accent));display:flex;align-items:center;justify-content:center;font-size:16px}
.preview-name{font-size:14px;font-weight:500}
.preview-time{font-size:11px;color:var(--sub)}
.preview-body{font-size:14px;line-height:1.6;margin-bottom:12px}
.preview-media{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;border-radius:12px;overflow:hidden}
.preview-media .slot{aspect-ratio:1;background:linear-gradient(135deg,var(--xinyu),var(--accent));display:flex;align-items:center;justify-content:center;font-size:24px}
.generate-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center}
.btn-publish{flex:1;padding:14px;background:linear-gradient(135deg,var(--accent),var(--xinyu));border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn-draft{padding:14px 20px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;cursor:pointer}
</style>
<link rel="stylesheet" href="css/tabbar-embed.css">
</head>
<body>
<div class="topbar">
  <span class="back" onclick="history.back()">‹ 返回</span>
  <h1>✏️ 创建动态</h1>
  <span class="draft" onclick="saveDraft()">📝 存草稿</span>
</div>
<div class="container">
  <textarea class="post-textarea" id="postText" placeholder="分享你的创作灵感、角色故事、世界设定..." oninput="countChars()"></textarea>
  <div class="char-count"><span id="charNum">0</span>/500</div>
  <div class="ai-bar">
    <span class="icon">✨</span>
    <span class="text">AI帮你润色文案</span>
    <button class="btn" onclick="aiPolish()">AI润色</button>
  </div>
  <div class="media-grid">
    <div class="media-slot"><div class="ph">🎨</div><div class="remove" onclick="this.parentElement.remove()">✕</div></div>
    <div class="media-add" onclick="addMedia()"><div class="icon">＋</div><div>添加图片/视频</div></div>
  </div>
  <div class="section-title" style="margin-top:16px">关联作品（可选）</div>
  <div class="link-card" id="linkCard">
    <div class="link-icon">📖</div>
    <div class="link-info">
    <div class="link-title">《西游记》</div>
    <div class="link-desc">小说 · 86.2万字</div>
    </div>
    <span class="link-remove" onclick="document.getElementById('linkCard').style.display='none'">✕</span>
  </div>
  <div class="section-title">话题标签</div>
  <div class="topic-section">
    <div class="topic-tag selected" onclick="toggleTopic(this)">#创作日常</div>
    <div class="topic-tag" onclick="toggleTopic(this)">#角色故事</div>
    <div class="topic-tag" onclick="toggleTopic(this)">#世界观分享</div>
    <div class="topic-tag" onclick="toggleTopic(this)">#灵感碎片</div>
    <div class="topic-tag" onclick="toggleTopic(this)">#灵念展示</div>
    <div class="topic-tag" onclick="toggleTopic(this)">#创作教程</div>
  </div>
  <div class="section-title">可见范围</div>
  <div class="visibility">
    <div class="vis-option active" onclick="setVis(this)">公开</div>
    <div class="vis-option" onclick="setVis(this)">仅粉丝</div>
    <div class="vis-option" onclick="setVis(this)">私密</div>
  </div>
  <div class="preview-card">
    <div class="preview-header">
      <div class="preview-avatar">🧑‍💻</div>
      <div>
        <div class="preview-name">创作者</div>
        <div class="preview-time">刚刚</div>
      </div>
    </div>
    <div class="preview-body" id="previewBody">在下方输入你的动态内容...</div>
    <div class="preview-media"><div class="slot">🎨</div></div>
  </div>
</div>
<div class="generate-bar">
  <button class="btn-draft" onclick="saveDraft()">存草稿</button>
  <button class="btn-publish" onclick="publish()">发布动态</button>
</div>
<script>
function countChars(){const n=document.getElementById('postText').value.length;document.getElementById('charNum').textContent=n;document.getElementById('previewBody').textContent=document.getElementById('postText').value||'在下方输入你的动态内容...'}
function toggleTopic(e){e.classList.toggle('selected')}
function setVis(e){[...e.parentElement.children].forEach(c=>c.classList.remove('active'));e.classList.add('active')}
function addMedia(){alert('选择图片或视频')}
function saveDraft(){alert('已保存到草稿箱！')}
function publish(){
  if(!document.getElementById('postText').value.trim()){alert('请输入动态内容');return}
  alert('动态发布成功！');
}
function aiPolish(){
  const btn=document.querySelector('.ai-bar .btn');
  btn.textContent='生成中...';
  setTimeout(()=>{
    const polished=document.getElementById('postText').value;
    if(polished){document.getElementById('postText').value=polished+' ✨\n\n（灵感如泉涌，创作无止境。）'}
    countChars();
    btn.textContent='AI润色';
  },1000);
}
</script>
<script src="js/creator-store.js"></script>
<script src="js/creator-ai.js"></script>
<script src="js/creator-pages.js"></script>
<script src="js/tabbar.js"></script>
</body>
</html>
