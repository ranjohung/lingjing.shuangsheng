<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小说世界资产总览 — 灵境 · 双生</title>
<meta name="description" content="由小说原文自动生成的世界资产总览：SD 场景背景、人物立绘、Blender 3D 场景，全部可溯源至原文。">
<link rel="stylesheet" href="css/mobile-lock.css" />
<style>
:root { --brand:#1A1A2E; --red:#E94560; --purple:#6C5CE7; --green:#00B894; --gold:#FFB347; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0e0e1c; color:#EAEAF0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding-bottom:20px; }
a { color:inherit; text-decoration:none; }

.fl-back { position:fixed; top:14px; left:12px; z-index:300; width:36px; height:36px; border-radius:50%; background:rgba(14,14,28,.72); border:1px solid rgba(255,255,255,.18); display:grid; place-items:center; font-size:16px; backdrop-filter:blur(6px); }
.fl-world { position:fixed; top:14px; right:12px; z-index:300; width:36px; height:36px; border-radius:50%; background:rgba(14,14,28,.72); border:1px solid rgba(255,255,255,.18); display:grid; place-items:center; font-size:15px; backdrop-filter:blur(6px); }

.hd { padding:66px 16px 14px; }
.hd h1 { font-size:19px; font-weight:800; letter-spacing:1px; }
.hd .sub { font-size:11px; color:rgba(234,234,240,.55); margin-top:7px; line-height:1.85; }
.hd .src { margin-top:9px; font-size:10px; color:#ffd98a; }

.kpi { display:flex; gap:8px; padding:2px 16px 18px; flex-wrap:wrap; }
.kpi .k { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:9px 11px; flex:1 1 76px; }
.kpi .kv { font-size:17px; font-weight:800; color:var(--gold); line-height:1.2; }
.kpi .kl { font-size:10px; color:rgba(234,234,240,.55); margin-top:3px; }

.sec { padding:0 16px; margin-bottom:24px; }
.sec-h { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
.sec-h .t { font-size:14px; font-weight:700; white-space:nowrap; }
.sec-h .n { font-size:10px; color:rgba(234,234,240,.5); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:1px 8px; }
.sec-h .line { flex:1; height:1px; background:linear-gradient(90deg,rgba(255,255,255,.14),transparent); }
.sec-note { font-size:10px; color:rgba(234,234,240,.42); margin:-4px 0 10px; line-height:1.7; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:14px; overflow:hidden; }
.card .thumb { width:100%; display:block; aspect-ratio:16/10; object-fit:cover; background:#15152a; }
.card .thumb.p { aspect-ratio:3/4; }
.card .bd { padding:9px 10px 11px; }
.card .nm { font-size:12px; font-weight:700; }
.card .mt { font-size:10px; color:rgba(234,234,240,.55); margin-top:4px; line-height:1.65; }
.card .tg { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
.card .tg i { font-style:normal; font-size:9.5px; color:#c9b8ff; background:rgba(108,92,231,.14); border:1px solid rgba(108,92,231,.35); border-radius:5px; padding:1px 6px; }
.card .tg i.g { color:#7dedc8; background:rgba(0,184,148,.13); border-color:rgba(0,184,148,.35); }
.card .dl { display:inline-block; margin-top:8px; font-size:10px; color:#ffd98a; border-bottom:1px dotted rgba(255,179,71,.5); }

.wide { grid-column:1 / -1; }
.wide .thumb { aspect-ratio:16/9; }

.empty { font-size:11px; color:rgba(234,234,240,.4); padding:8px 0; }
.ft { text-align:center; font-size:10px; color:rgba(234,234,240,.3); padding:14px 16px 34px; line-height:1.95; }
</style>
</head>
<body>

<a class="fl-back" id="b-back" href="world-forge.html">←</a>
<a class="fl-world" id="b-world" href="world-view.html?book=xiyouji">📖</a>

<div class="hd">
  <h1 id="ttl">小说世界资产总览</h1>
  <div class="sub" id="sub">由小说原文自动生成的世界资产：场景背景与人物立绘来自本地 Stable Diffusion，3D 场景来自 Blender 程序化建模。每一条提示词都可溯源到原文原字。</div>
  <div class="src" id="src"></div>
</div>

<div class="kpi" id="kpi"></div>
<main id="app"></main>
<div class="ft">
  灵境 · 双生 · 小说世界引擎 v25<br />
  零删减：主线文字与原文逐字一致 ｜ 零创造：所有命名实体均可在原文中检索到
</div>

<script>
var BOOK = new URLSearchParams(location.search).get('book') || 'xiyouji';
var W = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function card(item) {
  var tg = (item.tags || []).map(function (t, i) {
    return '<i class="' + (i % 2 ? 'g' : '') + '">' + esc(t) + '</i>';
  }).join('');
  var dl = item.href ? '<a class="dl" href="' + esc(item.href) + '" download>↓ 下载 ' + esc(item.dlLabel || '模型') + '</a>' : '';
  return '<div class="card' + (item.wide ? ' wide' : '') + '">' +
    '<img class="thumb' + (item.portrait ? ' p' : '') + '" src="' + esc(item.img) + '" alt="' + esc(item.name) + '" loading="lazy" />' +
    '<div class="bd">' +
      '<div class="nm">' + esc(item.name) + '</div>' +
      '<div class="mt">' + esc(item.meta) + '</div>' +
      (tg ? '<div class="tg">' + tg + '</div>' : '') +
      dl +
    '</div>' +
  '</div>';
}

function section(title, num, note, items) {
  var body = items.length ? '<div class="grid">' + items.map(card).join('') + '</div>'
                         : '<div class="empty">暂未生成该类资产</div>';
  return '<div class="sec">' +
    '<div class="sec-h"><span class="t">' + esc(title) + '</span><span class="n">' + num + '</span><span class="line"></span></div>' +
    (note ? '<div class="sec-note">' + esc(note) + '</div>' : '') +
    body +
  '</div>';
}

function tokTags(list, max) {
  return (list || []).slice(0, max || 4).map(function (t) { return t.zh + ' → ' + t.en; });
}

function render() {
  var A = W.assets, M = W.meta, S = W.stats;

  document.title = '小说世界资产总览 · 《' + M.title + '》 — 灵境 · 双生';
  document.getElementById('ttl').textContent = '《' + M.title + '》小说世界资产总览';
  document.getElementById('src').textContent =
    '原文 ' + (M.full_chars || 0).toLocaleString() + ' 字 · 本次解析窗口 ' + (M.window_chars || 0).toLocaleString() +
    ' 字 · 体裁识别：' + (W.genre && W.genre.name ? W.genre.name : '—');
  document.getElementById('b-world').href = 'world-view.html?book=' + BOOK;

  document.getElementById('kpi').innerHTML = [
    { v: W.anchors.length, l: '主线锚点' },
    { v: W.scenes.length, l: '场景' },
    { v: W.characters.length, l: '角色' },
    { v: W.locations.length, l: '地点' },
    { v: W.props.length, l: '道具' },
    { v: (A.backgrounds || []).length, l: 'SD 背景' },
    { v: (A.portraits || []).length, l: 'SD 立绘' },
    { v: (A.models3d || []).length, l: '3D 场景' }
  ].map(function (k) {
    return '<div class="k"><div class="kv">' + k.v + '</div><div class="kl">' + k.l + '</div></div>';
  }).join('');

  var bgs = (A.backgrounds || []).map(function (b) {
    return {
      img: b.image || ('img/novel-forge/' + BOOK + '/' + b.file),
      name: b.location,
      meta: '类型 ' + b.kind + ' · 覆盖 ' + (b.scene_ids || []).length + ' 个场景 · ' + (b.anchors || 0) + ' 锚点',
      tags: tokTags(b.imagery_sources, 4)
    };
  });

  var pors = (A.portraits || []).map(function (p) {
    return {
      img: p.image || ('img/novel-forge/' + BOOK + '/' + p.file),
      name: p.name,
      meta: '层级 ' + (p.tier === 'main' ? '主要角色' : '次要角色') + ' · 原文提及 ' + (p.mentions || 0) + ' 次',
      tags: tokTags(p.traits, 4),
      portrait: true
    };
  });

  var m3d = (A.models3d || []).map(function (m) {
    return {
      img: 'img/novel-forge/' + BOOK + '/3d/' + m.render,
      name: m.location + '（' + m.kind + '）',
      meta: '配方 ' + m.recipe + ' · Blender 程序化生成 · 已导出 GLB',
      tags: ['glb: ' + m.glb],
      href: 'models/novel-forge/' + BOOK + '/' + m.glb,
      dlLabel: 'GLB',
      wide: true
    };
  });

  document.getElementById('app').innerHTML =
    section('场景背景', bgs.length + ' 张', '由 Stable Diffusion 生成，提示词取自该场景原文高频意象词。', bgs) +
    section('人物立绘', pors.length + ' 张', '由 Stable Diffusion 生成，外观特征自原文人物描写中提取。', pors) +
    section('3D 场景', m3d.length + ' 个', '由 Blender 无头程序化建模，可下载 GLB 用于三维场景搭建。', m3d);
}

function loadWorldById(id) {
  if (window.__LJ_WORLD__ && window.__LJ_WORLD__[id]) { W = window.__LJ_WORLD__[id]; render(); return; }
  var sc = document.createElement('script');
  sc.src = 'worlds/' + id + '.js';
  sc.onload = function () {
    if (window.__LJ_WORLD__ && window.__LJ_WORLD__[id]) { W = window.__LJ_WORLD__[id]; render(); }
    else { fetchWorld(id); }
  };
  sc.onerror = function () { fetchWorld(id); };
  document.head.appendChild(sc);
}

function fetchWorld(id) {
  fetch('worlds/' + id + '.json').then(function (r) {
    if (!r.ok) throw new Error('status ' + r.status);
    return r.json();
  }).then(function (w) {
    W = w;
    render();
  }).catch(function (e) {
    document.getElementById('app').innerHTML =
      '<div class="sec"><div class="empty">未能载入世界蓝图（' + esc(e.message) + '）。请先到「世界生成工作台」生成这个世界。</div></div>';
  });
}

loadWorldById(BOOK);
</script>
</body>
</html>
