<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>我的角色 · 灵境 · 双生</title>
<meta name="description" content="V20-M · 我的角色 · 我创建的 + 双生角色 · 心屿角色管理" />
<meta name="theme-color" content="#0d0b22" />
<link rel="stylesheet" href="css/shell-v64.css" />
<style>
.mc-page{padding-bottom:32px}
.mc-sub{display:flex;gap:6px;margin:14px var(--margin) 12px}
.mc-chip{flex:1;padding:9px 0;text-align:center;font-size:13px;color:var(--sub);border-radius:10px;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.mc-chip.on{background:linear-gradient(135deg,var(--xinyu),#9b5be0);color:#fff;font-weight:600}
.mc-list{margin:0 var(--margin);display:flex;flex-direction:column;gap:10px}
.mc-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit}
.mc-item .ava{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:22px}
.mc-item .body{flex:1;min-width:0}
.mc-item .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.badge-create{font-size:9px;padding:1px 6px;border-radius:5px;background:rgba(108,92,231,.18);color:#A29BFE;font-weight:600}
.badge-twin{font-size:9px;padding:1px 6px;border-radius:5px;background:rgba(233,69,96,.16);color:var(--accent);font-weight:600}
.mc-item .s{font-size:11px;color:var(--sub);margin-top:3px}
.mc-item .int{text-align:right;flex-shrink:0}
.mc-item .int .v{font-size:15px;font-weight:600;color:var(--xinyu)}
.mc-item .int .l{font-size:10px;color:var(--sub)}
.mc-item .arr{font-size:16px;color:rgba(160,160,176,.4)}
.mc-new{display:block;margin:14px var(--margin) 0;padding:13px 0;border-radius:12px;text-align:center;border:1px dashed rgba(108,92,231,.5);color:#A29BFE;font-size:14px;font-weight:600;text-decoration:none}
.mc-empty{margin:40px var(--margin);text-align:center;color:var(--sub);font-size:13px;line-height:2}
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
</head>
<body>
<div id="app" class="mc-page">
  <header class="topbar">
    <a class="icon-btn" href="me.html" title="返回">‹</a>
    <div class="topbar-title"><span class="dot"></span>我的角色</div>
    <div class="topbar-acts"><span style="font-size:11px;color:var(--sub);align-self:center">心屿角色管理</span></div>
  </header>

  <main>
    <!-- 子筛选：我创建的 / 双生角色（设计文档 §4.2） -->
    <div class="mc-sub" id="mc-sub">
      <div class="mc-chip on" data-src="all">全部</div>
      <div class="mc-chip" data-src="user_created">我创建的</div>
      <div class="mc-chip" data-src="novel_brought_out">双生角色</div>
    </div>
    <div class="mc-list" id="mc-list"></div>
    <div class="mc-empty" id="mc-empty" style="display:none">暂无该类角色</div>
    <a class="mc-new" href="character-create.html">＋ 创建新角色</a>
  </main>
</div>

<div id="toast"></div>
<script>
function showToast(kind, title, msg){
  var c = document.getElementById('toast');
  var t = document.createElement('div');
  t.className = 'toast-item ' + (kind || 'ok');
  t.innerHTML = '<span class="ti"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
var curSrc = 'all';

function getList() {
  // 复用心屿数据（heart-data.js CHARACTERS），缺失时回退内置
  var src = (window.HEART_DATA && window.HEART_DATA.CHARACTERS) || [];
  if (src.length) return src;
  return FALLBACK;
}
var FALLBACK = [
  { id:'c04', source_type:'user_created', name:'阿岁', avatar:'🏮', occupation:'心理咨询师', intimacy:92, stage:'知己' },
  { id:'c06', source_type:'novel_brought_out', name:'林清雪', avatar:'🌸', occupation:'记者', intimacy:78, novel_name:'深海回声' }
];

function render() {
  var list = getList().filter(function (c) { return curSrc === 'all' || c.source_type === curSrc; });
  var box = document.getElementById('mc-list');
  box.innerHTML = '';
  document.getElementById('mc-empty').style.display = list.length ? 'none' : '';
  list.forEach(function (c) {
    var isTwin = c.source_type === 'novel_brought_out';
    var a = document.createElement('a');
    a.className = 'mc-item';
    a.href = 'character-detail.html?cid=' + (c.id || '');
    a.innerHTML =
      '<div class="ava" style="background:linear-gradient(135deg,rgba(108,92,231,.25),rgba(0,184,148,.18))">' + (c.avatar || '🌟') + '</div>' +
      '<div class="body">' +
        '<div class="t">' + c.name +
          (isTwin ? '<span class="badge-twin">双</span>' : '<span class="badge-create">创</span>') +
        '</div>' +
        '<div class="s">' + (c.occupation || '—') + (isTwin && c.novel_name ? ' · 来自《' + c.novel_name + '》' : '') + '</div>' +
      '</div>' +
      '<div class="int"><div class="v">' + (c.intimacy != null ? c.intimacy : '—') + '</div><div class="l">亲密度</div></div>' +
      '<span class="arr">›</span>';
    box.appendChild(a);
  });
}
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('mc-sub').addEventListener('click', function (ev) {
    var t = ev.target.closest('.mc-chip');
    if (!t) return;
    curSrc = t.dataset.src;
    this.querySelectorAll('.mc-chip').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    render();
  });
  render();
});
</script>
<script src="js/heart-data.js"></script>
<script src="js/tabbar.js"></script>
</body>
</html>
