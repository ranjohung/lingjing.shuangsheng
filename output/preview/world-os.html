<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小说世界 · 沉浸模式 — 灵境 · 双生</title>
<!--
 * 灵境 · 双生 — 小说世界OS V2.0 · 沉浸世界页（V24-D）
 * 沉浸页豁免（铁律 #4）：不挂 5 Tab，只保留 [← 返回] + [📖世界] 浮钮
 * 主线渲染只读 canon.anchors[].text —— 本页无任何文本生成路径
-->
<link rel="stylesheet" href="css/mobile-lock.css" />
<style>
  :root { --brand:#1A1A2E; --red:#E94560; --purple:#6C5CE7; --green:#00B894; --gold:#FFB347; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0e0e1c; color:#EAEAF0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; }

  /* 沉浸页豁免浮钮 */
  .fl-back { position:fixed; top:14px; left:12px; z-index:300; width:36px; height:36px; border-radius:50%; background:rgba(14,14,28,.65); border:1px solid rgba(255,255,255,.18); display:grid; place-items:center; font-size:16px; backdrop-filter:blur(6px); }
  .fl-world { position:fixed; top:14px; right:12px; z-index:300; width:36px; height:36px; border-radius:50%; background:rgba(14,14,28,.65); border:1px solid rgba(255,255,255,.18); display:grid; place-items:center; font-size:15px; backdrop-filter:blur(6px); }

  /* ===== 身份选择 ===== */
  .mode-veil { position:fixed; inset:0; z-index:200; background:rgba(10,10,20,.94); overflow-y:auto; padding:70px 18px 30px; }
  .mode-t { font-size:20px; font-weight:800; text-align:center; letter-spacing:2px; }
  .mode-s { font-size:11px; color:rgba(234,234,240,.55); text-align:center; margin:8px 0 20px; line-height:1.8; }
  .mode { position:relative; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); border-radius:16px; padding:16px 15px; margin-bottom:12px; cursor:pointer; transition:border-color .2s, transform .15s; }
  .mode:active { transform:scale(.985); }
  .mode .mn { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .mode .md { font-size:11.5px; color:rgba(234,234,240,.6); margin-top:6px; line-height:1.7; }
  .mode.lock { opacity:.55; cursor:not-allowed; }
  .mode .tag { position:absolute; top:12px; right:12px; font-size:10px; border-radius:999px; padding:2px 9px; }
  .tag.rec { background:rgba(0,184,148,.16); color:#7dedc8; border:1px solid rgba(0,184,148,.45); }
  .tag.soon { background:rgba(255,255,255,.08); color:rgba(234,234,240,.5); border:1px solid rgba(255,255,255,.15); }

  /* ===== 舞台 ===== */
  .stage { position:relative; height:46vh; min-height:300px; overflow:hidden; }
  .stage img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .8s; }
  .stage .vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(8,8,18,.72) 100%); }
  .stage .grain { position:absolute; inset:0; opacity:.09; mix-blend-mode:overlay; pointer-events:none;
                  background-image:repeating-conic-gradient(rgba(255,255,255,.6) 0 .0001turn, transparent 0 .0002turn); }
  .stage .dof { position:absolute; inset:0; box-shadow:inset 0 -70px 60px -30px rgba(10,10,20,.95); }

  .sc-cap { position:absolute; left:14px; top:58px; font-size:11px; color:rgba(234,234,240,.85); background:rgba(10,10,20,.55); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:4px 11px; backdrop-filter:blur(4px); }
  .badge-canon { position:absolute; left:14px; top:92px; font-size:10px; font-weight:700; color:#1f1500; background:linear-gradient(135deg,#ffd98a,var(--gold)); border-radius:6px; padding:3px 8px; letter-spacing:1px; box-shadow:0 0 12px rgba(255,179,71,.35); }

  /* 热点 */
  .hots { position:absolute; left:0; right:0; bottom:10px; display:flex; gap:8px; padding:0 14px; flex-wrap:wrap; }
  .hot { font-size:11px; color:#dffdF3; background:rgba(10,10,20,.6); border:1px solid rgba(0,184,148,.55); border-radius:999px; padding:6px 12px; cursor:pointer; backdrop-filter:blur(4px); }
  .hot.sim { border-color:rgba(162,155,254,.55); color:#e4deff; }

  /* ===== 文本区 ===== */
  .textwrap { position:relative; margin-top:-24px; border-radius:22px 22px 0 0; background:linear-gradient(180deg,#141428,#0e0e1c); padding:18px 16px 130px; min-height:54vh; }
  .pres { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { font-size:10px; color:rgba(234,234,240,.65); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:3px 9px; }
  .chip.cam { color:#c9b8ff; border-color:rgba(108,92,231,.4); }
  .canon-text { font-size:15.5px; line-height:2.05; text-align:justify; }
  .canon-text .q { color:#ffe9c2; }
  .anchor-meta { margin-top:14px; font-size:10px; color:rgba(234,234,240,.35); }

  /* 探索结果卡 */
  .reveal { position:fixed; left:14px; right:14px; bottom:96px; z-index:250; background:#181830; border:1px solid rgba(0,184,148,.45); border-radius:14px; padding:13px 14px; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .reveal .rk { display:inline-block; font-size:10px; font-weight:700; border-radius:5px; padding:2px 7px; margin-bottom:7px; }
  .rk.ex { color:#0a2d22; background:#4fe0b0; }
  .rk.sim { color:#221a4d; background:#b3a7ff; }
  .reveal .rt { font-size:13px; line-height:1.8; }
  .reveal .close { position:absolute; top:8px; right:12px; font-size:15px; color:rgba(234,234,240,.5); cursor:pointer; }

  /* 状态栏 + 操作 */
  .statusbar { position:fixed; top:0; left:0; right:0; z-index:150; display:flex; align-items:center; gap:8px; padding:56px 60px 8px 58px; font-size:10px; color:rgba(234,234,240,.75); background:linear-gradient(180deg,rgba(10,10,20,.85),transparent); pointer-events:none; }
  .statusbar .st { background:rgba(10,10,20,.5); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:3px 9px; pointer-events:auto; }
  .ops { position:fixed; left:0; right:0; bottom:0; z-index:160; display:flex; gap:10px; padding:12px 14px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(0deg,#0e0e1c 55%,rgba(14,14,28,0)); }
  .ops button { flex:1; border:none; border-radius:12px; padding:13px 0; font-size:14px; font-weight:700; cursor:pointer; }
  .ops .prev { flex:0 0 92px; background:rgba(255,255,255,.08); color:rgba(234,234,240,.8); border:1px solid rgba(255,255,255,.14); font-weight:500; }
  .ops .next { background:linear-gradient(135deg,var(--red),#c73a52); color:#fff; }
  .ops .home { flex:0 0 92px; background:rgba(0,184,148,.15); color:#7dedc8; border:1px solid rgba(0,184,148,.5); font-weight:500; }

  /* 即将开放入口 */
  .soonrow { display:flex; gap:8px; margin-top:12px; }
  .soon { flex:1; text-align:center; font-size:10.5px; color:rgba(234,234,240,.5); background:rgba(255,255,255,.04); border:1px dashed rgba(255,255,255,.16); border-radius:10px; padding:9px 4px; }

  .toast { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); z-index:400; background:rgba(20,20,40,.95); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:9px 18px; font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<a class="fl-back" href="world-os-upload.html" aria-label="返回上传页">←</a>
<a class="fl-world" href="library.html" aria-label="世界">📖</a>

<div class="statusbar">
  <span class="st" id="st-ch">—</span>
  <span class="st" id="st-prog">—</span>
  <span class="st" id="st-mode">—</span>
</div>

<!-- 身份选择 -->
<div class="mode-veil" id="mode-veil">
  <div class="mode-t">选择进入方式</div>
  <div class="mode-s">主线永远走原著 —— 你的选择只影响你自己的世界状态</div>

  <div class="mode" id="md-A" role="button" tabindex="0">
    <span class="tag rec">推荐</span>
    <div class="mn">📖 模式 A · 原著阅读者</div>
    <div class="md">完整体验小说，最大限度还原原著：原文阅读 + 原著镜头 + 原著剧情，主线不可被破坏。</div>
  </div>
  <div class="mode" id="md-B" role="button" tabindex="0">
    <div class="mn">🏮 模式 B · 世界游客</div>
    <div class="md">进入这个世界看看：点击场景里的物件与人物自由探索，主线随时可回，剧情仍按原著发生。</div>
  </div>
  <div class="mode lock" id="md-C">
    <span class="tag soon">即将开放</span>
    <div class="mn">🎭 模式 C · 同人玩家</div>
    <div class="md">选择身份（原著主角 / 原创角色 / 路人 / 配角），在不破坏主线的前提下书写你的故事。</div>
  </div>

  <div class="soonrow">
    <div class="soon">灵境支线<br/>即将开放</div>
    <div class="soon">IF 同人线<br/>即将开放</div>
    <div class="soon">带出到心屿<br/>即将开放</div>
  </div>
</div>

<!-- 舞台 -->
<div class="stage">
  <img class="bg" id="bg" src="img/novel-os/street_rain_night.png" alt="场景" />
  <div class="vignette"></div><div class="grain"></div><div class="dof"></div>
  <div class="sc-cap" id="sc-cap">—</div>
  <div class="badge-canon">【原著剧情】</div>
  <div class="hots" id="hots"></div>
</div>

<!-- 文本区 -->
<div class="textwrap">
  <div class="pres" id="pres"></div>
  <div class="canon-text" id="canon-text">—</div>
  <div class="anchor-meta" id="anchor-meta"></div>
</div>

<!-- 探索结果 -->
<div class="reveal hidden" id="reveal">
  <span class="close" id="rv-close">✕</span>
  <span class="rk ex" id="rv-kind">【世界探索】</span>
  <div class="rt" id="rv-text"></div>
</div>

<div class="ops">
  <button class="prev" id="b-prev">上一段</button>
  <button class="next" id="b-next">继续 ▸</button>
  <button class="home hidden" id="b-home">回主线</button>
</div>

<div class="toast" id="toast"></div>

<script src="js/novel-os-store.js"></script>
<script>
var S = NovelOSStore.state;
var BG = {
  street_rain_night: 'img/novel-os/street_rain_night.png',
  study_rain_night: 'img/novel-os/study_rain_night.png',
  tavern_warm: 'img/novel-os/tavern_warm.png'
};
var idx = 0, MODE = 'A', curBg = '';

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 1800);
}

/* ---- 身份选择 ---- */
document.getElementById('md-A').addEventListener('click', function () { enter('A'); });
document.getElementById('md-B').addEventListener('click', function () { enter('B'); });
function enter(m) {
  MODE = m;
  NovelOSStore.setMode(m);
  document.getElementById('mode-veil').style.display = 'none';
  var saved = NovelOSStore.loadGame('current');
  if (saved && saved.anchor_idx > 0) {
    idx = Math.min(saved.anchor_idx, S.canon.anchors.length - 1);
    toast('已恢复上次的进度');
  }
  document.getElementById('b-home').classList.toggle('hidden', m !== 'B');
  render();
}

/* ---- 渲染当前锚点 ---- */
function render() {
  var a = S.canon.anchors[idx];
  if (!a) return;
  var p = S.presentation[a.id] || {};

  // 场景切换（背景变化时淡入淡出）
  var bgKey = p.bg || 'street_rain_night';
  if (bgKey !== curBg) {
    curBg = bgKey;
    var img = document.getElementById('bg');
    img.style.opacity = 0;
    setTimeout(function () { img.src = BG[bgKey] || BG.street_rain_night; img.style.opacity = 1; }, 260);
  }
  document.getElementById('sc-cap').textContent = (p.environment || '—') + ' · ' + (p.bgm || '');

  // L2 演出 chips
  var chips = [];
  (p.camera || []).forEach(function (c) { chips.push('<span class="chip cam">镜头 · ' + c + '</span>'); });
  if (p.action) chips.push('<span class="chip">动作 · ' + p.action + '</span>');
  (p.characters || []).forEach(function (c) { chips.push('<span class="chip">人物 · ' + c + '</span>'); });
  document.getElementById('pres').innerHTML = chips.join('');

  // 原文（byte-equal，零删减）
  document.getElementById('canon-text').textContent = a.text;
  document.getElementById('anchor-meta').textContent =
    'Canon Anchor ' + a.id + ' · 第' + a.chapter + '章 · ' + a.type + ' · SHA 校验通过 · immutable';

  // 状态栏
  document.getElementById('st-ch').textContent = '第' + a.chapter + '章';
  document.getElementById('st-prog').textContent = (idx + 1) + '/' + S.canon.anchors.length;
  document.getElementById('st-mode').textContent = MODE === 'A' ? '原著阅读者' : '世界游客';

  renderHots(a);
  NovelOSStore.saveGame('current');
}

/* ---- 热点（L3 世界探索 / L4 SIMULATION） ---- */
function renderHots(a) {
  var box = document.getElementById('hots');
  var html = '';
  if (MODE === 'B') {
    // 世界游客：全场景热点常驻
    S.interactions.forEach(function (ix) {
      if (ix.anchor_id === a.id) html += hotBtn(ix);
    });
  } else {
    // 阅读者：只显示当前锚点挂接的热点
    S.interactions.forEach(function (ix) {
      if (ix.anchor_id === a.id) html += hotBtn(ix);
    });
  }
  box.innerHTML = html;
  box.querySelectorAll('.hot').forEach(function (b) {
    b.addEventListener('click', function () {
      openReveal(b.getAttribute('data-text'), b.getAttribute('data-kind') === 'sim');
    });
  });
}
function hotBtn(ix) {
  var isSim = S.simulation.some(function (s) { return s.name === ix.object; });
  return '<button class="hot' + (isSim ? ' sim' : '') + '" data-kind="' + (isSim ? 'sim' : 'ex') +
    '" data-text="' + (isSim ? simText(ix.object) : ix.text) + '">' + ix.object + '</button>';
}
function simText(name) {
  var s = S.simulation.filter(function (x) { return x.name === name; })[0];
  return s ? s.text : '（SIMULATION 演示 · 非原著正文）';
}

function openReveal(text, isSim) {
  document.getElementById('rv-kind').className = 'rk ' + (isSim ? 'sim' : 'ex');
  document.getElementById('rv-kind').textContent = isSim ? 'SIMULATION · 非原著正文' : '【世界探索】';
  document.getElementById('rv-text').textContent = text;
  document.getElementById('reveal').classList.remove('hidden');
}
document.getElementById('rv-close').addEventListener('click', function () {
  document.getElementById('reveal').classList.add('hidden');
});

/* ---- 推进 ---- */
document.getElementById('b-next').addEventListener('click', function () {
  if (idx < S.canon.anchors.length - 1) { idx++; render(); }
  else toast('已到全书最后一幕 · 支线/IF 线即将开放');
});
document.getElementById('b-prev').addEventListener('click', function () {
  if (idx > 0) { idx--; render(); }
});
document.getElementById('b-home').addEventListener('click', function () {
  document.getElementById('reveal').classList.add('hidden');
  toast('主线始终在这里：' + (idx + 1) + '/' + S.canon.anchors.length);
});

/* ---- 启动 ---- */
(function boot() {
  if (!S.canon.compiled || !S.canon.anchors.length) {
    // 未编译 → 送回上传页
    location.replace('world-os-upload.html');
    return;
  }
  // 键盘可访问性：A/B 卡片 Enter 触发
  ['md-A', 'md-B'].forEach(function (id) {
    document.getElementById(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById(id).click();
    });
  });
})();
</script>
</body>
</html>
