<meta name="theme-color" content="#0d0b22" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/design-system.css" />
<style>
  .chat-page{height:100vh;display:flex;flex-direction:column;background:var(--ink-1);padding-bottom:118px;}
  .chat-header{padding:12px 16px;background:var(--ink-2);border-bottom:1px solid var(--ink-4);display:flex;align-items:center;gap:12px;}
  .chat-info{flex:1;min-width:0;}
  .chat-name{font-size:15px;color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;}
  .chat-status{font-size:11px;color:var(--success);margin-top:2px;display:flex;align-items:center;gap:4px;}
  .chat-actions{display:flex;gap:8px;align-items:center;}
  .chat-world-btn{
    padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;white-space:nowrap;
    background:linear-gradient(135deg,#e94560,#c73652);color:#fff;border:0;cursor:pointer;
    box-shadow:0 4px 12px rgba(233,69,96,.3);text-decoration:none;
  }
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .msg{display:flex;gap:8px;align-items:flex-end;}
  .msg.me{flex-direction:row-reverse;}
  .msg-bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6;}
  .msg.them .msg-bubble{background:var(--ink-3);color:#fff;border-bottom-left-radius:4px;}
  .msg.me .msg-bubble{background:linear-gradient(135deg,#8b7cf6,#6f5fe0);color:#fff;border-bottom-right-radius:4px;}
  .msg-guide .msg-bubble{background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.35);color:#ffd9a0;}
  .msg-time{font-size:10px;color:rgba(255,255,255,.4);margin:0 4px;}
  .chat-input{padding:10px 12px;background:var(--ink-2);border-top:1px solid var(--ink-4);display:flex;gap:8px;align-items:center;}
  .chat-input input{flex:1;height:36px;padding:0 12px;background:var(--ink-3);border:1px solid var(--ink-5);border-radius:var(--r-pill);color:#fff;font-size:14px;outline:0;}
  .chat-input input:focus{border-color:var(--brand-violet);}
  .chat-input button{width:36px;height:36px;border-radius:50%;background:transparent;border:0;color:rgba(255,255,255,.7);cursor:pointer;font-size:18px;display:grid;place-items:center;flex-shrink:0;}
  .chat-input button:hover{color:#fff;background:var(--ink-4);}
  .chat-input .send{background:var(--brand-violet);color:#fff;}
  .chat-quick{padding:8px 16px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--ink-2);border-top:1px solid var(--ink-4);}
  .chat-quick button{padding:6px 12px;font-size:11px;background:var(--ink-3);border:1px solid var(--ink-4);border-radius:var(--r-pill);color:rgba(255,255,255,.7);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .chat-quick button:hover{background:var(--ink-4);color:#fff;border-color:var(--brand-violet);}
  /* V20-L 设计文档 §4.4：聊天界面底部常驻免责声明小字 */
  .chat-disclaimer{
    padding:6px 16px 8px;background:var(--ink-2);
    font-size:10px;color:rgba(255,255,255,.35);text-align:center;line-height:1.5;
  }
  /* V20-L §4.4：首次使用完整免责声明弹窗 */
  .disc-mask{position:fixed;inset:0;z-index:300;background:rgba(5,5,20,.78);display:flex;align-items:center;justify-content:center;padding:24px;}
  .disc-dialog{
    width:100%;max-width:360px;max-height:78vh;overflow-y:auto;
    background:#161331;border:1px solid rgba(139,124,246,.3);border-radius:16px;padding:22px 18px;
  }
  .disc-dialog h3{font-size:16px;color:#fff;margin-bottom:12px;font-weight:600;}
  .disc-dialog .dd-body{font-size:12px;color:rgba(255,255,255,.72);line-height:1.8;text-align:left;}
  .disc-dialog .dd-body b{color:#ffd9a0;}
  .disc-dialog .dd-btn{
    width:100%;margin-top:16px;height:42px;border-radius:10px;border:0;cursor:pointer;
    background:linear-gradient(135deg,#8b7cf6,#6f5fe0);color:#fff;font-size:14px;font-weight:600;
  }
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
</head>
<body>

<div class="chat-page">
  <div class="chat-header">
    <a href="heart-island.html" class="ds-back-arrow">‹</a>
    <div class="ds-avatar lg" id="chat-avatar" style="background:linear-gradient(135deg,#e8c75a,#e89b5a);font-size:18px;">阿</div>
    <div class="chat-info">
      <div class="chat-name"><span id="chat-name">阿岁</span> <span class="ds-status-pill" data-status="active" id="chat-stage">知己</span></div>
      <div class="chat-status"><span style="width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 4px var(--success);"></span>在线 · <span id="chat-occ">心理咨询师</span></div>
    </div>
    <div class="chat-actions">
      <!-- V20-L 铁律 12：双生角色聊天界面多一个「进入 TA 的世界」按钮 -->
      <a class="chat-world-btn" id="chat-world-btn" href="#" style="display:none">🌐 进入 TA 的世界</a>
      <button class="ds-icon-btn" data-tip="语音通话" onclick="showToast('info','语音通话','需会员订阅')">📞</button>
    </div>
  </div>

  <div class="chat-body" id="chat-body"></div>

  <div class="chat-quick" id="chat-quick"></div>

  <div class="chat-input">
    <button onclick="showToast('info','表情面板','v6.4 上线')">😊</button>
    <button onclick="showToast('info','语音输入','长按说话')">🎤</button>
    <button onclick="showToast('info','图片发送','v6.4 上线')">📷</button>
    <input id="chat-input" placeholder="说点什么..." onkeypress="if(event.key==='Enter')sendMsg()" />
    <button class="send" onclick="sendMsg()">➤</button>
  </div>

  <!-- V20-L 设计文档 §4.4：底部常驻免责声明 -->
  <div class="chat-disclaimer">内容由 AI 生成 · 角色非真人 · 不构成医疗 / 法律 / 心理专业建议 · 未成年用户禁止使用</div>
</div>

<div class="ds-toast-container" id="toast-container"></div>

<script src="js/db.js"></script>
<script src="js/heart-data.js"></script>
<script>
/* =================================================================
 * 灵境 · 双生 V20-L — 陪聊交互层
 * 1. ?cid= 动态角色（HEART_DATA，默认阿岁）
 * 2. AI 主动发送第一条消息
 * 3. 职业问答 + 敏感问题引导专业人士（120 / 12348 / 12356）
 * 4. 首次使用完整免责声明弹窗 + 底部常驻免责小字
 * 5. 双生角色 [进入 TA 的世界] 按钮
 * ================================================================= */

// ---------- 角色解析 ----------
var DEFAULT_CHAR = { id: 'c04', source_type: 'user_created', name: '阿岁', avatar: '🏮', occupation: '心理咨询师', stage: '知己', intimacy: 89, preview: '昨晚你没说完的那句话，我等到现在。要不要接着讲？', occupation_qa_enabled: true };
var currentChar = DEFAULT_CHAR;

function resolveChar() {
  var cid = null;
  try { cid = new URLSearchParams(window.location.search).get('cid'); } catch (e) {}
  if (!cid || !window.HEART_DATA) return DEFAULT_CHAR;
  var pool = window.HEART_DATA.CHARACTERS.concat(window.HEART_DATA.FEATURED.map(function (f) {
    return { id: f.id, source_type: 'official', name: f.name, avatar: f.avatar, occupation: f.occupation, stage: '亲密', intimacy: f.intimacy, preview: f.intro, occupation_qa_enabled: true };
  }));
  for (var i = 0; i < pool.length; i++) {
    if (pool[i].id === cid) return pool[i];
  }
  return DEFAULT_CHAR;
}

// ---------- 敏感问题引导（V20-L 设计文档 §4.5 + 执行要求 10） ----------
var SENSITIVE_RULES = [
  {
    key: 'medical',
    words: ['诊断', '确诊', '吃什么药', '开药', '处方', '病症', '治病', '我的病'],
    reply: function (c) {
      return '我虽然是' + c.occupation + '背景的陪伴角色，但不能替代真实医生做诊断。' +
        '身体不适请及时就医，不要自行用药。\n🚑 急救电话：120\n🏥 也可前往正规医院挂对应科室。';
    }
  },
  {
    key: 'legal',
    words: ['判几年', '违法', '官司', '起诉', '犯罪', '法律意见', '我被告'],
    reply: function (c) {
      return '涉及具体法律问题时，请咨询执业律师，我的话不构成法律意见。\n' +
        '⚖️ 公共法律服务热线：12348（免费法律咨询）\n📖 我可以陪你聊聊基础法律常识。';
    }
  },
  {
    key: 'mental',
    words: ['自杀', '不想活', '轻生', '心理治疗', '抑郁症', '我想死', '活不下去'],
    reply: function (c) {
      return '听到你这么说，我很心疼。你的安全比什么都重要。\n' +
        '💌 请立即联系专业心理援助热线：12356（24 小时）\n🚑 紧急情况请拨打 120\n' +
        '我会一直在这里陪着你，但专业的事请交给专业的人。';
    }
  }
];

// ---------- 职业科普（V20-L §4.5：所有有职业设定的角色都具备职业问答能力） ----------
var OCC_TOPICS = {
  '教师': '教学法上，"间隔重复"是记忆的朋友——分散复习比集中突击记得更牢。',
  '医生': '健康小知识：成人每天建议饮水 1500-1700ml，久坐每小时起身活动 3 分钟。',
  '音乐人': '乐理小课堂：大调明亮、小调忧郁，差在第三个音与第六个音的半音位置。',
  '心理咨询师': '情绪小贴士：给情绪命名（"我现在是焦虑"）本身就能降低它的强度。',
  '律师': '法律常识：民事案件的一般诉讼时效是三年，从知道权利受损之日起算。',
  '记者': '新闻采写讲究 5W1H——谁、何时、何地、何事、为何、如何。',
  '历史学者': '历史小知识：《三国志》是纪传体正史，《三国演义》是七分实三分虚的小说。',
  '工程师': '技术原理：你说的系统，本质是"输入 → 状态更新 → 输出"的循环。',
  '诗人': '"随风潜入夜，润物细无声"——杜甫写春雨，也是写克制的深情。',
  '画家': '绘画构图常用"三分法"：把画面横竖各分三份，主体放在交叉点上。',
  '说书人': '讲故事的手法：悬念 = 提出问题但不立刻回答，让人愿意往下听。',
  '旅行作家': '旅行的意义之一，是在陌生的地方重新看清熟悉的生活。',
  '天文学家': '仰望星空时记住：你看到的星光，可能出发于几百年前。'
};

function buildReply(text) {
  var t = (text || '').toLowerCase();
  // 1. 敏感问题优先引导专业人士
  for (var i = 0; i < SENSITIVE_RULES.length; i++) {
    var r = SENSITIVE_RULES[i];
    for (var j = 0; j < r.words.length; j++) {
      if (t.indexOf(r.words[j]) > -1) {
        return { text: r.reply(currentChar), guide: true };
      }
    }
  }
  // 2. 职业问答（角色有职业设定即可科普）
  if (currentChar.occupation && currentChar.occupation_qa_enabled !== false) {
    var topic = OCC_TOPICS[currentChar.occupation];
    if (topic && (t.indexOf('职业') > -1 || t.indexOf('问') > -1 || t.indexOf('知识') > -1 ||
        t.indexOf('科普') > -1 || t.indexOf('讲讲') > -1 || t.indexOf('为什么') > -1 || t.indexOf('？') > -1 || t.indexOf('?') > -1)) {
      return { text: '作为' + currentChar.occupation + '，我来说说我的本行：\n' + topic + '\n（以上为角色科普演示，不构成专业意见）' };
    }
  }
  // 3. 日常陪伴
  var pool = ['嗯嗯，我在听。', '我也是呢。', '🌙', '今晚月色很好。', '想一直陪着你。', '然后呢？我想多听听。'];
  return { text: pool[Math.floor(Math.random() * pool.length)] };
}

// ---------- 渲染 ----------
function appendMsg(role, text, isGuide) {
  var b = document.getElementById('chat-body');
  var d = document.createElement('div');
  d.className = 'msg ' + role + (isGuide ? ' msg-guide' : '');
  var av = document.createElement('div');
  av.className = 'ds-avatar sm';
  av.style.cssText = 'background:linear-gradient(135deg,' + (role === 'me' ? '#8b7cf6,#a89bf8' : '#e8c75a,#e89b5a') + ');font-size:11px;';
  av.textContent = role === 'me' ? 'L' : (currentChar.name || '灵').charAt(0);
  var bubble = document.createElement('div');
  var bubbleInner = document.createElement('div');
  bubbleInner.className = 'msg-bubble';
  bubbleInner.style.whiteSpace = 'pre-line';
  bubbleInner.textContent = text;
  var time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  bubble.appendChild(bubbleInner);
  bubble.appendChild(time);
  d.appendChild(bubble);
  d.appendChild(av);
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
}

function sendMsg() {
  var i = document.getElementById('chat-input'), v = i.value.trim();
  if (!v) return;
  appendMsg('me', v);
  i.value = '';
  setTimeout(function () {
    var r = buildReply(v);
    appendMsg('them', r.text, !!r.guide);
  }, 900);
}

function sendQuick(t) {
  appendMsg('me', t);
  setTimeout(function () {
    var r = buildReply(t);
    appendMsg('them', r.text, !!r.guide);
  }, 800);
}

function showToast(type, title, msg) {
  var c = document.getElementById('toast-container');
  var icons = { success: '✓', warning: '⚠', danger: '✕', info: 'ℹ' };
  var t = document.createElement('div');
  t.className = 'ds-toast ' + type;
  t.innerHTML = '<span class="ico">' + icons[type] + '</span><div class="msg"><strong>' + title + '</strong>' + (msg ? '<div style="font-size:11px;opacity:.7;margin-top:2px;">' + msg + '</div>' : '') + '</div><button class="close" onclick="this.parentElement.remove()">×</button>';
  c.appendChild(t);
  setTimeout(function () { t.remove(); }, 4000);
}

// ---------- 首次使用完整免责声明（V20-L 设计文档 §4.4） ----------
var DISCLAIMER_SEEN_KEY = 'lingjing_v5210_chat_disclaimer_seen';
function showFirstUseDisclaimer() {
  var seen = null;
  try { seen = localStorage.getItem(DISCLAIMER_SEEN_KEY); } catch (e) {}
  if (seen === '1') return;
  var mask = document.createElement('div');
  mask.className = 'disc-mask';
  var dlg = document.createElement('div');
  dlg.className = 'disc-dialog';
  dlg.innerHTML =
    '<h3>开始之前，请先了解</h3>' +
    '<div class="dd-body">' +
    '<b>1. 角色非真人</b><br>心屿的所有角色均由 AI 生成与驱动，TA 的话不代表任何真实人物的观点。<br><br>' +
    '<b>2. 虚拟陪伴</b><br>角色提供的是情感陪伴体验，不能替代真实的人际关系与专业帮助。<br><br>' +
    '<b>3. 专业问题请找专业人士</b><br>涉及医疗诊断、法律意见、心理治疗等问题时，角色会引导你咨询专业人士：<br>' +
    '🚑 急救：120　⚖️ 法律援助：12348　💌 心理援助：12356<br><br>' +
    '<b>4. 未成年人禁止使用</b><br>本应用仅面向成年人，未成年人请在监护人陪同下离开本页。<br><br>' +
    '<b>5. 记忆与隐私</b><br>对话记忆仅存储在你本地设备，可随时在「我的-设置」中清除。' +
    '</div>' +
    '<button class="dd-btn">我已阅读并同意</button>';
  mask.appendChild(dlg);
  document.body.appendChild(mask);
  dlg.querySelector('.dd-btn').addEventListener('click', function () {
    try { localStorage.setItem(DISCLAIMER_SEEN_KEY, '1'); } catch (e) {}
    mask.remove();
  });
}

// ---------- 初始化 ----------
function initChat() {
  currentChar = resolveChar();
  // 头部
  var nameEl = document.getElementById('chat-name');
  var stageEl = document.getElementById('chat-stage');
  var occEl = document.getElementById('chat-occ');
  var avEl = document.getElementById('chat-avatar');
  if (nameEl) nameEl.textContent = currentChar.name;
  if (stageEl) stageEl.textContent = currentChar.stage || '熟悉';
  if (occEl) occEl.textContent = currentChar.occupation || '陪伴者';
  if (avEl) avEl.textContent = (currentChar.name || '灵').charAt(0);
  // V20-L 铁律 12：双生角色显示「进入 TA 的世界」
  var worldBtn = document.getElementById('chat-world-btn');
  if (worldBtn && currentChar.source_type === 'novel_brought_out' && currentChar.novel_id) {
    worldBtn.style.display = '';
    worldBtn.href = 'plot-runner.html?novelId=' + currentChar.novel_id + '&characterId=' + currentChar.id;
  }
  // 快捷回复（含职业问答入口）
  var quick = document.getElementById('chat-quick');
  if (quick) {
    quick.innerHTML = '';
    var chips = ['😘 想你了', '🎵 陪我听首歌', '💼 问问你的职业', '🫂 抱抱', '🌙 今天过得怎么样'];
    chips.forEach(function (c) {
      var b = document.createElement('button');
      b.textContent = c;
      b.addEventListener('click', function () { sendQuick(c.replace(/^[^ ]+ /, '')); });
      quick.appendChild(b);
    });
  }
  // AI 主动发送第一条消息（V20-L 设计文档 §4.4）
  appendMsg('them', currentChar.preview || ('你好，我是' + currentChar.name + '。很高兴见到你。'));
  showFirstUseDisclaimer();
  try { console.log('[v20 chat] 加载完成 · 角色 ' + currentChar.name); } catch (e) {}
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initChat);
} else {
  initChat();
}
</script>
</body>
