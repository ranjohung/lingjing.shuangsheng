<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵境 · 双生 · 剧情对话运行 · v5.14</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #08071a; color: #edf1f6;
    font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  img { -webkit-user-drag: none; }

  /* ============= 顶部菜单栏（沉浸剧情经典） ============= */
  .plot-topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: 50px;
    background: linear-gradient(180deg, rgba(8,7,26,.92), rgba(8,7,26,.55));
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; gap: 12px;
  }
  .tb-left { display: flex; align-items: center; gap: 14px; }
  .tb-back {
    font-size: 12px; color: rgba(255,255,255,.85);
    padding: 5px 12px; border-radius: 9999px;
    border: 1px solid rgba(255,209,128,.4);
    background: rgba(255,209,128,.08);
    transition: all .2s;
  }
  .tb-back:hover { background: rgba(255,209,128,.18); color: #ffd980; }
  .tb-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px; font-weight: 600;
    color: #fff;
    letter-spacing: .04em;
    max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tb-right { display: flex; align-items: center; gap: 6px; }
  .tb-btn {
    font-size: 12px; color: rgba(255,255,255,.78);
    padding: 6px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    cursor: pointer;
    transition: all .2s;
  }
  .tb-btn:hover { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.25); }
  .tb-btn.on { background: rgba(110,198,255,.18); color: #6ec6ff; border-color: rgba(110,198,255,.4); }

  /* ============= 数值面板 ============= */
  .plot-stats {
    position: fixed; top: 64px; right: 14px; z-index: 50;
    width: 180px;
    padding: 12px 14px;
    background: rgba(20,18,46,.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    color: #fff;
    font: 12px/1.6 'Noto Sans SC';
  }
  .stats-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #ffd980; letter-spacing: .04em; }
  .stats-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .stats-row b { font-weight: 700; }
  .stats-cov { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; }
  .cov-line { color: rgba(255,255,255,.78); margin-bottom: 2px; }
  .cov-ok { color: #7cf6c0; margin-top: 4px; }
  .cov-warn { color: #f6a6d8; margin-top: 4px; }
  .stats-jump { display: flex; gap: 6px; margin-top: 10px; }
  .stats-jump button {
    flex: 1;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: #fff; border-radius: 6px;
    padding: 5px 6px; font-size: 11px; cursor: pointer;
    transition: all .2s;
  }
  .stats-jump button:hover { background: rgba(255,255,255,.14); }

  /* ============= 场景层（全屏背景图） ============= */
  .plot-scene {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    background-color: #08071a;
    transition: background-image .8s ease-in-out;
    opacity: 0;
    animation: scene-fade-in .8s ease-out forwards;
  }
  @keyframes scene-fade-in { to { opacity: 1; } }
  .plot-scene::after {
    /* 底部渐变遮罩，让对话框更清晰 */
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(8,7,26,.5) 75%, rgba(8,7,26,.85) 100%);
    pointer-events: none;
  }
  .plot-scene.fade-in { animation: scene-fade-in .8s ease-out forwards; }

  /* ============= 立绘层 ============= */
  .plot-chars {
    position: fixed; inset: 0; z-index: 5;
    pointer-events: none;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 30vh; /* 立绘脚部落在对话框上方 */
  }
  .plot-chars[data-layout="single"] { gap: 0; }
  .plot-chars[data-layout="double"] { gap: 0; padding: 0 6vw 30vh; justify-content: space-between; }
  .portrait {
    height: 60vh; max-height: 560px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    opacity: 0;
    animation: portrait-in .6s ease-out forwards;
    filter: drop-shadow(0 12px 32px rgba(0,0,0,.7));
  }
  @keyframes portrait-in {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .portrait.fade-in { animation: portrait-in .6s ease-out forwards; }
  .portrait.pos-center { width: 28vw; max-width: 360px; }
  .portrait.pos-left { width: 26vw; max-width: 320px; transform: translateX(-3vw); }
  .portrait.pos-right { width: 26vw; max-width: 320px; transform: translateX(3vw); }
  .portrait-img {
    max-height: 100%; max-width: 100%;
    object-fit: contain;
    border-radius: 12px;
    pointer-events: none;
  }
  .portrait-placeholder {
    width: 240px; height: 360px;
    background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(139,124,246,.18));
    border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff;
    font: 18px 'Noto Serif SC', serif;
  }
  .pp-name { font-weight: 600; }
  .pp-role { font-size: 12px; margin-top: 8px; opacity: .8; letter-spacing: .2em; }

  /* ============= 章节标题卡（沉浸剧情式） ============= */
  .chapter-title-card {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .6s;
  }
  .chapter-title-card.show { opacity: 1; }
  .ctc-frame {
    background: rgba(8,7,26,.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,209,128,.4);
    padding: 24px 48px;
    border-radius: 4px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
  }
  .ctc-bar { height: 2px; width: 80px; background: linear-gradient(90deg, transparent, #ffd980, transparent); }
  .ctc-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px; font-weight: 600;
    color: #ffd980;
    letter-spacing: .15em;
    text-align: center;
  }

  /* ============= 对话框（沉浸剧情经典） ============= */
  .plot-dlg {
    position: fixed; left: 5vw; right: 5vw; bottom: 2vh;
    z-index: 10;
    min-height: 28vh; max-height: 38vh;
    background: linear-gradient(180deg, rgba(11,9,31,.92), rgba(11,9,31,.85));
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,209,128,.35);
    border-radius: 4px; /* 沉浸剧情方角风格 */
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,209,128,.08);
    padding: 0 28px 18px;
    color: #fff;
    display: flex; flex-direction: column;
    opacity: 0;
    animation: dlg-in .5s ease-out .2s forwards;
    cursor: pointer;
  }
  @keyframes dlg-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .plot-dlg.fade-in { animation: dlg-in .5s ease-out forwards; }

  /* 名字条（顶部，沉浸剧情经典黑底金边） */
  .dlg-namebar {
    display: flex; align-items: center; gap: 12px;
    height: 40px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,209,128,.2);
    margin: 0 -28px 14px;
    padding: 0 28px;
  }
  .dlg-name {
    display: inline-block;
    font-family: 'Noto Serif SC', serif;
    font-size: 18px; font-weight: 600;
    color: #f6a6d8;
    padding: 4px 14px;
    background: linear-gradient(180deg, #2a1a3e, #1a0e2e);
    border: 1.5px solid;
    border-image: linear-gradient(180deg, #f6a6d8, #8b7cf6) 1;
    border-radius: 2px;
    letter-spacing: .12em;
  }
  .dlg-tag { display: flex; gap: 6px; align-items: center; }
  .hl-badge {
    background: rgba(255,209,128,.16); color: #ffd980;
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500;
    letter-spacing: .12em;
    border: 1px solid rgba(255,209,128,.3);
  }
  .dlg-chap {
    margin-left: auto;
    font-size: 11px; color: rgba(255,255,255,.4);
    letter-spacing: .12em;
  }

  /* 正文（typewriter） */
  .dlg-text {
    flex: 1; overflow-y: auto;
    font-family: 'Noto Serif SC', serif;
    font-size: 17px; line-height: 2;
    color: #f6f1e0;
    letter-spacing: .05em;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    white-space: pre-wrap;
    padding-right: 8px;
    min-height: 60px;
  }
  .dlg-text::-webkit-scrollbar { width: 4px; }
  .dlg-text::-webkit-scrollbar-thumb { background: rgba(255,209,128,.4); border-radius: 2px; }

  /* 继续提示 ▼ 闪烁 */
  .dlg-continue {
    position: absolute; right: 28px; bottom: 12px;
    color: #ffd980; font-size: 18px;
    animation: continue-blink 1.4s ease-in-out infinite;
    pointer-events: none;
    display: none;
  }
  @keyframes continue-blink {
    0%, 100% { opacity: .4; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(4px); }
  }

  /* 选项按钮（沉浸剧情蓝绿色） */
  .dlg-options {
    margin-top: 14px;
    display: grid; gap: 8px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 720px) and (orientation: landscape) {
    .dlg-options { grid-template-columns: repeat(2, 1fr); }
  }
  .opt-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(40,80,140,.85), rgba(20,40,80,.85));
    border: 1.5px solid rgba(110,198,255,.6);
    border-radius: 4px;
    color: #fff;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    transition: all .2s;
    opacity: 0; transform: translateY(8px);
    position: relative;
  }
  .opt-btn.show { opacity: 1; transform: translateY(0); transition: all .3s ease-out; }
  .opt-btn:hover {
    background: linear-gradient(180deg, rgba(60,140,220,.9), rgba(40,90,180,.9));
    border-color: #6ec6ff;
    transform: translateX(4px);
    box-shadow: 0 4px 12px rgba(110,198,255,.3);
  }
  .opt-num {
    flex-shrink: 0;
    width: 24px; height: 24px;
    background: #ffd980; color: #1a0e2e;
    border-radius: 50%;
    font-weight: 700; font-size: 13px;
    display: grid; place-items: center;
  }
  .opt-label { flex: 1; line-height: 1.5; }
  .fx-tags { display: flex; gap: 4px; flex-shrink: 0; }
  .fx-tag {
    font-size: 11px; padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.85);
    border: 1px solid rgba(255,255,255,.15);
  }
  .fx-trust { color: #6ec6ff; border-color: rgba(110,198,255,.4); }
  .fx-int   { color: #f6a6d8; border-color: rgba(246,166,216,.4); }
  .fx-rep   { color: #7cf6c0; border-color: rgba(124,246,192,.4); }

  /* ============= 结局模态 ============= */
  .plot-end-modal {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(12px);
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity .4s;
  }
  .plot-end-modal.show { opacity: 1; }
  .end-card {
    background: linear-gradient(180deg, rgba(28,25,57,.96), rgba(11,9,31,.96));
    border: 1px solid rgba(255,209,128,.4);
    border-radius: 8px;
    padding: 36px 40px 28px;
    max-width: 540px; width: 90%;
    color: #fff;
    text-align: center;
    box-shadow: 0 32px 80px rgba(0,0,0,.7);
    position: relative;
  }
  .end-deco {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
  }
  .end-rarity {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px; font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
  }
  .end-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px; font-weight: 700;
    margin: 12px 0 6px;
    color: #ffd980;
    letter-spacing: .06em;
  }
  .end-scene { font-size: 12px; opacity: .65; margin-bottom: 18px; }
  .end-quote {
    font: italic 16px/1.8 'Noto Serif SC', serif;
    color: rgba(255,255,255,.85);
    margin: 18px 24px 24px;
    padding: 16px;
    background: rgba(255,209,128,.05);
    border-left: 2px solid #ffd980;
    border-radius: 2px;
    text-align: left;
  }
  .end-stats {
    display: flex; justify-content: center; gap: 24px;
    margin: 12px 0 24px;
    font-size: 13px; opacity: .85;
  }
  .end-stats b { font-weight: 700; margin-left: 4px; }
  .end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .end-btn {
    padding: 9px 18px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.04);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .end-btn:hover { background: rgba(255,255,255,.12); }
  .end-btn.primary { border-width: 1.5px; }

  /* ============= 通用模态（历史/存档/设置） ============= */
  .plot-modal {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity .3s;
  }
  .plot-modal.show { opacity: 1; }
  .modal-card {
    background: linear-gradient(180deg, rgba(28,25,57,.98), rgba(11,9,31,.98));
    border: 1px solid rgba(255,209,128,.35);
    border-radius: 8px;
    max-width: 720px; width: 90%; max-height: 80vh;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,.7);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,209,128,.2);
  }
  .modal-title { font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 600; color: #ffd980; }
  .modal-close {
    background: transparent; border: none; color: rgba(255,255,255,.5);
    font-size: 18px; cursor: pointer; padding: 0; width: 28px; height: 28px;
  }
  .modal-close:hover { color: #fff; }
  .modal-body { padding: 18px 20px; overflow-y: auto; }

  /* 历史列表 */
  .hist-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .hist-item {
    padding: 10px 14px;
    background: rgba(255,255,255,.04);
    border-left: 2px solid rgba(255,209,128,.4);
    border-radius: 4px;
    font: 13px/1.6 'Noto Sans SC';
  }
  .hist-time { font-size: 11px; color: rgba(255,255,255,.4); margin-bottom: 4px; }
  .hist-speaker { color: #ffd980; font-weight: 600; margin-right: 6px; }
  .hist-text { color: rgba(255,255,255,.85); }

  /* 存档槽位 */
  .slot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .slot {
    padding: 12px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px;
  }
  .slot-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .slot-time { font-size: 11px; color: rgba(255,255,255,.5); }
  .slot-empty { font-size: 11px; color: rgba(255,255,255,.35); }
  .slot-info { font-size: 12px; color: rgba(255,255,255,.85); margin-bottom: 8px; min-height: 16px; }
  .slot-actions { display: flex; gap: 6px; }
  .slot-btn {
    flex: 1; font-size: 11px;
    padding: 5px 8px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
  }
  .slot-btn:hover { background: rgba(255,255,255,.14); }
  .slot-btn.danger { border-color: rgba(255,126,138,.4); color: #ff7e8a; }
  .slot-btn.primary { background: rgba(110,198,255,.16); border-color: rgba(110,198,255,.4); color: #6ec6ff; }

  /* 设置 */
  .set-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .set-row:last-child { border-bottom: none; }
  .set-label { flex-shrink: 0; width: 90px; font-size: 13px; color: rgba(255,255,255,.85); }
  .set-toggle {
    padding: 6px 14px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .set-toggle.on { background: rgba(110,198,255,.18); border-color: rgba(110,198,255,.4); color: #6ec6ff; }

  /* Toast */
  .plot-toast {
    position: fixed; left: 50%; top: 70px;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(20,18,46,.95);
    border: 1px solid rgba(255,209,128,.4);
    color: #fff;
    padding: 10px 22px;
    border-radius: 9999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 100;
    opacity: 0;
    transition: opacity .3s, transform .3s;
  }
  .plot-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============= v5.16: 选项 fx 弹窗（沉浸剧情：选择后才揭示增减） ============= */
  .plot-fx-toast {
    position: fixed; left: 50%; top: 30%; transform: translateX(-50%) translateY(-20px) scale(.92);
    z-index: 80; opacity: 0; transition: opacity .3s, transform .4s cubic-bezier(.22,.61,.36,1);
    pointer-events: none;
  }
  .plot-fx-toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
  .fx-toast-inner {
    width: min(360px, 88vw);
    background: linear-gradient(180deg, rgba(28,18,52,.96), rgba(11,8,28,.96));
    border: 1px solid rgba(255,209,128,.45);
    border-radius: 14px;
    padding: 16px 18px 12px;
    box-shadow: 0 20px 56px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05) inset;
  }
  .fx-toast-head { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
  .fx-toast-head .fx-quote { font-size: 12px; color: #ffd180; font-style: italic; line-height: 1.5; }
  .fx-toast-list { display: flex; flex-direction: column; gap: 6px; }
  .fx-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px;
    background: rgba(255,255,255,.04);
    font-size: 13px;
    animation: fx-row-in .4s ease-out;
  }
  .fx-row.fx-pos { background: rgba(91,197,160,.12); border-left: 3px solid #5bc5a0; }
  .fx-row.fx-neg { background: rgba(216,91,142,.12); border-left: 3px solid #d85b8e; }
  .fx-icon { width: 18px; text-align: center; font-size: 14px; }
  .fx-row.fx-pos .fx-icon { color: #5bc5a0; }
  .fx-row.fx-neg .fx-icon { color: #ff9eb8; }
  .fx-name { flex: 0 0 auto; min-width: 38px; color: #fff; font-weight: 600; letter-spacing: .12em; }
  .fx-arrow { color: #9faec2; font-size: 12px; }
  .fx-row.fx-pos .fx-arrow { color: #5bc5a0; }
  .fx-row.fx-neg .fx-arrow { color: #ff9eb8; }
  .fx-delta { font-weight: 700; min-width: 28px; text-align: right; }
  .fx-row.fx-pos .fx-delta { color: #5bc5a0; }
  .fx-row.fx-neg .fx-delta { color: #ff9eb8; }
  .fx-detail { flex: 1; text-align: right; font-size: 11px; color: #9faec2; }
  .fx-detail b { color: #fff; font-weight: 700; margin-left: 2px; }
  .fx-toast-close {
    margin-top: 12px; width: 100%; padding: 9px 0;
    background: linear-gradient(120deg, rgba(216,91,142,.25), rgba(142,91,216,.25));
    border: 1px solid rgba(216,91,142,.45);
    color: #fff; font-size: 13px; border-radius: 8px;
    cursor: pointer; font-family: inherit;
    transition: filter .15s;
  }
  .fx-toast-close:hover { filter: brightness(1.18); }
  @keyframes fx-row-in {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ============= v5.16: 统一返回箭头 ============= */
  .back-arrow {
    position: fixed; top: 14px; left: 14px; z-index: 60;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px 8px 12px; border-radius: 999px;
    background: rgba(20,18,46,.75); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.15); color: #fff;
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all .2s;
  }
  .back-arrow:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); transform: translateX(-2px); }
  .back-arrow .icon { font-size: 18px; line-height: 1; font-weight: 700; }
  @media (max-width: 768px) {
    .back-arrow { top: 10px; left: 10px; padding: 7px 12px 7px 10px; font-size: 12px; }
  }

  /* ============= 空态（没传 novelId） ============= */
  .empty-state {
    position: fixed; inset: 0;
    background: radial-gradient(60% 60% at 50% 50%, #1c1939, #08071a 70%);
    display: grid; place-items: center; z-index: 100;
  }
  .empty-state .inner {
    padding: 32px; text-align: center;
    background: rgba(20,18,46,.85);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    max-width: 480px;
  }
  .empty-state .inner .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state .inner h1 { font-family: 'Noto Serif SC', serif; font-size: 22px; margin: 0 0 8px; color: #ffd980; }
  .empty-state .inner p { font-size: 13px; color: rgba(255,255,255,.65); line-height: 1.7; margin: 4px 0; }
  .empty-state .inner .actions { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
  .empty-state .inner .actions a {
    padding: 8px 18px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.04);
    font-size: 13px;
    transition: all .2s;
  }
  .empty-state .inner .actions a:hover { background: rgba(255,255,255,.14); color: #fff; }
  .empty-state .inner .actions .primary {
    background: linear-gradient(120deg, #8b7cf6, #6ec6ff);
    color: #08071a; border-color: transparent; font-weight: 600;
  }
  .empty-state .inner .actions .primary:hover { transform: scale(1.04); color: #08071a; }
</style>
</head>
<body>

<!-- 空态（没传 novelId 时显示） -->
<div id="empty" class="empty-state" style="display:none;">
  <div class="inner">
    <div class="emoji">📖</div>
    <h1>请选择一本小说进入游戏</h1>
    <p>从小说世界页挑选，或上传你的第一本</p>
    <p>对应题材的游戏将根据你的小说自动生成</p>
    <div class="actions">
      <a href="library.html">回到小说世界</a>
      <a class="primary" href="novel-upload.html">＋ 上传小说</a>
    </div>
  </div>
</div>

<!-- PlotEngine 注入：topbar / stats / scene / chars / dlg / end-modal / modal / toast -->
<div id="runner-root"></div>

<script src="js/genres.js"></script>
<script src="js/novel-store.js"></script>
<script src="js/novel-parser.js"></script>
<script src="js/plot-schema.js"></script>
<script src="js/audiofx.js"></script>
<script src="js/plot-engine.js"></script>
<script src="js/demo-seed.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const novelId = params.get('novelId');
  const root = document.getElementById('runner-root');

  // 没传 novelId → 显示空态
  if (!novelId) {
    document.getElementById('empty').style.display = 'grid';
    return;
  }

  DemoSeed.ensure();
  const plot = NovelStore.loadNovel(novelId);
  if (!plot) {
    document.getElementById('empty').style.display = 'grid';
    document.querySelector('#empty .inner').innerHTML =
      '<div class="emoji">⚠️</div>' +
      '<h1>没找到这本小说</h1>' +
      '<p>可能已被删除，或参数错误</p>' +
      '<div class="actions"><a class="primary" href="library.html">回到小说世界</a></div>';
    return;
  }

  // 加载存档（如果有）
  // 这里不主动加载，由玩家手动从读档界面选

  // 首次审计
  if (!plot.audit) {
    plot.audit = NovelParser.runAudit({
      chars: plot.chars,
      chapters: plot.novel.chapters,
      highlights: plot.highlights || [],
      nodes: Object.values(plot.nodes),
      endings: plot.endings
    });
    NovelStore.saveNovel(plot);
  }

  // 启动引擎
  PlotEngine.init(plot, root, {
    onEnd: () => { location.href = 'library.html'; }
  });
})();
</script>
</body>
</html>
