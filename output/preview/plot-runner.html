<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小说世界 · 灵境 · 双生</title>
<meta name="description" content="v18.0 · plot-runner 沉浸页 · 6 层叠加（场景/立绘/对话框/选项/工具栏/属性）+ 30ms 打字机 + 选项悬浮 + 数值跳动 + 地图 + 存档 + 6 类结局" />
<meta name="theme-color" content="#1A1A2E" />
<style>
/* =================================================================
 * 灵境 · 双生 V18.0 — 小说世界游戏（plot-runner 沉浸页）
 * 6 层叠加：背景 / 立绘 / 对话框 / 选项 / 工具栏 / 属性
 * z-index: 1 背景 / 2 立绘 / 3 对话框 / 4 选项 / 5 工具栏 / 6 属性面板 / 7 弹窗
 * ================================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit}

/* ---------- 沉浸舞台 ---------- */
#plot-stage{
  position:fixed;inset:0;
  max-width:480px;margin:0 auto;
  overflow:hidden;
  cursor:pointer;
  background:#000;
}

/* 第 1 层：场景背景 */
.plot-bg{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#2E3A6E,#4A3A8C);
  transition:background .8s ease;
  z-index:1;
}

/* 第 2 层：角色立绘 */
.plot-portrait{
  position:absolute;
  bottom:30%;left:50%;transform:translateX(-50%);
  width:auto;min-width:140px;height:60%;
  max-height:65vh;
  display:flex;align-items:flex-end;justify-content:center;
  font-size:140px;line-height:1;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
  z-index:2;
  opacity:1;
  transition:opacity .4s, filter .4s;
}

/* 第 4 层：数值跳动 */
.plot-popup{
  position:absolute;top:80px;right:20px;
  display:flex;flex-direction:column;gap:8px;
  z-index:4;
  pointer-events:none;
}
.plot-popup-item{
  font-size:16px;font-weight:700;
  padding:6px 14px;border-radius:8px;
  background:rgba(0,0,0,.5);
  animation:popMove 2s cubic-bezier(.16,1,.3,1) forwards;
}
.pop-up{color:#4ECCA3;border:1px solid rgba(78,204,163,.5)}
.pop-down{color:#E94560;border:1px solid rgba(233,69,96,.5)}
@keyframes popMove{
  0%{opacity:0;transform:translateY(8px)}
  10%{opacity:1;transform:none}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(-30px)}
}

/* 第 3 层：对话框 */
.plot-dialog{
  position:absolute;bottom:0;left:0;right:0;
  height:25%;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,.1);
  padding:18px 20px 22px;
  z-index:3;
  display:flex;flex-direction:column;
  /* 顶部纹理 */
}
.plot-dialog::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
}
.plot-name{
  font-size:20px;font-weight:700;color:#fff;
  margin-bottom:8px;
  letter-spacing:.5px;
}
.plot-text{
  flex:1;
  font-size:18px;line-height:1.6;color:#fff;
  overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
}
.plot-continue{
  position:absolute;bottom:14px;right:24px;
  font-size:14px;color:rgba(255,255,255,.6);
  opacity:0;transition:opacity .3s;
  animation:bounceArrow 1.4s ease-in-out infinite;
}
@keyframes bounceArrow{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* 第 4 层：选项按钮 */
.plot-choices{
  position:absolute;
  bottom:30%;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:12px;
  width:60%;
  z-index:4;
}
.plot-choice{
  height:50px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  backdrop-filter:blur(8px);
  cursor:pointer;
  animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;
  transition:transform .15s, background .2s;
}
.plot-choice:active{transform:scale(.96);background:rgba(255,255,255,.2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* 第 5 层：顶部工具栏 */
.plot-toolbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  z-index:5;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
}
.plot-back{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;font-size:18px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
}
.plot-tb-acts{display:flex;gap:10px}
.plot-tb-btn{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
}

/* 右下角功能按钮 */
.plot-func-bar{
  position:absolute;
  bottom:calc(25% + 14px);right:14px;
  display:flex;flex-direction:column;gap:8px;
  z-index:5;
}
.plot-func{
  width:42px;height:42px;border-radius:10px;
  display:grid;place-items:center;font-size:14px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  font-size:11px;font-weight:600;
}

/* 第 6 层：属性面板（默认隐藏） */
.plot-attr-panel{
  position:absolute;top:60px;right:14px;
  padding:12px 14px;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  font-size:12px;color:#fff;
  z-index:6;
  display:none;
}
.plot-attr-panel.open{display:block}
.attr-row{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
.attr-key{color:rgba(255,255,255,.6)}
.attr-val{color:#FFB347;font-weight:700}

/* ---------- 系统菜单（点击"菜单"弹出） ---------- */
.plot-system-menu{
  position:absolute;inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  z-index:50;
  display:none;
  flex-direction:column;justify-content:center;
  padding:40px 24px;
  animation:fadeIn .25s;
}
.plot-system-menu.open{display:flex}
.psm-section-title{
  font-size:12px;color:rgba(255,255,255,.5);
  margin:12px 0 8px;letter-spacing:1px;
}
.psm-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:20px;
}
.psm-btn{
  height:54px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:12px;
  cursor:pointer;
}
.psm-btn:active{transform:scale(.96)}
.psm-ico{font-size:18px}

/* ---------- 存档面板 ---------- */
.plot-save-panel{
  position:absolute;inset:0;
  background:rgba(0,0,0,.85);
  z-index:55;
  display:none;
  flex-direction:column;
  padding:30px 20px;
  animation:fadeIn .25s;
}
.plot-save-panel.open{display:flex}
.plot-save-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.plot-save-head h3{font-size:18px;font-weight:700}
.plot-close-btn{
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:14px;
}
.save-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  flex:1;overflow-y:auto;
  align-content:start;
}
.save-slot{
  height:80px;padding:12px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;gap:4px;
  font-size:12px;color:#fff;
  cursor:pointer;
}
.save-slot.filled{
  background:rgba(78,204,163,.1);
  border-color:rgba(78,204,163,.3);
}
.save-slot b{font-size:13px;font-weight:700}
.save-slot span{color:rgba(255,255,255,.5)}

/* ---------- CG 全屏 ---------- */
.plot-cg{
  position:absolute;inset:0;
  z-index:60;
  background:#000;
  display:none;
  align-items:center;justify-content:center;
  flex-direction:column;
}
.plot-cg.open{display:flex;animation:cgFade .4s}
.plot-cg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.7) 100%);
}
.cg-title{
  position:relative;
  font-size:32px;font-weight:700;color:#fff;
  letter-spacing:2px;
  text-shadow:0 4px 16px rgba(0,0,0,.6);
  animation:cgTitleIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes cgFade{from{opacity:0}to{opacity:1}}
@keyframes cgTitleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- 地图模式 ---------- */
.plot-map{
  position:absolute;inset:0;
  z-index:3;
  display:none;
  background:linear-gradient(160deg,#2E3A6E,#4A3A8C);
}
#plot-stage.map-mode .plot-portrait{opacity:0}
#plot-stage.map-mode .plot-dialog{opacity:0}
#plot-stage.map-mode .plot-popup{opacity:0}
#plot-stage.map-mode .plot-choices{opacity:0}
#plot-stage.map-mode .plot-map{display:block}
.plot-map-bg{
  position:absolute;inset:0;
  background-image:linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.04) 75%);
  background-size:30px 30px;
}
.plot-map-content{
  position:relative;
  height:100%;
  display:flex;align-items:center;justify-content:center;
}
.plot-map-center{
  font-size:80px;
  filter:drop-shadow(0 0 16px rgba(233,69,96,.5));
}
.plot-map-buildings{
  position:absolute;inset:0;
  display:flex;justify-content:space-around;align-items:flex-start;
  padding-top:60px;
}
.plot-map-bldg{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  font-size:13px;color:#fff;
  cursor:pointer;
  transition:transform .15s;
}
.plot-map-bldg:active{transform:scale(.94)}
.plot-map-bldg span{font-size:28px}

/* ---------- 免责声明（底部常驻） ---------- */
.plot-disclaimer{
  position:absolute;bottom:0;left:0;right:0;
  padding:6px 16px calc(6px + env(safe-area-inset-bottom));
  font-size:9px;color:rgba(255,255,255,.4);
  text-align:center;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
  z-index:3;
  pointer-events:none;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 隐藏系统菜单和存档面板时仍能点击舞台推进 */
#plot-stage:not(.menu-open) .plot-dialog{cursor:pointer}
</style>
</head>
<body>

<div id="plot-stage">

  <!-- 第 1 层：场景背景 -->
  <div class="plot-bg" id="plot-bg"></div>

  <!-- 地图模式（全屏） -->
  <div class="plot-map" id="plot-map">
    <div class="plot-map-bg"></div>
    <div class="plot-map-content">
      <div class="plot-map-buildings">
        <div class="plot-map-bldg" data-b="后宫"><span>🏯</span>后宫</div>
        <div class="plot-map-bldg" data-b="御书房"><span>📜</span>御书房</div>
        <div class="plot-map-bldg" data-b="演武场"><span>⚔️</span>演武场</div>
      </div>
      <div class="plot-map-center">🏯</div>
      <div class="plot-map-buildings" style="bottom:80px;top:auto;align-items:flex-end;padding-top:0;padding-bottom:60px;">
        <div class="plot-map-bldg" data-b="市集"><span>🏪</span>市集</div>
        <div class="plot-map-bldg" data-b="农田"><span>🌾</span>农田</div>
        <div class="plot-map-bldg" data-b="酒楼"><span>🍶</span>酒楼</div>
      </div>
    </div>
  </div>

  <!-- 第 2 层：角色立绘 -->
  <div class="plot-portrait" id="plot-portrait">🌙</div>

  <!-- 第 4 层：数值跳动 -->
  <div class="plot-popup" id="plot-popup"></div>

  <!-- 第 3 层：对话框 -->
  <div class="plot-dialog">
    <div class="plot-name" id="plot-name">旁白</div>
    <div class="plot-text" id="plot-text"></div>
    <span class="plot-continue" id="plot-continue">点击继续 ›</span>
  </div>

  <!-- 第 5 层：顶部工具栏 -->
  <div class="plot-toolbar">
    <button class="plot-back" id="plot-back" title="返回">←</button>
    <div class="plot-tb-acts">
      <button class="plot-tb-btn" id="plot-collapse" title="收起">^</button>
      <button class="plot-tb-btn" id="plot-menu" title="菜单">☰</button>
      <button class="plot-tb-btn" id="plot-world" title="地图">🌐</button>
      <button class="plot-tb-btn" id="plot-fav" title="收藏">★</button>
      <button class="plot-tb-btn" id="plot-share" title="分享">↗</button>
      <button class="plot-tb-btn" id="plot-shot" title="截图">📷</button>
    </div>
  </div>

  <!-- 功能按钮（右下角） -->
  <div class="plot-func-bar">
    <button class="plot-func" data-fn="auto" title="自动">自动</button>
    <button class="plot-func" data-fn="speed" title="快进">快进</button>
    <button class="plot-func" data-fn="save" title="存档">存档</button>
    <button class="plot-func" data-fn="load" title="读档">读档</button>
    <button class="plot-func" data-fn="history" title="回放">回放</button>
  </div>

  <!-- 第 4 层：选项按钮 -->
  <div class="plot-choices" id="plot-choices"></div>

  <!-- 第 6 层：属性面板 -->
  <div class="plot-attr-panel" id="plot-attr-panel">
    <div class="attr-row"><span class="attr-key">亲密</span><span class="attr-val" id="attr-intimacy">0</span></div>
    <div class="attr-row"><span class="attr-key">信任</span><span class="attr-val" id="attr-trust">0</span></div>
    <div class="attr-row"><span class="attr-key">金钱</span><span class="attr-val">100 灵晶</span></div>
    <div class="attr-row"><span class="attr-key">才艺</span><span class="attr-val">35</span></div>
    <div class="attr-row"><span class="attr-key">魅力</span><span class="attr-val">42</span></div>
    <div class="attr-row"><span class="attr-key">声望</span><span class="attr-val">15</span></div>
  </div>

  <!-- 系统菜单（点击"菜单"弹出） -->
  <div class="plot-system-menu" id="plot-system-menu">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="font-size:18px;font-weight:700">系统菜单</h3>
      <button class="plot-close-btn" onclick="document.getElementById('plot-system-menu').classList.remove('open')">✕</button>
    </div>
    <div class="psm-section-title">顶层</div>
    <div class="psm-grid">
      <div class="psm-btn" onclick="window.LJPlot && (window.LJPlot.toggleSystemMenu(), document.querySelector('[data-fn=save]').click())"><span class="psm-ico">💾</span>存档</div>
      <div class="psm-btn" onclick="window.LJPlot && (window.LJPlot.toggleSystemMenu(), document.querySelector('[data-fn=load]').click())"><span class="psm-ico">📂</span>读档</div>
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','回放','即将开放')"><span class="psm-ico">⏪</span>回放</div>
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','设置','即将开放')"><span class="psm-ico">⚙️</span>设置</div>
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','商城','即将开放')"><span class="psm-ico">🛒</span>商城</div>
    </div>
    <div class="psm-section-title">底层</div>
    <div class="psm-grid">
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','任务','即将开放')"><span class="psm-ico">📜</span>任务</div>
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','福利','即将开放')"><span class="psm-ico">🎁</span>福利</div>
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','仓库','即将开放')"><span class="psm-ico">📦</span>仓库</div>
      <div class="psm-btn" onclick="window.LJToast && window.LJToast.show('warn','衣柜','即将开放')"><span class="psm-ico">👗</span>衣柜</div>
      <div class="psm-btn" onclick="document.getElementById('plot-attr-panel').classList.toggle('open');window.LJPlot && window.LJPlot.toggleSystemMenu()"><span class="psm-ico">📊</span>属性</div>
    </div>
  </div>

  <!-- 存档/读档面板 -->
  <div class="plot-save-panel" id="plot-save-panel">
    <div class="plot-save-head">
      <h3>存档 / 读档（10 槽）</h3>
      <button class="plot-close-btn" onclick="document.getElementById('plot-save-panel').classList.remove('open')">✕</button>
    </div>
    <div class="save-grid"></div>
  </div>

  <!-- CG 全屏 -->
  <div class="plot-cg" id="plot-cg">
    <div class="cg-title"></div>
  </div>

  <!-- 免责声明（底部常驻） -->
  <div class="plot-disclaimer">⚠ AI 生成内容仅供参考，不构成医疗、法律、心理咨询建议。</div>

</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:86vw"></div>

<script src="js/plot-runner.js"></script>
<script>
window.LJToast = window.LJToast || {
  show: function(kind, title, msg){
    var c = document.getElementById('toast');
    if (!c) return;
    var t = document.createElement('div');
    t.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-size:13px;background:rgba(28,37,66,.96);border:1px solid rgba(255,255,255,.15);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .35s cubic-bezier(.16,1,.3,1) both';
    t.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:' + (kind === 'ok' ? '#4ECCA3' : '#FFB347') + '"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
    c.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3000);
  }
};
// 地图建筑点击进入子场景
document.querySelectorAll('.plot-map-bldg').forEach(function(b){
  b.addEventListener('click', function(e){
    e.stopPropagation();
    var name = b.getAttribute('data-b');
    if (window.LJToast) window.LJToast.show('warn','进入「'+name+'」','剧情即将触发');
    if (window.LJPlot && window.LJPlot.toggleMapMode) window.LJPlot.toggleMapMode();
  });
});
</script>
</body>
</html>
