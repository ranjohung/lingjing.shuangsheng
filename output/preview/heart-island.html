<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>心屿 · 灵境 · 双生</title>
<meta name="description" content="v18.0 · 心屿功能区 · 5 子标签 + 陪伴子筛选 + [创]/[双] 角色来源角标 + 首次弹窗 + 免责声明 + 职业问答 + 双生[进入世界]按钮" />
<meta name="theme-color" content="#1A1A2E" />
<link rel="stylesheet" href="css/shell-v64.css" />
<style>
/* =================================================================
 * 灵境 · 双生 V18.0 — 心屿功能区样式（5 子标签 + 角色卡片）
 * ================================================================= */
:root {
  --bg:#1A1A2E; --card:#16213E; --card-2:#1C2542;
  --accent:#E94560; --text:#EAEAEA; --sub:#A0A0B0;
  --ok:#4ECCA3; --warn:#FFB347; --xinyu:#6C5CE7; --world:#00B894;
  --line:rgba(255,255,255,.08);
  --radius:12px; --margin:16px;
}

/* ---------- 5 子标签 ---------- */
.heart-sub-nav {
  position: sticky; top: 56px; z-index: 40;
  display: flex; gap: 0;
  background: rgba(26, 26, 46, .88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.heart-sn {
  flex: 1; min-width: 64px;
  padding: 12px 8px;
  font-size: 13px; color: var(--sub);
  text-align: center;
  position: relative;
  cursor: pointer;
  transition: color .2s;
  white-space: nowrap;
}
.heart-sn.active { color: #A29BFE; font-weight: 600; }
.heart-sn.active::after {
  content: ''; position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 24px; height: 2px; border-radius: 1px;
  background: #A29BFE;
}

/* ---------- 陪伴子筛选（仅陪伴显示） ---------- */
.heart-subfilter {
  display: flex; gap: 8px;
  margin: 14px var(--margin);
  padding: 8px;
  background: var(--card-2);
  border-radius: 10px;
}
.hf-chip {
  flex: 1; padding: 6px 10px;
  font-size: 12px;
  text-align: center;
  border-radius: 6px;
  color: var(--sub);
  cursor: pointer;
  transition: all .15s;
}
.hf-chip.active {
  background: #A29BFE;
  color: #1A1A2E;
  font-weight: 600;
}

/* ---------- 角色列表 ---------- */
.char-list {
  display: flex; flex-direction: column;
  gap: 10px;
  margin: 0 var(--margin);
}
.char-card {
  display: flex; gap: 12px;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: transform .15s;
}
.char-card:active { transform: scale(.99); }
.cc-left { flex-shrink: 0; }
.cc-avatar-wrap { position: relative; }
.cc-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 28px;
  background: linear-gradient(135deg, rgba(233,69,96,.2), rgba(108,92,231,.2));
  border: 1px solid var(--line);
}
.src-badge {
  position: absolute; top: -2px; right: -2px;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 9px; font-weight: 700;
  color: #fff;
  border: 1px solid rgba(255,255,255,.15);
}
.src-create { background: rgba(78,204,163,.9); }
.src-shuang { background: rgba(233,69,96,.9); }
.src-official { background: rgba(160,160,176,.5); }
.cc-right { flex: 1; min-width: 0; }
.cc-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.cc-name { font-size: 15px; font-weight: 600; color: var(--text); }
.cc-source { font-size: 11px; color: var(--sub); }
.cc-meta-row { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--sub); margin-bottom: 6px; }
.cc-stage { color: #A29BFE; font-weight: 600; }
.cc-dot { color: rgba(160,160,176,.4); }
.cc-intimacy { color: var(--warn); }
.cc-preview {
  font-size: 12px; color: var(--sub);
  line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.cc-occ-row { margin-bottom: 8px; }
.occ-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: rgba(78,204,163,.1);
  color: var(--ok);
  border: 1px solid rgba(78,204,163,.25);
}
.cc-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.card-btn {
  flex: 1; min-width: 80px;
  height: 34px;
  border-radius: 8px;
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform .15s;
}
.card-btn:active { transform: scale(.96); }
.card-btn-chat {
  background: linear-gradient(135deg, var(--xinyu), #5849c2);
  color: #fff;
  box-shadow: 0 4px 12px rgba(108,92,231,.3);
}
.card-btn-world {
  background: rgba(255,255,255,.06);
  color: var(--text);
  border: 1px solid var(--line);
}

/* ---------- 创建新角色按钮 ---------- */
.heart-create {
  display: flex;
  margin: 14px var(--margin);
  height: 48px;
  border-radius: var(--radius);
  background: rgba(108,92,231,.1);
  border: 1px dashed rgba(108,92,231,.4);
  color: #A29BFE;
  font-size: 14px; font-weight: 600;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform .15s;
}
.heart-create:active { transform: scale(.98); }

/* ---------- 精选双列瀑布流 ---------- */
.featured-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0 var(--margin);
}
.feat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  cursor: pointer;
}
.fc-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 28px;
  margin: 0 auto 8px;
  background: linear-gradient(135deg, rgba(233,69,96,.2), rgba(108,92,231,.2));
  border: 1px solid var(--line);
}
.fc-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.fc-occ { font-size: 11px; color: var(--ok); margin-bottom: 6px; }
.fc-intro { font-size: 11px; color: var(--sub); line-height: 1.4; min-height: 30px; }
.fc-meta { font-size: 10px; color: var(--warn); margin-top: 8px; }

/* ---------- 记忆时间线 ---------- */
.mem-list {
  display: flex; flex-direction: column;
  gap: 10px;
  margin: 0 var(--margin);
}
.mem-item {
  display: flex; gap: 12px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.mi-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 20px;
  background: linear-gradient(135deg, rgba(233,69,96,.2), rgba(108,92,231,.2));
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.mi-body { flex: 1; min-width: 0; }
.mi-head {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.mi-name { font-size: 13px; font-weight: 600; }
.mi-type {
  font-size: 9px; padding: 1px 5px; border-radius: 3px;
  background: rgba(160,160,176,.15);
  color: var(--sub);
}
.mi-type.mi-special {
  background: rgba(108,92,231,.2);
  color: #A29BFE;
}
.mi-time { font-size: 10px; color: rgba(160,160,176,.5); margin-left: auto; }
.mi-content { font-size: 12px; color: var(--sub); line-height: 1.5; }

/* ---------- 故事（双生专属） ---------- */
.story-list {
  display: flex; flex-direction: column;
  gap: 10px;
  margin: 0 var(--margin);
}
.story-item {
  display: flex; gap: 12px; align-items: center;
  padding: 12px;
  background: linear-gradient(135deg, rgba(233,69,96,.08), rgba(108,92,231,.06));
  border: 1px solid rgba(233,69,96,.2);
  border-radius: 10px;
}
.si-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 24px;
  background: linear-gradient(135deg, rgba(233,69,96,.2), rgba(108,92,231,.2));
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.si-body { flex: 1; min-width: 0; }
.si-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.si-novel { font-size: 11px; color: var(--sub); margin-bottom: 2px; }
.si-progress { font-size: 10px; color: var(--warn); }
.si-btn {
  flex-shrink: 0;
  padding: 8px 12px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #C73652);
  color: #fff;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(233,69,96,.3);
}

/* ---------- 搜索框 ---------- */
.mem-search-bar {
  display: flex; align-items: center; gap: 10px;
  margin: 14px var(--margin);
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.mem-search-bar input {
  flex: 1; background: none; border: 0; outline: 0;
  color: var(--text); font-size: 14px;
}
.mem-search-bar input::placeholder { color: rgba(160,160,176,.5); }
.hs-ico { color: var(--sub); }

/* ---------- 空状态 ---------- */
.heart-empty {
  margin: 40px var(--margin);
  padding: 40px 20px;
  text-align: center;
  color: var(--sub); font-size: 13px;
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

/* ---------- 弹窗 ---------- */
.heart-dialog-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 80;
  display: grid; place-items: center;
  animation: fadeIn .25s;
}
.heart-dialog {
  width: 86vw; max-width: 420px;
  padding: 22px 22px 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  animation: dialogIn .35s cubic-bezier(.16,1,.3,1);
}
.heart-dialog h3 {
  font-size: 17px; font-weight: 600;
  color: var(--text);
  text-align: center;
  margin-bottom: 14px;
}
.hd-body { font-size: 13px; color: var(--text); line-height: 1.6; }
.hd-btn {
  display: block; margin: 16px auto 0;
  height: 40px; padding: 0 28px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--xinyu), #5849c2);
  color: #fff;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 4px 12px rgba(108,92,231,.3);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes dialogIn { from { opacity: 0; transform: scale(.92) translateY(8px) } to { opacity: 1; transform: none } }

@media (max-width: 380px) {
  .heart-sn { font-size: 12px; padding: 10px 6px; }
  .cc-btns { flex-direction: column; }
  .card-btn { width: 100%; }
}
</style>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-title"><span class="dot"></span>心屿</div>
    <div class="topbar-acts">
      <button class="icon-btn" onclick="window.LJHeart.setSub('search')" title="搜索">🔍</button>
      <button class="icon-btn" onclick="if(window.LJHeart)window.LJHeart.showIntro()" title="查看介绍">ℹ️</button>
      <a class="icon-btn" href="me.html" title="我的">👤</a>
    </div>
  </header>

  <main>
    <nav class="heart-sub-nav" id="heart-sub-nav">
      <div class="heart-sn active" data-sn="accompany">陪伴</div>
      <div class="heart-sn" data-sn="featured">精选</div>
      <div class="heart-sn" data-sn="memories">记忆</div>
      <div class="heart-sn" data-sn="stories">故事</div>
      <div class="heart-sn" data-sn="search">🔍</div>
    </nav>

    <div class="heart-subfilter" id="heart-subfilter">
      <div class="hf-chip active" data-f="all">全部</div>
      <div class="hf-chip" data-f="user_created">我创建的</div>
      <div class="hf-chip" data-f="novel_brought_out">双生角色</div>
    </div>

    <div id="heart-main"></div>

    <div class="heart-create" id="heart-create">+ 创建新角色</div>
  </main>

  <nav class="tabbar" id="tabbar-mount">
    <a class="tab t-home"  href="../product-preview.html"><span class="ico">🏠</span><span>首页</span></a>
    <a class="tab t-world"  href="library.html"><span class="ico">📖</span><span>世界</span></a>
    <a class="tab t-xinyu active" href="heart-island.html"><span class="ico">💬</span><span>心屿</span></a>
    <a class="tab t-create" href="creator-center.html"><span class="ico">✨</span><span>创作</span></a>
    <a class="tab t-me"     href="me.html"><span class="ico">👤</span><span>我的</span></a>
  </nav>
</div>

<div id="toast"></div>

<script src="js/heart-data.js"></script>
<script src="js/heart.js"></script>
<script src="js/tabbar.js"></script>
<script>
window.LJToast = window.LJToast || {
  show: function(kind, title, msg){
    var c = document.getElementById('toast');
    if (!c) return;
    var t = document.createElement('div');
    t.className = 'toast-item ' + (kind || 'ok');
    t.innerHTML = '<span class="ti"></span><span><b>' + title + '</b>' + (msg ? '<span style="opacity:.65"> · ' + msg + '</span>' : '') + '</span>';
    c.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3000);
  }
};
</script>
</body>
</html>
