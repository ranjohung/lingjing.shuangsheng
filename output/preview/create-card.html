<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>创建灵念 · 灵境</title>
<link rel="stylesheet" href="css/shell-v64.css">
<link rel="stylesheet" href="css/mobile-lock.css">
<style>
:root{--bg:#1A1A2E;--card:#16213E;--accent:#E94560;--xinyu:#6C5CE7;--ok:#4ECCA3;--warn:#FFB347;--text:#EAEAEA;--sub:#8A8A9A;--border:#2A2A4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:100px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar .back{font-size:18px;cursor:pointer;color:var(--accent)}
.topbar h1{font-size:17px;font-weight:600}
.topbar .quota{font-size:12px;color:var(--ok);background:rgba(78,202,163,.1);padding:4px 10px;border-radius:12px}
.container{padding:16px}
.section{margin-bottom:24px}
.section-title{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:12px;letter-spacing:1px}
.rarity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rarity-card{padding:12px 4px;border-radius:12px;text-align:center;cursor:pointer;border:2px solid transparent;font-size:10px;font-weight:600;transition:all .2s}
.rarity-card:active,.rarity-card.selected{transform:scale(1.05)}
.rarity-card .rarity-icon{font-size:24px;margin-bottom:4px}
.rarity-card .rarity-name{font-size:10px}
.r-common{background:rgba(150,150,150,.15);border-color:rgba(150,150,150,.3);color:#aaa}
.r-common.selected{border-color:#aaa;background:rgba(150,150,150,.25)}
.r-rare{background:rgba(78,202,163,.1);border-color:rgba(78,202,163,.3);color:var(--ok)}
.r-rare.selected{border-color:var(--ok);background:rgba(78,202,163,.2)}
.r-epic{background:rgba(108,92,231,.1);border-color:rgba(108,92,231,.3);color:var(--xinyu)}
.r-epic.selected{border-color:var(--xinyu);background:rgba(108,92,231,.2)}
.r-legend{background:rgba(255,179,71,.1);border-color:rgba(255,179,71,.3);color:var(--warn)}
.r-legend.selected{border-color:var(--warn);background:rgba(255,179,71,.2)}
.r-limited{background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.3);color:var(--accent)}
.r-limited.selected{border-color:var(--accent);background:rgba(233,69,96,.2)}
.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;min-height:80px;resize:vertical;font-family:inherit}
.form-textarea:focus{border-color:var(--accent)}
.form-label{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.form-label .ai-btn{font-size:11px;color:var(--xinyu);cursor:pointer}
.style-tags{display:flex;flex-wrap:wrap;gap:8px}
.style-tag{padding:8px 14px;background:var(--card);border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);transition:all .2s}
.style-tag.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.card-preview{width:100%;aspect-ratio:3/4;max-width:280px;margin:0 auto;background:linear-gradient(135deg,#1a1a2e,var(--xinyu),var(--accent));border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(108,92,231,.3)}
.card-preview::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.1),transparent 60%);pointer-events:none}
.card-rarity{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.7}
.card-center{text-align:center}
.card-center .card-icon{font-size:64px;margin-bottom:12px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.card-center .card-name{font-size:20px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.card-desc{font-size:11px;line-height:1.5;opacity:.8;text-align:center}
.card-frame{position:absolute;inset:8px;border:1px solid rgba(255,255,255,.15);border-radius:16px;pointer-events:none}
.candidates{margin-top:16px}
.candidate-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.candidate-item:active,.candidate-item.selected{border-color:var(--ok)}
.candidate-item .ci{width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,var(--xinyu),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.candidate-item .cf{flex:1;min-width:0}
.candidate-item .cn{font-size:13px;font-weight:500;margin-bottom:2px}
.candidate-item .cd{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.generate-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center}
.cost-info{font-size:12px;color:var(--warn)}
.cost-info .free{color:var(--ok)}
.btn-gen{flex:1;padding:14px;background:linear-gradient(135deg,var(--accent),var(--xinyu));border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
</style>
<link rel="stylesheet" href="css/tabbar-embed.css">
</head>
<body>
<div class="topbar">
  <span class="back" onclick="history.back()">‹ 返回</span>
  <h1>✨ 创建灵念</h1>
  <span class="quota">今日 1/1 免费</span>
</div>
<div class="container">
  <div class="section">
    <div class="section-title">灵念品质</div>
    <div class="rarity-grid">
      <div class="rarity-card r-common" onclick="selR(this)"><div class="rarity-icon">○</div><div class="rarity-name">普通</div></div>
      <div class="rarity-card r-rare" onclick="selR(this)"><div class="rarity-icon">◇</div><div class="rarity-name">稀有</div></div>
      <div class="rarity-card r-epic selected" onclick="selR(this)"><div class="rarity-icon">◈</div><div class="rarity-name">史诗</div></div>
      <div class="rarity-card r-legend" onclick="selR(this)"><div class="rarity-icon">★</div><div class="rarity-name">传说</div></div>
      <div class="rarity-card r-limited" onclick="selR(this)"><div class="rarity-icon">✦</div><div class="rarity-name">限定</div></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">灵念内容</div>
    <div class="form-label"><span>灵念主题</span><span class="ai-btn" onclick="aiTheme()">✨ AI帮我构思</span></div>
    <textarea class="form-textarea" id="theme" placeholder="描述灵念的主题和意境，例如：月光下两个身影背靠背并肩作战..."></textarea>
    <div id="ai-cands" class="candidates"></div>
  </div>
  <div class="section">
    <div class="section-title">视觉风格</div>
    <div class="style-tags">
      <div class="style-tag selected" onclick="stag(this)">奇幻唯美</div>
      <div class="style-tag" onclick="stag(this)">暗黑哥特</div>
      <div class="style-tag" onclick="stag(this)">赛博未来</div>
      <div class="style-tag" onclick="stag(this)">水墨意境</div>
      <div class="style-tag" onclick="stag(this)">童话梦幻</div>
      <div class="style-tag" onclick="stag(this)">热血战斗</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">灵念箴言</div>
    <div class="form-label"><span>卡牌上的文字</span><span class="ai-btn" onclick="aiQuote()">✨ AI写箴言</span></div>
    <textarea class="form-textarea" id="quote" placeholder="一句简短的灵念箴言..." rows="2"></textarea>
  </div>
  <div class="section">
    <div class="section-title">卡牌预览</div>
    <div class="card-preview">
      <div class="card-frame"></div>
      <div class="card-rarity">◈ EPIC</div>
      <div class="card-center">
        <div class="card-icon" id="previewIcon">⚔️</div>
        <div class="card-name" id="previewName">命运之绊</div>
      </div>
      <div class="card-desc" id="previewDesc">两个灵魂的交汇，在时间的长河中刻下不可磨灭的印记</div>
    </div>
  </div>
</div>
<div class="generate-bar">
  <div class="cost-info"><span class="free">免费额度内</span> · 今日剩余 1 张</div>
  <button class="btn-gen" onclick="genCard()">✨ 生成灵念</button>
</div>
<script>
function selR(e){document.querySelectorAll('.rarity-card').forEach(c=>{c.classList.remove('selected');});e.classList.add('selected')}
function stag(e){[...e.parentElement.children].forEach(c=>c.classList.remove('selected'));e.classList.add('selected')}
function aiTheme(){
  const c=document.getElementById('ai-cands');
  c.innerHTML='<div style="text-align:center;padding:16px;color:var(--xinyu);font-size:13px">AI正在构思灵念意境...</div>';
  setTimeout(()=>{
    const d=[
      {n:'命运之绊',d:'月光下两个身影背靠背并肩作战，星辰为他们作证',i:'⚔️'},
      {n:'永恒之约',d:'时间凝固的瞬间，两枚戒指在光柱中缓缓上升',i:'💍'},
      {n:'破晓之光',d:'废墟中一朵花在晨光中绽放，象征希望的重生',i:'🌅'},
      {n:'深渊凝望',d:'巨大的眼眸在黑暗中睁开，瞳孔中映射着整个宇宙',i:'👁️'}
    ];
    c.innerHTML=d.map(x=>'<div class="candidate-item" onclick="useC(this,\''+x.d+'\',\''+x.n+'\',\''+x.i+'\')"><div class="ci">'+x.i+'</div><div class="cf"><div class="cn">'+x.n+'</div><div class="cd">'+x.d+'</div></div></div>').join('')+'<div style="text-align:center;margin-top:8px"><span style="font-size:12px;color:var(--xinyu);cursor:pointer" onclick="aiTheme()">🔄 换一批</span></div>';
  },1000);
}
function useC(e,desc,name,icon){
  document.querySelectorAll('.candidate-item').forEach(c=>c.classList.remove('selected'));e.classList.add('selected');
  document.getElementById('theme').value=desc;
  document.getElementById('previewName').textContent=name;
  document.getElementById('previewDesc').textContent=desc;
  document.getElementById('previewIcon').textContent=icon;
}
function aiQuote(){
  const quotes=['命运的齿轮已经转动','在时间的尽头，我依然等你','光明与黑暗，不过一念之间','真正的力量，源于守护的决心'];
  document.getElementById('quote').value=quotes[Math.floor(Math.random()*quotes.length)];
}
function genCard(){alert('灵念已生成并保存到你的灵念收藏中！')}
</script>
<script src="js/creator-store.js"></script>
<script src="js/creator-ai.js"></script>
<script src="js/creator-pages.js"></script>
<script src="js/tabbar.js"></script>
</body>
</html>
