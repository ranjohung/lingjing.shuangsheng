<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>法律文档 · 灵境 · 双生</title>
<meta name="theme-color" content="#1A1A2E" />
<link rel="stylesheet" href="css/shell-v64.css" />
<link rel="stylesheet" href="css/mobile-lock.css" />
<style>
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif}
  .lv-head{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:rgba(22,33,62,.95);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .lv-back{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:none;color:#fff;font-size:17px;cursor:pointer;
    display:grid;place-items:center;flex:none;
  }
  .lv-title{flex:1;font:600 16px 'Noto Serif SC';color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv-body{padding:20px 18px 60px;font-size:14px;line-height:1.9;color:rgba(255,255,255,.82)}
  .lv-body h1{font:700 20px 'Noto Serif SC';color:#fff;margin:8px 0 16px}
  .lv-body h2{font:600 17px 'Noto Serif SC';color:#E94560;margin:26px 0 10px}
  .lv-body h3{font:600 15px 'Noto Serif SC';color:#FFB347;margin:20px 0 8px}
  .lv-body p{margin:10px 0}
  .lv-body ul,.lv-body ol{padding-left:22px;margin:10px 0}
  .lv-body li{margin:6px 0}
  .lv-body strong{color:#fff}
  .lv-body blockquote{
    margin:14px 0;padding:10px 14px;border-left:3px solid #6C5CE7;
    background:rgba(108,92,231,.08);border-radius:0 8px 8px 0;color:rgba(255,255,255,.65);font-size:13px;
  }
  .lv-body hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  .lv-loading{text-align:center;padding:60px 0;color:rgba(255,255,255,.4);font-size:13px}
  .lv-error{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5)}
  .lv-error .e-ico{font-size:40px;margin-bottom:12px}
  .lv-doc-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .lv-doc-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 15px;border-radius:12px;text-decoration:none;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:rgba(255,255,255,.85);font-size:13.5px;
  }
  .lv-doc-item:active{background:rgba(255,255,255,.1)}
  .lv-doc-arrow{color:rgba(255,255,255,.35);font-size:15px}
</style>
</head>
<body data-page="immersive">

  <header class="lv-head">
    <button class="lv-back" id="lv-back" aria-label="返回">←</button>
    <div class="lv-title" id="lv-title">法律文档</div>
  </header>

  <main class="lv-body" id="lv-body">
    <div class="lv-loading">正在加载文档…</div>
  </main>

<script>
/* ---------- V20-G · 手机版法律阅读页 ----------
 * 用法：legal-view.html?doc=USER_AGREEMENT
 * 从 ../../docs/legal/{doc}.md 拉取原文，本地渲染成手机版排版 */
var DOC_TITLES = {
  USER_AGREEMENT: '用户服务协议',
  TERMS_OF_SERVICE: '服务条款',
  PRIVACY_POLICY: '隐私政策',
  INFORMED_CONSENT: '知情同意书',
  MINOR_BAN_NOTICE: '未成年人禁入声明',
  AI_DISCLAIMER: 'AI 免责声明',
  AI_COPYRIGHT_NOTICE: 'AI 版权声明',
  ENTER_WORLD_RISK_NOTICE: '进入世界风险提示',
  COPYRIGHT_COMPLAINT_PROCESS: '版权投诉流程',
  COPYRIGHT_CERTIFICATE: '版权证书',
  DUAL_SOUL_CHARACTER_NOTICE: '双生角色使用须知',
  EXPORT_COPYRIGHT_PAGE: '导出版权页',
  EXPORT_USER_PROMPT: '导出用户须知',
  NOVEL_AI_DISCLAIMER: '小说 AI 免责声明',
  UPLOAD_THIRD_PARTY_NOTICE: '上传第三方内容须知',
  LINGJING_USER_GUIDE: '用户指南'
};

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 极简 markdown → html（标题/列表/粗体/引用/分割线/段落） */
function md2html(md) {
  var lines = md.split(/\r?\n/);
  var out = [];
  var inList = null; /* 'ul' | 'ol' */
  function closeList() {
    if (inList) { out.push('</' + inList + '>'); inList = null; }
  }
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    var t = l.trim();
    if (!t) { closeList(); continue; }
    var m;
    if ((m = t.match(/^#{1}\s+(.+)/))) { closeList(); out.push('<h1>' + esc(m[1]) + '</h1>'); }
    else if ((m = t.match(/^#{2}\s+(.+)/))) { closeList(); out.push('<h2>' + esc(m[1]) + '</h2>'); }
    else if ((m = t.match(/^#{3,}\s+(.+)/))) { closeList(); out.push('<h3>' + esc(m[1]) + '</h3>'); }
    else if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closeList(); out.push('<hr>'); }
    else if ((m = t.match(/^>\s?(.*)/))) { closeList(); out.push('<blockquote>' + esc(m[1]) + '</blockquote>'); }
    else if ((m = t.match(/^[-*+]\s+(.+)/))) {
      if (inList !== 'ul') { closeList(); out.push('<ul>'); inList = 'ul'; }
      out.push('<li>' + esc(m[1]) + '</li>');
    }
    else if ((m = t.match(/^\d+[.、)]\s+(.+)/))) {
      if (inList !== 'ol') { closeList(); out.push('<ol>'); inList = 'ol'; }
      out.push('<li>' + esc(m[1]) + '</li>');
    }
    else { closeList(); out.push('<p>' + esc(t) + '</p>'); }
  }
  closeList();
  return out.join('\n')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

document.getElementById('lv-back').addEventListener('click', function () {
  if (history.length > 1) history.back();
  else location.href = 'settings.html';
});

(function init() {
  var params = new URLSearchParams(location.search);
  var doc = (params.get('doc') || '').replace(/[^A-Z_]/g, '');
  var titleEl = document.getElementById('lv-title');
  var bodyEl = document.getElementById('lv-body');
  if (!doc) {
    var items = Object.keys(DOC_TITLES).map(function (k) {
      return '<a class="lv-doc-item" href="?doc=' + k + '">' + esc(DOC_TITLES[k]) + '<span class="lv-doc-arrow">›</span></a>';
    }).join('');
    titleEl.textContent = '法律文档 · 目录';
    bodyEl.innerHTML = '<h1>法律文档</h1><div class="lv-doc-list">' + items + '</div>';
    return;
  }
  titleEl.textContent = DOC_TITLES[doc] || doc;
  document.title = (DOC_TITLES[doc] || doc) + ' · 灵境 · 双生';
  fetch('../../docs/legal/' + doc + '.md')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) { bodyEl.innerHTML = md2html(md); })
    .catch(function () {
      bodyEl.innerHTML = '<div class="lv-error"><div class="e-ico">⚠️</div><div>文档加载失败</div><div style="font-size:12px;margin-top:6px;opacity:.6">' + esc(doc) + '</div><a href="?" style="display:inline-block;margin-top:14px;color:#8b7cf6;font-size:12.5px;">← 返回法律文档目录</a></div>';
    });
})();
</script>
</body>
</html>
