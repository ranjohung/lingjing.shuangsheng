<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>逐章创作台 · 创作者中心 · 灵境 · 双生</title>
<meta name="description" content="V21 三栏逐章创作台：章节列表 / 正文写作 / AI 辅助面板 + 质量检查" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/design-system.css" />
<style>
  * { box-sizing: border-box; }
  .wr-top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--bg-overlay); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-subtle); }
  .wr-back { color: var(--text-secondary); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .wr-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wr-finish { white-space: nowrap; }
  /* 三栏 20 / 55 / 25 */
  .wr-layout { display: grid; grid-template-columns: 20% 55% 25%; height: calc(100vh - 53px - 40px); }
  .wr-left, .wr-right { background: var(--bg-elevated); overflow-y: auto; padding: 12px 10px 20px; }
  .wr-left { border-right: 1px solid var(--border-subtle); }
  .wr-right { border-left: 1px solid var(--border-subtle); }
  .wr-mid { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
  /* 左栏 */
  .lp-tabs { display: flex; gap: 4px; margin-bottom: 10px; position: sticky; top: -12px; background: var(--bg-elevated); padding: 4px 0; z-index: 5; }
  .lp-tab { flex: 1; padding: 7px 4px; border-radius: var(--r-md); border: 1px solid transparent; background: none;
    color: var(--text-tertiary); font-size: 12px; cursor: pointer; text-align: center; }
  .lp-tab.active { background: rgba(139,124,246,.14); border-color: rgba(139,124,246,.45); color: var(--text-primary); font-weight: 600; }
  .lp-panel { display: none; }
  .lp-panel.active { display: block; }
  .ch-item { padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; font-size: 12.5px; color: var(--text-secondary);
    border: 1px solid transparent; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .ch-item:hover { background: var(--bg-muted); }
  .ch-item.active { background: rgba(139,124,246,.12); border-color: rgba(139,124,246,.4); color: var(--text-primary); }
  .ch-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bg-muted); flex-shrink: 0; }
  .ch-dot.planned { background: var(--text-muted); }
  .ch-dot.writing { background: var(--brand-amber); }
  .ch-dot.done { background: var(--brand-green); }
  .ch-item .wc { margin-left: auto; font-size: 10px; color: var(--text-muted); }
  .lp-card { padding: 12px; border-radius: var(--r-md); background: var(--bg-muted); border: 1px solid var(--border-subtle); margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .lp-card b { color: var(--text-primary); font-size: 12.5px; display: block; margin-bottom: 4px; }
  .lp-add { width: 100%; margin-top: 4px; }
  .fs-status { font-size: 10px; padding: 1px 8px; border-radius: var(--r-full); background: rgba(251,191,36,.14); color: var(--brand-amber); }
  .fs-status.resolved { background: rgba(78,204,163,.14); color: var(--brand-green); }
  /* 中栏 */
  .wr-editor { flex: 1; display: flex; flex-direction: column; padding: 14px clamp(14px, 4%, 48px); overflow-y: auto; }
  .ed-title { border: none; background: none; outline: none; width: 100%; font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--text-primary); padding: 4px 0 10px; border-bottom: 1px solid var(--border-subtle); }
  .ed-goal { margin: 10px 0; padding: 9px 14px; border-radius: var(--r-md); background: rgba(232,199,90,.08); border: 1px solid rgba(232,199,90,.28); font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .ed-goal b { color: var(--brand-gold); }
  #ed-content { flex: 1; min-height: 300px; border: none; background: none; outline: none; resize: none; width: 100%;
    font-family: 'Noto Serif SC', serif; font-size: 15.5px; line-height: 2.0; color: var(--text-primary); }
  .ed-foot { text-align: right; font-size: 11px; color: var(--text-muted); padding: 8px 0 2px; }
  /* 右栏 AI */
  .ai-types { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 10px; }
  .ai-type { padding: 7px 4px; border-radius: var(--r-md); border: 1px solid var(--border-default); background: var(--bg-elevated);
    color: var(--text-tertiary); font-size: 12px; cursor: pointer; }
  .ai-type.active { background: rgba(232,199,90,.12); border-color: rgba(232,199,90,.4); color: var(--brand-gold); font-weight: 600; }
  #btn-ai-generate { width: 100%; margin-bottom: 10px; }
  #ai-ctx { font-size: 10.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; display: none; }
  .wr-cand { padding: 12px; border-radius: var(--r-md); background: var(--bg-elevated-strong); border: 1px solid var(--border-default); margin-bottom: 8px; }
  .cand-style { font-size: 10px; color: var(--brand-violet); font-weight: 600; margin-bottom: 5px; }
  .cand-text { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; white-space: pre-wrap; }
  .cand-use { width: 100%; }
  .wr-sub { font-size: 10px; font-weight: 600; letter-spacing: .14em; color: var(--text-muted); text-transform: uppercase; margin: 16px 0 8px; }
  .wr-chip { display: inline-block; padding: 4px 12px; border-radius: var(--r-full); border: 1px solid var(--border-default);
    background: var(--bg-muted); color: var(--text-secondary); font-size: 11.5px; margin: 0 6px 6px 0; cursor: pointer; }
  .wr-chip:hover { border-color: var(--brand-violet); color: var(--text-primary); }
  /* 底部状态栏 */
  .wr-status { position: sticky; bottom: 0; z-index: 50; display: flex; align-items: center; gap: 18px; padding: 9px 16px;
    background: var(--bg-overlay); backdrop-filter: blur(10px); border-top: 1px solid var(--border-subtle); font-size: 11.5px; color: var(--text-tertiary); }
  .wr-status b { color: var(--text-secondary); font-weight: 600; }
  #status-save.dirty { color: var(--brand-amber); }
  /* 空态 */
  .wr-empty { margin: 40px auto; max-width: 420px; text-align: center; padding: 30px 24px; border-radius: var(--r-xl);
    background: var(--bg-elevated); border: 1px dashed var(--border-strong); }
  /* 弹窗 */
  .wr-modal { position: fixed; inset: 0; background: rgba(8,7,26,.72); backdrop-filter: blur(8px); z-index: 90; display: grid; place-items: center; padding: 16px; }
  .wr-modal-card { width: 100%; max-width: 540px; max-height: 84vh; overflow-y: auto; background: var(--bg-overlay); border: 1px solid var(--border-default); border-radius: var(--r-xl); }
  .wr-modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-overlay); }
  .wr-modal-body { padding: 18px 20px; }
  .wr-modal-foot { padding: 12px 20px; border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; justify-content: flex-end; }
  .q-dim { display: flex; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--bg-elevated); border: 1px solid var(--border-subtle); margin-bottom: 8px; }
  .q-dim.pass { border-left: 3px solid var(--brand-green); }
  .q-dim.warn { border-left: 3px solid var(--brand-amber); }
  .q-dim.fail { border-left: 3px solid var(--brand-red); }
  .q-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-full); align-self: flex-start; }
  .q-badge.pass { background: rgba(74,222,128,.15); color: var(--brand-green); }
  .q-badge.warn { background: rgba(251,191,36,.15); color: var(--brand-amber); }
  .q-badge.fail { background: rgba(248,113,113,.15); color: var(--brand-red); }
  .q-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
  .q-issues { font-size: 11.5px; color: var(--text-tertiary); line-height: 1.7; }
  .q-score-box { text-align: center; padding: 14px 0 6px; }
  #q-score { font-family: var(--font-display); font-size: 40px; font-weight: 700; color: var(--brand-gold); }
  .fm-item { margin-bottom: 10px; }
  .fm-item label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .fm-item input, .fm-item textarea, .fm-item select { width: 100%; font-size: 12.5px; }
  /* 移动端堆叠（≤900px）：左栏在上、右栏底部弹出 */
  #wr-fab { display: none; }
  @media (max-width: 900px) {
    .wr-layout { display: block; height: auto; }
    .wr-left { border-right: none; border-bottom: 1px solid var(--border-subtle); max-height: 300px; }
    .lp-tabs { position: static; }
    #lp-chapters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .ch-item { flex: 0 0 auto; white-space: nowrap; }
    .wr-right { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 72vh; z-index: 95;
      transform: translateY(105%); transition: transform 260ms var(--ease-out); border-radius: 18px 18px 0 0;
      border-left: none; box-shadow: 0 -12px 40px rgba(0,0,0,.5); }
    .wr-right.sheet-open { transform: translateY(0); }
    #wr-fab { display: flex; position: fixed; right: 14px; bottom: 52px; z-index: 94; width: 46px; height: 46px;
      border-radius: 50%; align-items: center; justify-content: center; background: linear-gradient(120deg,#8b7cf6,#6ec6ff);
      color: #08071a; font-size: 19px; border: none; cursor: pointer; box-shadow: 0 6px 18px rgba(139,124,246,.45); }
    .wr-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .wr-sheet-close { background: var(--bg-muted); border: 1px solid var(--border-default); border-radius: var(--r-full); width: 30px; height: 30px; color: var(--text-secondary); cursor: pointer; }
    .wr-status { position: fixed; left: 0; right: 0; bottom: 0; }
  }
  @media (min-width: 901px) { .wr-sheet-head { display: none; } }
</style>
<link rel="stylesheet" href="css/mobile-lock.css" />
<style>
  /* V21 布局豁免（登记：PRD-v21 §4 / ALL_FUNCTIONS §15.3）：
     工作台类页面在 PC 视口解除 480px 锁定，实现三栏 20/55/25；≤900px 保持手机锁定 + 堆叠 */
  @media (min-width: 1024px) {
    body { max-width: none; box-shadow: none; border-left: none; border-right: none; }
  }
</style>
</head>
<body>

<header class="wr-top">
  <a class="wr-back" href="novel-outline.html">← 返回大纲</a>
  <span class="wr-title" id="wr-title">逐章创作台</span>
  <button class="ds-btn ds-btn-primary ds-btn-sm wr-finish" id="btn-finish-chapter">完成本章并质检</button>
</header>

<div class="wr-layout" id="wr-layout" style="display:none;">
  <!-- ============ 左栏 20% ============ -->
  <aside class="wr-left">
    <div class="lp-tabs" id="lp-tabs">
      <button class="lp-tab active" data-tab="chapters">章节</button>
      <button class="lp-tab" data-tab="outline">大纲</button>
      <button class="lp-tab" data-tab="chars">人物</button>
      <button class="lp-tab" data-tab="fs">伏笔</button>
    </div>
    <div class="lp-panel active" id="lp-chapters"></div>
    <div class="lp-panel" id="lp-outline"></div>
    <div class="lp-panel" id="lp-chars"></div>
    <div class="lp-panel" id="lp-fs"></div>
  </aside>

  <!-- ============ 中栏 55% ============ -->
  <section class="wr-mid">
    <div class="wr-editor">
      <input class="ed-title" id="ed-title" placeholder="本章标题…" />
      <div class="ed-goal" id="ed-goal"></div>
      <textarea id="ed-content" placeholder="从这里开始写正文。AI 候选会插入到光标后的文末…"></textarea>
      <div class="ed-foot" id="ed-count">0 字</div>
    </div>
  </section>

  <!-- ============ 右栏 25% ============ -->
  <aside class="wr-right" id="wr-right">
    <div class="wr-sheet-head"><b style="font-size:13px;">AI 辅助面板</b><button class="wr-sheet-close" id="wr-sheet-close">✕</button></div>
    <div class="wr-sub">AI 辅助面板</div>
    <div class="ai-types" id="ai-types">
      <button class="ai-type active" data-t="para_scene">场景描写</button>
      <button class="ai-type" data-t="para_dialogue">人物对话</button>
      <button class="ai-type" data-t="para_transition">剧情过渡</button>
      <button class="ai-type" data-t="para_psych">心理活动</button>
    </div>
    <button class="ds-btn ds-btn-gold ds-btn-sm" id="btn-ai-generate">🤖 生成候选（3-5 个）</button>
    <div id="ai-ctx"></div>
    <div id="ai-cands"></div>
    <div class="wr-sub">当前章目标</div>
    <div class="lp-card" id="rc-goal">—</div>
    <div class="wr-sub">出场人物</div>
    <div id="rc-chars"></div>
    <div class="wr-sub">未回收伏笔</div>
    <div id="rc-fs"></div>
  </aside>
</div>

<div class="wr-empty" id="wr-empty" style="display:none;">
  <div style="font-size:15px;font-weight:600;margin-bottom:8px;">章节规划还没锁定</div>
  <div style="font-size:12.5px;color:var(--text-tertiary);margin-bottom:14px;">逐章创作台以「已确认大纲 + 已锁定章节规划」为硬约束。<br>先去大纲页确认大纲并锁定章节规划。</div>
  <a class="ds-btn ds-btn-primary" href="novel-outline.html">去大纲与章节规划 →</a>
</div>

<button id="wr-fab" aria-label="AI 辅助面板">🤖</button>

<footer class="wr-status">
  <span id="status-save">● 未保存</span>
  <span>总字数 <b id="status-words">0</b></span>
  <span>版本 <b id="status-version">v1</b></span>
  <span>质量分 <b id="status-qscore">—</b></span>
</footer>

<script src="js/novel-sim-store.js"></script>
<script src="js/novel-sim-ai.js"></script>
<script>
  var AI = window.NovelSimAI, Store = window.NovelSimStore;
  var proj = Store.load();
  var curNo = 1;
  var aiType = 'para_scene';
  var lastReport = null;
  var saveTimer = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function curPlan() { return proj.chapter_plans[curNo - 1] || null; }

  /* ---------- init ---------- */
  function init() {
    if (!Store.plansLocked() || !proj.chapter_plans.length) {
      el('wr-empty').style.display = '';
      el('wr-layout').style.display = 'none';
      el('btn-finish-chapter').style.display = 'none';
      return;
    }
    el('wr-empty').style.display = 'none';
    el('wr-layout').style.display = '';
    var q = new URLSearchParams(location.search);
    var want = Number(q.get('chapter')) || 1;
    curNo = Math.min(Math.max(want, 1), proj.chapter_plans.length);
    el('wr-title').textContent = '逐章创作台 · ' + (proj.meta.title || '未命名作品');
    bindTabs();
    bindAITypes();
    bindEditor();
    el('btn-ai-generate').addEventListener('click', genCandidates);
    el('wr-fab').addEventListener('click', function () { el('wr-right').classList.toggle('sheet-open'); });
    el('wr-sheet-close').addEventListener('click', function () { el('wr-right').classList.remove('sheet-open'); });
    el('btn-finish-chapter').addEventListener('click', finishChapter);
    loadChapter(curNo);
  }

  /* ---------- 左栏页签 ---------- */
  function bindTabs() {
    document.querySelectorAll('.lp-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.lp-tab').forEach(function (x) { x.classList.remove('active'); });
        document.querySelectorAll('.lp-panel').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        el('lp-' + t.dataset.tab).classList.add('active');
      });
    });
    el('lp-chars').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'btn-add-char') openCharModal();
    });
    el('lp-fs').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'btn-add-fs') openFsModal();
    });
  }

  /* ---------- 渲染左栏 ---------- */
  function renderChapters() {
    el('lp-chapters').innerHTML = proj.chapter_plans.map(function (p, i) {
      var ch = proj.chapters[String(i + 1)];
      var n = i + 1;
      return '<div class="ch-item' + (n === curNo ? ' active' : '') + '" data-no="' + n + '">' +
        '<span class="ch-dot ' + (p.status || 'planned') + '"></span>第 ' + n + ' 章 · ' +
        esc((p.goal || '').slice(0, 9)) + '…' +
        '<span class="wc">' + ((ch && ch.wordcount) || 0) + ' 字</span></div>';
    }).join('');
    el('lp-chapters').querySelectorAll('.ch-item').forEach(function (c) {
      c.addEventListener('click', function () { switchChapter(Number(c.dataset.no)); });
    });
  }

  function renderOutlinePanel() {
    var b = proj.brief || {}, o = proj.outline, p = b.protagonist || {}, c = b.conflict || {};
    el('lp-outline').innerHTML =
      '<div class="lp-card"><b>创作简报</b>' +
      (b.genre ? '题材：' + esc(b.genre) + '<br>' : '') +
      (b.idea ? esc(b.idea.slice(0, 40)) + '<br>' : '') +
      (p.job ? '主角：' + esc(p.job) + '（' + esc(p.type || '单主角') + '）<br>' : '') +
      (c.type ? '冲突：' + esc(c.type) + ' · 驱动：' + esc(c.drive || '') + '<br>' : '') +
      (b.deep && b.deep.tone ? '基调：' + esc(b.deep.tone) : '') + '</div>' +
      '<div class="lp-card"><b>已锁定大纲 🔒</b>' +
      '主题：' + esc((o.theme || '').slice(0, 26)) + '<br>主线：' + esc((o.main_plot || '').slice(0, 30)) + '…</div>' +
      '<a class="ds-btn ds-btn-ghost ds-btn-sm lp-add" href="novel-outline.html">去大纲页修改 →</a>';
  }

  function renderCharsPanel() {
    var chars = proj.characters || [];
    el('lp-chars').innerHTML = (chars.length ? chars.map(function (c) {
      return '<div class="lp-card"><b>' + esc(c.name) + ' · ' + esc(c.role || '') + '</b>' +
        (c.personality ? esc(c.personality) + '<br>' : '') +
        (c.voice && c.voice.catchphrase && c.voice.catchphrase.length ? '口癖：' + esc(c.voice.catchphrase.join('/')) + '<br>' : '') +
        (c.voice && c.voice.forbidden && c.voice.forbidden.length ? '忌讳：' + esc(c.voice.forbidden.join('/')) : '') + '</div>';
    }).join('') : '<div class="lp-card">还没有人物小传。为出场人物建立语言指纹（口癖 / 忌讳词），质量检查会用它做一致性检测。</div>') +
      '<button class="ds-btn ds-btn-secondary ds-btn-sm lp-add" id="btn-add-char">＋ 添加人物</button>';
  }

  function renderFsPanel() {
    var fs = proj.foreshadows || [];
    var name = { introduced: '已埋设', hinted: '已暗示', revealed: '已揭示', resolved: '已回收' };
    el('lp-fs').innerHTML = (fs.length ? fs.map(function (f) {
      return '<div class="lp-card"><b>' + esc(f.content.slice(0, 16)) + (f.content.length > 16 ? '…' : '') +
        ' <span class="fs-status' + (f.status === 'resolved' ? ' resolved' : '') + '">' + (name[f.status] || f.status) + '</span></b>' +
        '埋设：第 ' + esc(f.introduced_ch) + ' 章 · 计划回收：第 ' + esc(f.resolution_planned || '—') + ' 章 · 重要度：' + esc(f.importance || '中') + '</div>';
    }).join('') : '<div class="lp-card">暂无伏笔。好伏笔 = 早埋晚收。记录下你埋的钩子，AI 会在质量检查里盯住它们。</div>') +
      '<button class="ds-btn ds-btn-secondary ds-btn-sm lp-add" id="btn-add-fs">＋ 埋伏笔</button>';
  }

  /* ---------- 渲染右栏辅助区 ---------- */
  function renderRight() {
    var plan = curPlan();
    el('rc-goal').innerHTML = plan
      ? '<b>第 ' + curNo + ' 章 · ' + esc((plan.goal || '').slice(0, 22)) + '…</b>' + esc(plan.conflict || '') +
        '<br><span style="color:var(--text-muted);font-size:11px;">' + esc(plan.prev || '') + ' · ' + esc(plan.next || '') + '</span>'
      : '—';
    var chars = (plan && plan.characters) || [];
    el('rc-chars').innerHTML = chars.length
      ? chars.map(function (n) { return '<span class="wr-chip" data-name="' + esc(n) + '">' + esc(n) + '</span>'; }).join('')
      : '<span style="font-size:11.5px;color:var(--text-muted);">本章未指定出场人物</span>';
    el('rc-chars').querySelectorAll('.wr-chip').forEach(function (chip) {
      chip.addEventListener('click', function () { showCharFinger(chip.dataset.name); });
    });
    var fs = (proj.foreshadows || []).filter(function (f) { return f.status !== 'resolved'; });
    el('rc-fs').innerHTML = fs.length
      ? fs.map(function (f) {
          return '<div class="lp-card" style="font-size:11.5px;"><b style="font-size:11.5px;">' + esc(f.content.slice(0, 14)) + '…</b>' +
            '埋设于第 ' + esc(f.introduced_ch) + ' 章 · 计划第 ' + esc(f.resolution_planned || '—') + ' 章回收<br>' +
            '<button class="ds-btn ds-btn-ghost" style="padding:2px 8px;font-size:10.5px;margin-top:6px;" data-fs="' + f.id + '" data-act="resolve">本章回收</button>' +
            '<button class="ds-btn ds-btn-ghost" style="padding:2px 8px;font-size:10.5px;margin-top:6px;margin-left:4px;" data-fs="' + f.id + '" data-act="due">计划本章回收</button></div>';
        }).join('')
      : '<span style="font-size:11.5px;color:var(--text-muted);">暂无未回收伏笔</span>';
    el('rc-fs').querySelectorAll('button[data-fs]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.act === 'resolve') Store.setForeshadowStatus(btn.dataset.fs, 'resolved');
        else {
          var fsAll = proj.foreshadows || [];
          fsAll.forEach(function (f) { if (f.id === btn.dataset.fs) f.resolution_planned = curNo; });
          proj.foreshadows = fsAll; Store.save(proj);
        }
        proj = Store.load(); renderFsPanel(); renderRight();
        showToast(btn.dataset.act === 'resolve' ? '已标记本章回收' : '已设为本章计划回收', 'success');
      });
    });
  }

  function showCharFinger(name) {
    var c = (proj.characters || []).filter(function (x) { return x.name === name; })[0];
    var body = c
      ? '<div style="font-size:12.5px;line-height:1.9;color:var(--text-secondary);">身份：' + esc(c.role || '—') + '<br>性格：' + esc(c.personality || '—') +
        '<br>口癖：' + esc((c.voice && c.voice.catchphrase || []).join(' / ') || '—') + '<br>忌讳词：' + esc((c.voice && c.voice.forbidden || []).join(' / ') || '—') + '</div>'
      : '<div style="font-size:12.5px;color:var(--text-tertiary);">「' + esc(name) + '」还没有语言指纹。建议先在左栏「人物」补全，质量检查会更准。</div>';
    openModal('👤 ' + name + ' · 语言指纹', body, '');
  }

  /* ---------- 中栏 ---------- */
  function loadChapter(no) {
    saveNow();
    curNo = no;
    var plan = curPlan();
    var ch = Store.getChapter(no) || { title: '', content: '' };
    el('ed-title').value = ch.title || ('第 ' + no + ' 章');
    el('ed-content').value = ch.content || '';
    el('ed-goal').innerHTML = '<b>本章目标（硬约束）</b>：' + esc((plan && plan.goal) || '—') +
      '<br><b>主要冲突</b>：' + esc((plan && plan.conflict) || '—') +
      '　<span style="color:var(--text-muted);">' + esc((plan && plan.prev) || '') + '</span>';
    renderChapters(); renderOutlinePanel(); renderCharsPanel(); renderFsPanel(); renderRight();
    updateCount();
    el('status-version').textContent = 'v' + Math.max(1, ((ch.versions || []).length || 0) + 1);
    refreshQScore();
    var url = new URL(location); url.searchParams.set('chapter', String(no));
    history.replaceState(null, '', url);
  }
  function switchChapter(no) { loadChapter(no); }

  function bindEditor() {
    ['ed-title', 'ed-content'].forEach(function (id) {
      el(id).addEventListener('input', function () {
        el('status-save').textContent = '● 未保存';
        el('status-save').classList.add('dirty');
        updateCount();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNow, 800);
      });
    });
  }
  function saveNow() {
    clearTimeout(saveTimer);
    var before = (Store.getChapter(curNo) || {}).content || '';
    var content = el('ed-content').value;
    Store.saveChapter(curNo, { title: el('ed-title').value, content: content });
    if (content.trim() && before.trim() === '') Store.setChapterStatus(curNo, 'writing');
    proj = Store.load();
    el('status-save').textContent = '● 已保存 ' + new Date().toTimeString().slice(0, 5);
    el('status-save').classList.remove('dirty');
    el('status-words').textContent = Store.totalWords();
    renderChapters();
  }
  function updateCount() {
    var n = el('ed-content').value.replace(/\s/g, '').length;
    el('ed-count').textContent = n + ' 字';
  }
  function refreshQScore() {
    var last = localStorage.getItem('lingjing_v521_lastq_' + curNo);
    el('status-qscore').textContent = last || '—';
  }

  /* ---------- AI 候选 ---------- */
  function bindAITypes() {
    document.querySelectorAll('.ai-type').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.ai-type').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        aiType = t.dataset.t;
      });
    });
  }

  function genCandidates() {
    var plan = curPlan();
    var res = AI.gen(aiType, { brief: proj.brief, plan: plan, chapterNo: curNo, charName: (plan && plan.characters && plan.characters[0]) || '主角' });
    el('ai-ctx').style.display = '';
    el('ai-ctx').textContent = res.context || '';
    drawCandidates(res);
  }

  function drawCandidates(res) {
    el('ai-cands').innerHTML = res.candidates.map(function (c, i) {
      return '<div class="wr-cand" data-i="' + i + '">' +
        '<div class="cand-style">' + esc(c.style) + (c.fromUser ? ' · 来自你的口述' : '') + '</div>' +
        '<div class="cand-text">' + esc(c.text) + '</div>' +
        '<button class="ds-btn ds-btn-secondary ds-btn-sm cand-use" data-i="' + i + '">使用</button></div>';
    }).join('') +
    '<div style="display:flex; gap:8px; margin-top:10px;">' +
      '<button class="ds-btn ds-btn-secondary ds-btn-sm" id="btn-cand-refresh" style="flex:1;">🔄 换一批</button>' +
      '<button class="ds-btn ds-btn-gold ds-btn-sm" id="btn-my-say" style="flex:1;">✏️ 我来说</button></div>' +
    '<textarea class="ds-textarea" id="my-say-input" rows="3" style="display:none;margin-top:8px;" placeholder="用你自己的话说想法，AI 负责格式化…"></textarea>' +
    '<button class="ds-btn ds-btn-primary ds-btn-sm" id="my-say-ok" style="display:none;width:100%;margin-top:8px;">格式化并加入候选</button>';
    el('ai-cands').querySelectorAll('.cand-use').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = res.candidates[Number(b.dataset.i)];
        useCandidate(c);
        Store.addAiLog(aiType + '_pick', res.context, res.candidates.length, Number(b.dataset.i));
      });
    });
    el('btn-cand-refresh').addEventListener('click', function () {
      drawCandidates(AI.gen(aiType, { brief: proj.brief, plan: curPlan(), chapterNo: curNo, charName: (curPlan() && curPlan().characters && curPlan().characters[0]) || '主角' }));
      showToast('已换一批（仍基于本章上下文）', 'info');
    });
    el('btn-my-say').addEventListener('click', function () {
      el('my-say-input').style.display = ''; el('my-say-ok').style.display = '';
      el('my-say-input').focus();
    });
    el('my-say-ok').addEventListener('click', function () {
      var t = el('my-say-input').value;
      if (!t.trim()) { showToast('先说说你的想法', 'error'); return; }
      var c = AI.formatUserText(aiType, t, { plan: curPlan(), chapterNo: curNo });
      if (c) { res.candidates.unshift(c); drawCandidates(res); showToast('已按你的口述生成候选', 'success'); }
    });
  }

  function useCandidate(c) {
    var box = el('ed-content');
    var sep = box.value && !box.value.endsWith('\n') ? '\n\n' : '';
    box.value = box.value + sep + c.text;
    saveNow(); updateCount();
    showToast('已插入正文（' + c.style + '）', 'success');
  }

  /* ---------- 质量检查 ---------- */
  function finishChapter() {
    saveNow();
    lastReport = AI.checkQuality(curNo);
    renderQualityModal(lastReport);
  }
  function renderQualityModal(rep) {
    openModal('🛡️ 质量检查 · 第 ' + curNo + ' 章',
      '<div class="q-score-box"><div id="q-score">' + rep.score + '</div><div style="font-size:12px;color:var(--text-tertiary);">' + rep.summary + '</div></div>' +
      rep.dims.map(function (d) {
        var badge = { pass: '通过', warn: '警告', fail: '问题' }[d.status];
        return '<div class="q-dim ' + d.status + '"><span class="q-badge ' + d.status + '">' + badge + '</span>' +
          '<div style="flex:1;"><div class="q-name">' + d.name + '</div><div class="q-issues">' +
          (d.issues.length ? d.issues.map(function (i) { return '· ' + esc(i.msg); }).join('<br>') : '无问题') + '</div></div></div>';
      }).join(''),
      '<button class="ds-btn ds-btn-secondary ds-btn-sm" id="btn-fix-all">🩹 一键修复</button>' +
      '<button class="ds-btn ds-btn-primary ds-btn-sm" id="btn-mark-done">✅ 标记本章完成</button>');
    el('btn-fix-all').addEventListener('click', function () {
      var r = AI.applyFixes(curNo);
      loadChapter(curNo);
      lastReport = AI.checkQuality(curNo);
      localStorage.setItem('lingjing_v521_lastq_' + curNo, String(lastReport.score));
      refreshQScore();
      el('wr-modal').remove();
      renderQualityModal(lastReport);
      showToast(r.actions.length ? ('已修复 ' + r.actions.length + ' 项') : '没有需要修复的问题', 'success');
    });
    el('btn-mark-done').addEventListener('click', function () {
      Store.setChapterStatus(curNo, 'done');
      localStorage.setItem('lingjing_v521_lastq_' + curNo, String(lastReport.score));
      proj = Store.load();
      el('wr-modal').remove();
      renderChapters();
      showToast('第 ' + curNo + ' 章已完成', 'success');
      if (curNo < proj.chapter_plans.length) {
        setTimeout(function () { loadChapter(curNo + 1); showToast('进入第 ' + (curNo + 1) + ' 章', 'info'); }, 500);
      }
    });
  }

  /* ---------- 添加人物 / 伏笔 ---------- */
  function openCharModal() {
    openModal('＋ 添加人物',
      '<div class="fm-item"><label>姓名</label><input id="fm-name" /></div>' +
      '<div class="fm-item"><label>身份 / 角色（主角 · 对手 · 配角…）</label><input id="fm-role" /></div>' +
      '<div class="fm-item"><label>性格</label><input id="fm-personality" /></div>' +
      '<div class="fm-item"><label>口癖 / 常用词（顿号分隔）</label><input id="fm-catch" placeholder="如：说真的、讲道理" /></div>' +
      '<div class="fm-item"><label>忌讳词（语言指纹 · 质检会拦截）</label><input id="fm-forbid" placeholder="如： OK、宝贝" /></div>' +
      '<div class="fm-item"><label>行为约束（永远不会做 / 总是做）</label><textarea id="fm-rules" rows="2"></textarea></div>',
      '<button class="ds-btn ds-btn-primary ds-btn-sm" id="fm-char-ok">保存</button>');
    el('fm-char-ok').addEventListener('click', function () {
      var name = el('fm-name').value.trim();
      if (!name) { showToast('姓名必填', 'error'); return; }
      Store.addCharacter({
        name: name, role: el('fm-role').value.trim() || '配角', personality: el('fm-personality').value.trim(),
        voice: { tone: '', catchphrase: el('fm-catch').value.split(/[，,、\s]+/).filter(Boolean), forbidden: el('fm-forbid').value.split(/[，,、\s]+/).filter(Boolean) },
        rules: { note: el('fm-rules').value.trim() }
      });
      proj = Store.load();
      el('wr-modal').remove();
      renderCharsPanel(); renderRight();
      showToast('人物已入库', 'success');
    });
  }
  function openFsModal() {
    openModal('＋ 埋伏笔',
      '<div class="fm-item"><label>伏笔内容</label><textarea id="ff-content" rows="2" placeholder="如：主角收到的旧铜牌"></textarea></div>' +
      '<div class="fm-item"><label>埋设章节</label><input id="ff-intro" type="number" value="' + curNo + '" /></div>' +
      '<div class="fm-item"><label>计划回收章节</label><input id="ff-resolve" type="number" placeholder="如 ' + (curNo + 3) + '" /></div>' +
      '<div class="fm-item"><label>重要度</label><select id="ff-import"><option>high</option><option selected>medium</option><option>low</option></select></div>',
      '<button class="ds-btn ds-btn-primary ds-btn-sm" id="ff-ok">保存</button>');
    el('ff-ok').addEventListener('click', function () {
      var content = el('ff-content').value.trim();
      if (!content) { showToast('先写下伏笔内容', 'error'); return; }
      Store.addForeshadow({ content: content, introduced_ch: Number(el('ff-intro').value) || curNo,
        resolution_planned: Number(el('ff-resolve').value) || null, importance: el('ff-import').value });
      proj = Store.load();
      el('wr-modal').remove();
      renderFsPanel(); renderRight();
      showToast('伏笔已登记', 'success');
    });
  }

  /* ---------- 通用弹窗 ---------- */
  function openModal(title, bodyHTML, footHTML) {
    el('wr-modal') && el('wr-modal').remove();
    var m = document.createElement('div');
    m.className = 'wr-modal'; m.id = 'wr-modal';
    m.innerHTML = '<div class="wr-modal-card"><div class="wr-modal-head"><b style="font-size:14px;">' + title + '</b>' +
      '<button class="ds-modal-close" id="wr-modal-close">✕</button></div>' +
      '<div class="wr-modal-body">' + bodyHTML + '</div>' +
      (footHTML ? '<div class="wr-modal-foot">' + footHTML + '</div>' : '') + '</div>';
    document.body.appendChild(m);
    m.addEventListener('click', function (e) { if (e.target === m) m.remove(); });
    el('wr-modal-close').addEventListener('click', function () { m.remove(); });
    return m;
  }

  function showToast(text, type) {
    type = type || 'info';
    var container = document.querySelector('.ds-toast-container');
    if (!container) { container = document.createElement('div'); container.className = 'ds-toast-container'; document.body.appendChild(container); }
    var icon = { success: '✓', error: '✕', info: 'ⓘ' }[type];
    var toast = document.createElement('div');
    toast.className = 'ds-toast ' + type;
    toast.innerHTML = '<div class="ds-toast-icon">' + icon + '</div><div class="ds-toast-body"><div class="ds-toast-desc">' + text + '</div></div>';
    container.appendChild(toast);
    setTimeout(function () { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; toast.style.transition = 'all 240ms'; setTimeout(function () { toast.remove(); }, 240); }, 2400);
  }

  window.addEventListener('beforeunload', function () { if (el('ed-content')) saveNow(); });
  init();
</script>

</body>
</html>
