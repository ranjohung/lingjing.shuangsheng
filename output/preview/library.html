<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>世界 · 灵境 · 双生</title>
<meta name="description" content="v17.0 · 世界功能区 · 7 子导航 + Banner 轮播 + 四大金刚 + 双列瀑布流 + 分类侧边栏 + 筛选结果页 + 同人区 + 搜索" />
<meta name="theme-color" content="#1A1A2E" />
<link rel="stylesheet" href="css/shell-v64.css" />
<style>
/* =================================================================
 * 灵境 · 双生 V17.0 — 世界功能区样式（V17-B）
 * 命名：ds-* 全部进 design-system.css 候选；本页内嵌便于单独预览
 * ================================================================= */
:root {
  --world: #00B894;
  --radius: 12px;
}

/* ---------- 顶部子导航（7 项） ---------- */
.ds-sub-nav {
  position: sticky; top: 56px; z-index: 40;
  display: flex; gap: 0;
  margin: 0;
  background: rgba(26, 26, 46, .88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.ds-sub-nav::-webkit-scrollbar { display: none; }
.ds-sub-nav .ds-sn {
  flex: 1; min-width: 64px;
  padding: 12px 8px;
  font-size: 13px; color: var(--sub);
  text-align: center;
  position: relative;
  cursor: pointer;
  transition: color .2s;
  white-space: nowrap;
}
.ds-sub-nav .ds-sn.active { color: var(--world); font-weight: 600; }
.ds-sub-nav .ds-sn.active::after {
  content: ''; position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 24px; height: 2px; border-radius: 1px;
  background: var(--world);
}
.ds-sub-nav .ds-sn:active { opacity: .6; }

/* ---------- 搜索框（仅 search 子项显示） ---------- */
.ds-search-box {
  display: none;
  align-items: center; gap: 10px;
  margin: 14px var(--margin) 0;
  padding: 12px 16px; border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--line);
}
.ds-search-box input {
  flex: 1; background: none; border: 0; outline: 0;
  color: var(--text); font-size: 15px;
}
.ds-search-box input::placeholder { color: rgba(160, 160, 176, .55); }
.ds-search-box .ico { color: var(--sub); }

/* ---------- Banner 轮播 ---------- */
.ds-banner {
  position: relative;
  margin: 10px var(--margin) 0;
  height: 22vh;
  max-height: 180px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
}
.ds-banner-track {
  display: flex; height: 100%;
  transition: transform .5s cubic-bezier(.16, 1, .3, 1);
}
.ds-banner-slide {
  flex: 0 0 100%; height: 100%;
  position: relative; display: block;
}
.ds-bs-bg { position: absolute; inset: 0; }
.ds-bs-mask {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .6) 100%);
}
.ds-bs-content {
  position: absolute; left: 20px; bottom: 22px; right: 20px;
  color: #fff;
}
.ds-bs-emoji { font-size: 28px; margin-bottom: 6px; }
.ds-bs-title { font-size: 22px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.ds-bs-sub { font-size: 13px; opacity: .8; }
.ds-banner-dots {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
}
.ds-banner-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255, 255, 255, .35);
  cursor: pointer; transition: all .2s;
}
.ds-banner-dot.active { width: 18px; border-radius: 3px; background: #fff; }

/* ---------- 四大金刚 ---------- */
.ds-quick-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin: 14px var(--margin) 0;
}
.ds-qg-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 12px 0;
  background: linear-gradient(135deg, rgba(108, 92, 231, .12), rgba(233, 69, 96, .08));
  border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--text); font-size: 11px;
  cursor: pointer;
  transition: transform .15s;
}
.ds-qg-item:active { transform: scale(.94); }
.ds-qg-item .ds-qg-ico { font-size: 22px; line-height: 1; }
.ds-qg-item .ds-qg-txt { color: var(--sub); }

/* ---------- 板块标题 + 右侧排序 ---------- */
.ds-board-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px var(--margin) 12px;
}
.ds-board-title {
  font-size: 16px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.ds-board-title::before {
  content: ''; width: 4px; height: 14px; border-radius: 2px;
  background: var(--world);
}
.ds-board-sort { display: flex; gap: 4px; }
.ds-sort {
  font-size: 11px; padding: 4px 8px; border-radius: 6px;
  color: var(--sub); cursor: pointer;
}
.ds-sort.active {
  color: var(--world);
  background: rgba(0, 184, 148, .12);
  font-weight: 600;
}

/* ---------- 双列瀑布流 ---------- */
.ds-waterfall {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0 var(--margin);
}
.ds-wf-card {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  color: var(--text);
  transition: transform .15s;
}
.ds-wf-card:active { transform: scale(.97); }
.ds-wf-cov {
  position: relative;
  width: 100%; padding-top: 140%; /* 1.4 倍高 */
  display: grid; place-items: center;
}
.ds-wf-emoji {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 36px;
}
.ds-corner-tag {
  position: absolute; top: 6px; left: 6px;
  padding: 2px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; color: #fff;
}
.ds-tag-new { background: rgba(78, 204, 163, .9); }
.ds-tag-done { background: rgba(0, 184, 148, .9); }
.ds-tag-pd { background: rgba(255, 179, 71, .9); }
.ds-wf-body { padding: 10px 12px 12px; }
.ds-wf-title {
  font-size: 14px; font-weight: 600; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ds-wf-author {
  font-size: 11px; color: var(--sub);
  margin-top: 4px; white-space: nowrap; overflow: hidden;
}
.ds-wf-tags { margin-top: 6px; }
.ds-wf-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: rgba(255, 255, 255, .04);
}
.ds-wf-meta {
  display: flex; justify-content: space-between;
  margin-top: 8px; font-size: 11px; color: var(--sub);
}
.ds-wf-score { color: var(--warn); }

/* ---------- 分类侧边栏 ---------- */
.ds-drawer-mask {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, .5);
  z-index: 70;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.ds-drawer-mask.open { opacity: 1; pointer-events: auto; }

.ds-drawer {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: 86vw; max-width: 420px;
  background: var(--bg);
  border-right: 1px solid var(--line);
  z-index: 71;
  transform: translateX(-100%);
  transition: transform .3s cubic-bezier(.16, 1, .3, 1);
  display: flex; flex-direction: column;
}
.ds-drawer.open { transform: translateX(0); }
.ds-drawer-head {
  padding: 14px var(--margin);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.ds-drawer-head h3 { font-size: 16px; font-weight: 600; }
.ds-drawer-close {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, .06);
  border: 1px solid var(--line);
  font-size: 14px;
}
.ds-drawer-body {
  flex: 1; display: flex;
  overflow: hidden;
}
.ds-drawer-cat-list {
  width: 30%;
  background: var(--card-2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.ds-d-cat {
  padding: 14px 16px;
  font-size: 14px; color: var(--sub);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .15s;
}
.ds-d-cat.active {
  background: var(--bg);
  color: var(--world);
  border-left-color: var(--world);
  font-weight: 600;
}
.ds-drawer-tag-list {
  flex: 1;
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  align-content: start;
  overflow-y: auto;
}
.ds-d-tag {
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 13px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
}
.ds-d-tag:active {
  background: rgba(0, 184, 148, .15);
  border-color: var(--world);
  color: var(--world);
}

/* ---------- 空状态 ---------- */
.ds-empty {
  margin: 40px var(--margin);
  text-align: center; color: var(--sub); font-size: 13px;
  padding: 40px 20px;
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

/* ---------- 全部分类快捷按钮（顶部悬浮） ---------- */
.ds-cat-trigger {
  position: fixed;
  bottom: 84px; left: 50%; transform: translateX(-50%);
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--world), #00D2A8);
  color: #fff;
  display: grid; place-items: center;
  font-size: 22px;
  box-shadow: 0 8px 24px rgba(0, 184, 148, .4);
  z-index: 50;
  border: 1px solid rgba(255, 255, 255, .2);
  transition: transform .15s;
}
.ds-cat-trigger:active { transform: translateX(-50%) scale(.92); }

@media (max-width: 380px) {
  .ds-banner { height: 20vh; max-height: 160px; }
  .ds-bs-title { font-size: 18px; }
  .ds-waterfall { gap: 8px; }
  .ds-wf-cov { padding-top: 130%; }
}
</style>
</head>
<body>

<div id="app">

  <!-- 顶栏（v6.4 共享壳） -->
  <header class="topbar">
    <div class="topbar-title"><span class="dot"></span>世界</div>
    <div class="topbar-acts">
      <button class="icon-btn" onclick="window.LJWorld.goSub('search')" title="搜索">🔍</button>
      <button class="icon-btn" onclick="window.LJWorld.showToast('warn','3 条未读','通知中心即将开放')" title="通知">🔔<span class="badge">3</span></button>
      <a class="icon-btn" href="me.html" title="我的">👤</a>
    </div>
  </header>

  <main>
    <!-- 7 项顶部子导航 -->
    <nav class="ds-sub-nav" id="ds-sub-nav">
      <div class="ds-sn active" data-sn="home">首页</div>
      <div class="ds-sn" data-sn="rank">排行榜</div>
      <div class="ds-sn" data-sn="xinyu">心屿推</div>
      <div class="ds-sn" data-sn="welfare">福利</div>
      <div class="ds-sn" data-sn="chuangshibei">创世杯</div>
      <div class="ds-sn" data-sn="tongren">同人区</div>
      <div class="ds-sn" data-sn="search">🔍</div>
    </nav>

    <!-- 搜索框（仅 search 子项可见） -->
    <div class="ds-search-box" id="ds-search-box">
      <span class="ico">🔍</span>
      <input type="search" id="ds-search-input" placeholder="搜作品名 / 作者名 / 题材" />
    </div>

    <!-- Banner 轮播（首页/其他子项共用） -->
    <section class="ds-banner" id="ds-banner" style="display:none">
      <div class="ds-banner-track" id="ds-banner-track"></div>
      <div class="ds-banner-dots" id="ds-banner-dots"></div>
    </section>

    <!-- 四大金刚 -->
    <section class="ds-quick-grid" id="ds-quick-grid">
      <div class="ds-qg-item" data-action="cat">
        <span class="ds-qg-ico">⊞</span>
        <span class="ds-qg-txt">全部分类</span>
      </div>
      <div class="ds-qg-item" data-action="calendar">
        <span class="ds-qg-ico">📅</span>
        <span class="ds-qg-txt">更新日历</span>
      </div>
      <div class="ds-qg-item" data-action="classic">
        <span class="ds-qg-ico">👑</span>
        <span class="ds-qg-txt">经典必看</span>
      </div>
      <div class="ds-qg-item" data-action="create">
        <span class="ds-qg-ico">✍</span>
        <span class="ds-qg-txt">创作</span>
      </div>
    </section>

    <!-- 主内容容器（动态渲染） -->
    <div id="ds-main"></div>
  </main>

  <!-- 全部分类悬浮按钮（仅非同人区显示） -->
  <button class="ds-cat-trigger" id="ds-cat-trigger" title="全部分类">⊞</button>

  <!-- 分类侧边栏 -->
  <div class="ds-drawer-mask" id="ds-drawer-mask"></div>
  <aside class="ds-drawer" id="ds-drawer">
    <div class="ds-drawer-head">
      <h3>全部分类</h3>
      <button class="ds-drawer-close" id="ds-drawer-close">✕</button>
    </div>
    <div class="ds-drawer-body">
      <div class="ds-drawer-cat-list" id="ds-drawer-cat-list"></div>
      <div class="ds-drawer-tag-list" id="ds-drawer-tag-list"></div>
    </div>
  </aside>

  <!-- 5 Tab 底部（世界 active） -->
  <nav class="tabbar" id="tabbar-mount">
    <a class="tab t-home"  href="product-preview.html"><span class="ico">🏠</span><span>首页</span></a>
    <a class="tab t-world active" href="library.html"><span class="ico">📖</span><span>世界</span></a>
    <a class="tab t-xinyu" href="heart-island.html"><span class="ico">💬</span><span>心屿</span></a>
    <a class="tab t-create" href="creator-center.html"><span class="ico">✨</span><span>创作</span></a>
    <a class="tab t-me"    href="me.html"><span class="ico">👤</span><span>我的</span></a>
  </nav>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/world-data.js"></script>
<script src="js/world.js"></script>
<script src="js/tabbar.js"></script>
</body>
</html>
