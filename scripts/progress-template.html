<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>MIRAI · 产品开发进度</title><style>
:root{color-scheme:dark;font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#101722;color:#e9edf4}*{box-sizing:border-box}body{margin:0}header,main{max-width:1180px;margin:auto;padding:40px 28px}header{border-bottom:1px solid #2b3545;padding-bottom:28px}.brand{color:#b5a7e4;font-size:14px}h1{font-size:36px;font-weight:600;margin:14px 0}p{line-height:1.8;color:#9faabc}a{color:#cbbded}nav{display:flex;gap:20px;font-size:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 28px}.metric{border-left:2px solid #647599;padding:8px 20px}.metric strong{display:block;font-size:32px;margin-bottom:6px}.metric span{font-size:13px;color:#aab5c7}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}input,select,button{font:inherit;color:inherit;background:#192232;border:1px solid #34435b;border-radius:8px;padding:12px}input{flex:1;min-width:220px}button{cursor:pointer}input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #b5a7e4;outline-offset:3px}details{border-bottom:1px solid #2b3545;padding:18px 0}summary{cursor:pointer;display:grid;grid-template-columns:110px 1fr 115px;gap:16px;align-items:center;list-style:none}.id{font-size:12px;color:#92a0b7}.title{font-size:16px}.badge{font-size:12px;padding:6px 10px;border-radius:6px;background:#202d40;text-align:center}.partial{color:#e0c18b}.tested{color:#95d5c0}.todo{color:#aab5c7}.external{color:#eda7a7}.detail{padding:18px 0 0 126px;font-size:14px}.detail b{color:#c6cedb}.detail p{margin:4px 0 15px}.notice{padding:18px 22px;background:#192232;border-radius:12px;margin-bottom:26px;font-size:14px}.empty{padding:30px;text-align:center}footer{padding:24px 0;color:#7f8ca2;font-size:12px}@media(max-width:640px){header,main{padding:26px 18px}h1{font-size:27px}.summary{grid-template-columns:repeat(2,1fr)}summary{grid-template-columns:1fr auto}.id{grid-column:1/-1}.detail{padding-left:0}.title{font-size:14px}}@media print{input,select,button,nav{display:none}body{background:white;color:black}details{break-inside:avoid}}
</style><header><div class="brand">MIRAI 灵境 / 产品工作台</div><h1>把每一步进展，留在这里。</h1><p>按 PRD 逐项记录实现、证据和下一步。这里显示真实开发状态，不把演示页面当作产品完成。</p><nav><a href="http://localhost:3000/stories">打开产品预览</a><a href="#tasks">查看全部需求</a></nav></header><main><div class="summary" id="stats"></div><div class="notice">当前基线：吕布篇开发稿可通关，10项后端测试与前端构建通过。正式认证、安全审核、完整三部故事仍未验收。<br><span id="updated"></span> · 心跳每30分钟接续；网页每15秒检查更新；离线文件每60秒重新读取。筛选条件会保留。</div><div class="controls"><input id="search" aria-label="搜索需求" placeholder="搜索功能、编号或待办"><select id="filter" aria-label="状态筛选"><option value="all">全部状态</option><option value="partial">部分实现</option><option value="tested">开发测试通过</option><option value="external">外部待接</option><option value="todo">待开发</option></select><button id="expand">展开当前结果</button><button onclick="location.reload()">刷新文件</button></div><div id="tasks"></div><footer>状态来自 docs/PRD.md 与 docs/progress-evidence.json。开发测试通过不等于生产发布验收。</footer></main><script type="application/json" id="data">__DATA__</script><script>
let data=JSON.parse(document.getElementById('data').textContent);const labels={partial:'部分实现',tested:'开发测试通过',external:'外部待接',todo:'待开发'};const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};document.getElementById('updated').textContent='更新于 '+data.updated;
function stats(){document.getElementById('stats').replaceChildren();for(const [key,label] of [['all','需求总数'],['partial','部分实现'],['tested','开发测试通过'],['external','外部待接']]){const box=el('div',null,'metric');box.append(el('strong',String(key==='all'?data.tasks.length:data.tasks.filter(t=>t.status===key).length)),el('span',label));document.getElementById('stats').append(box)}}stats();
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('filter').value;const root=document.getElementById('tasks');root.replaceChildren();for(const t of data.tasks.filter(t=>(filter==='all'||t.status===filter)&&JSON.stringify(t).toLowerCase().includes(q))){const d=el('details'),s=el('summary'),b=el('div',null,'detail');s.append(el('span',t.id,'id'),el('span',t.title,'title'),el('span',labels[t.status],'badge '+t.status));for(const [label,text] of [['目标阶段',t.phase],['验收要求',t.acceptance],['当前证据',t.evidence],['下一步',t.next]])b.append(el('b',label),el('p',text));d.append(s,b);root.append(d)}if(!root.children.length)root.append(el('p','没有匹配的需求','empty'))}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);render();
try{const saved=JSON.parse(sessionStorage.getItem('mirai-progress-filter')||'{}');document.getElementById('search').value=saved.query||'';document.getElementById('filter').value=saved.filter||'all';render()}catch{}
setInterval(async()=>{try{sessionStorage.setItem('mirai-progress-filter',JSON.stringify({query:document.getElementById('search').value,filter:document.getElementById('filter').value}));if(location.protocol==='file:')return;const r=await fetch('development-progress.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const next=await r.json();if(next.updated!==data.updated){data=next;document.getElementById('updated').textContent='更新于 '+data.updated;stats();render()}}catch{}},15000);
if(location.protocol==='file:')setTimeout(()=>location.reload(),60000);
</script></html>
