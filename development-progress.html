</style><header><div class="brand">MIRAI 灵境 / 产品工作台</div><h1>把每一步进展，留在这里。</h1><p>按 PRD 逐项记录实现、证据和下一步。这里显示真实开发状态，不把演示页面当作产品完成。</p><nav><a href="http://localhost:3000/stories">打开产品预览</a><a href="#tasks">查看全部需求</a></nav></header><main><div class="summary" id="stats"></div><div class="notice">当前基线：吕布篇开发稿可通关，10项后端测试与前端构建通过。正式认证、安全审核、完整三部故事仍未验收。<br><span id="updated"></span> · 心跳每30分钟接续；网页每15秒检查更新；离线文件每60秒重新读取。筛选条件会保留。</div><div class="controls"><input id="search" aria-label="搜索需求" placeholder="搜索功能、编号或待办"><select id="filter" aria-label="状态筛选"><option value="all">全部状态</option><option value="partial">部分实现</option><option value="tested">开发测试通过</option><option value="external">外部待接</option><option value="todo">待开发</option></select><button id="expand">展开当前结果</button><button onclick="location.reload()">刷新文件</button></div><div id="tasks"></div><footer>状态来自 docs/PRD.md 与 docs/progress-evidence.json。开发测试通过不等于生产发布验收。</footer></main><script type="application/json" id="data">{"updated": "2026-09-09 20:43:45", "tasks": [{"id": "AUTH-01", "title": "注册登录、JWT、手机号/邮箱验证", "phase": "P0", "acceptance": "无凭证401；凭证校验服务端执行；开发身份不可进入生产", "status": "external", "evidence": "当前仍是开发占位，未验收", "next": "先实现失败关闭与接口契约，再接真实服务商"}, {"id": "AUTH-02", "title": "实名与年龄硬拦截", "phase": "P0", "acceptance": "服务商核验而非自填年龄；pending/active/frozen；未成年冻结；成年重新核验解冻", "status": "external", "evidence": "当前仍是开发占位，未验收", "next": "先实现失败关闭与接口契约，再接真实服务商"}, {"id": "AUTH-03", "title": "协议、知情同意、账号借用声明", "phase": "P0", "acceptance": "记录版本/时间；未签署不得游玩；设备异常/家长举报进入二次验证处置", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "AUTH-04", "title": "数据控制与注销", "phase": "P0", "acceptance": "对话/记忆/游玩记录查看删除、JSON导出；注销期限与硬删除一致；实名信息最小化", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "CHAR-01", "title": "角色DNA创建编辑与已有角色选择", "phase": "P0", "acceptance": "身份/背景/性格/价值观/喜恶/语言/边界保存；角色槽位服务端约束", "status": "partial", "evidence": "基本建角与伙伴页；本地SD生成成年写实立绘并接入引导/伙伴页；Blender已导出基础GLB，尚非写实成品", "next": "完整DNA持久化；多人物一致性立绘；3D皮肤贴图、毛发、手部 ce": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "BILL-01", "title": "微信/支付宝/订阅/Credits", "phase": "P1", "acceptance": "国内支付验签、幂等、防重放、退款/取消、权益；赠送月清/购买保留；原价格仅候选配置", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "GROWTH-01", "title": "推荐/裂变/活动", "phase": "P1", "acceptance": "归因与退出；以完整游玩率为核心，不能靠沉迷时长", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "CREATE-01", "title": "原创上传/可视化编辑器", "phase": "P2", "acceptance": "导入/编辑/校验/预览/版本发布/版权承诺/举报", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "DEEP-01", "title": "因果链/命运报告/共创", "phase": "P2", "acceptance": "从真实事件生成蝴蝶效应图、人生回顾；基础多结局已在P0", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}, {"id": "EXT-01", "title": "语音/移动端/语言/3D/海外", "phase": "后续", "acceptance": "STT/TTS失败不阻断文字；React Native；3D独立评估；保留世界日程/离线演进/AI Director/授权IP/记忆图谱方向", "status": "todo", "evidence": "尚无完成证据", "next": "按PRD实施并验证"}]}</script><script>
let data=JSON.parse(document.getElementById('data').textContent);const labels={partial:'部分实现',tested:'开发测试通过',external:'外部待接',todo:'待开发'};const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};document.getElementById('updated').textContent='更新于 '+data.updated;
function stats(){document.getElementById('stats').replaceChildren();for(const [key,label] of [['all','需求总数'],['partial','部分实现'],['tested','开发测试通过'],['external','外部待接']]){const box=el('div',null,'metric');box.append(el('strong',String(key==='all'?data.tasks.length:data.tasks.filter(t=>t.status===key).length)),el('span',label));document.getElementById('stats').append(box)}}stats();
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('filter').value;const root=document.getElementById('tasks');root.replaceChildren();for(const t of data.tasks.filter(t=>(filter==='all'||t.status===filter)&&JSON.stringify(t).toLowerCase().includes(q))){const d=el('details'),s=el('summary'),b=el('div',null,'detail');s.append(el('span',t.id,'id'),el('span',t.title,'title'),el('span',labels[t.status],'badge '+t.status));for(const [label,text] of [['目标阶段',t.phase],['验收要求',t.acceptance],['当前证据',t.evidence],['下一步',t.next]])b.append(el('b',label),el('p',text));d.append(s,b);root.append(d)}if(!root.children.length)root.append(el('p','没有匹配的需求','empty'))}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);render();
try{const saved=JSON.parse(sessionStorage.getItem('mirai-progress-filter')||'{}');document.getElementById('search').value=saved.query||'';document.getElementById('filter').value=saved.filter||'all';render()}catch{}
setInterval(async()=>{try{sessionStorage.setItem('mirai-progress-filter',JSON.stringify({query:document.getElementById('search').value,filter:document.getElementById('filter').value}));if(location.protocol==='file:')return;const r=await fetch('development-progress.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const next=await r.json();if(next.updated!==data.updated){data=next;document.getElementById('updated').textContent='更新于 '+data.updated;stats();render()}}catch{}},15000);
if(location.protocol==='file:')setTimeout(()=>location.reload(),60000);
