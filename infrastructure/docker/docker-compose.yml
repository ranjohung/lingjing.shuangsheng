services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mirai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mirai
      POSTGRES_PASSWORD: local_dev_pass
      POSTGRES_DB: mirai
    ports:
      - "5432:5432"
    volumes:
      - mirai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mirai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - mirai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mirai_pgdata:
  mirai_redisdata:
